var ENDPOINT = 'https://moes-app-two.vercel.app/api/deploy';
var SECRET = 'moes-deploy-2026';

function b64ToUtf8(b64){
  var bin = atob(b64); var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function rowEl(p){
  var d = document.createElement('div'); d.className='row';
  d.innerHTML = '<span>'+p+'</span><span class="wait" id="st-'+p.replace(/[^a-z0-9]/gi,'_')+'">waiting</span>';
  document.getElementById('list').appendChild(d);
  return document.getElementById('st-'+p.replace(/[^a-z0-9]/gi,'_'));
}

async function pushOne(f, st){
  st.textContent='pushing...'; st.className='wait';
  try{
    var res = await fetch(ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({secret:SECRET, path:f.path, content:b64ToUtf8(f.b64), message:'Rebuild: '+f.path})
    });
    var data = await res.json();
    if(res.ok && data.ok){ st.textContent='OK'; st.className='ok'; return true; }
    st.textContent='FAIL: '+(data.error||res.status).toString().slice(0,60); st.className='fail'; return false;
  }catch(e){ st.textContent='FAIL: '+e.message.slice(0,60); st.className='fail'; return false; }
}

async function run(){
  document.getElementById('go').disabled=true;
  document.getElementById('list').innerHTML='';
  var okCount=0, failCount=0;
  for (var i=0;i<FILES.length;i++){
    var st = rowEl(FILES[i].path);
    var ok = await pushOne(FILES[i], st);
    if(ok) okCount++; else failCount++;
    await new Promise(function(r){setTimeout(r,800)}); // gentle pacing
  }
  var s = document.getElementById('summary');
  if(failCount===0){ s.innerHTML='&#9989; All '+okCount+' files pushed. Vercel is rebuilding now &mdash; check email in ~2 min, then hard-refresh the app.'; s.className='ok'; }
  else { s.innerHTML='&#9888;&#65039; '+okCount+' pushed, '+failCount+' failed. Tap UPDATE EVERYTHING again &mdash; it safely retries.'; s.className='fail'; }
  document.getElementById('go').disabled=false;
}
</script></body></html>
