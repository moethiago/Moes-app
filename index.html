<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Moe App</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="app">

  <!-- HEADER -->

  <header id="header">

    <div class="logo">Moe App</div>

  </header>

  <!-- NAV -->

  <nav class="nav">

    <button class="nav-btn active" onclick="switchTab('feed')">Feed</button>

    <button class="nav-btn" onclick="switchTab('sports')">Sports</button>

    <button class="nav-btn" onclick="switchTab('health')">Health</button>

  </nav>

  <!-- FILTERS -->

  <div class="filters">

    <button class="filter active" onclick="setFilter('ALL')">All</button>

    <button class="filter" onclick="setFilter('F1')">F1</button>

    <button class="filter" onclick="setFilter('FOOTBALL')">Football</button>

    <button class="filter" onclick="setFilter('KSA')">KSA</button>

  </div>

  <!-- MAIN FEED -->

  <main id="feed-container"></main>

</div>

<script src="app.js"></script>

</body>

</html>
