<!-- index.html -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Moe's App</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="app">

<header id="header">

  <div id="header-inner">

    <span class="logo">Moe's App</span>

    <div class="hdr-right">

      <span class="live-pill"><span class="pulse"></span>LIVE</span>

      <span class="hdr-time" id="clock">--:--</span>

    </div>

  </div>

</header>

<nav id="top-nav">

  <div class="nav-inner">

    <button class="nav-btn active" onclick="switchTab('feed')">Feed</button>

    <button class="nav-btn" onclick="switchTab('sports')">Sports</button>

    <button class="nav-btn" onclick="switchTab('health')">Health</button>

  </div>

</nav>

<div id="scroll-wrap">

<div class="tab-panel active" id="panel-feed">

  <div id="feed-container"></div>

</div>

<div class="tab-panel" id="panel-sports">

  <div id="sports-container"></div>

</div>

<div class="tab-panel" id="panel-health">

  <div id="health-container"></div>

</div>

</div>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
