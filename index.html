<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Moe's App</title>

  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Your CSS -->

  <link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="app">

  <!-- HEADER -->

  <header id="header">

    <div class="logo">Moe's App</div>

  </header>

  <!-- NAV -->

  <nav class="nav-inner">

    <button class="nav-btn active" onclick="switchTab('feed')">Feed</button>

    <button class="nav-btn" onclick="switchTab('sports')">Sports</button>

    <button class="nav-btn" onclick="switchTab('health')">Health</button>

  </nav>

  <!-- FILTERS -->

  <div class="filter-row">

    <span class="fpill active" onclick="setFeedFilter('ALL',this)">All</span>

    <span class="fpill" onclick="setFeedFilter('F1',this)">F1</span>

    <span class="fpill" onclick="setFeedFilter('FOOTBALL',this)">Football</span>

    <span class="fpill" onclick="setFeedFilter('KSA',this)">KSA</span>

  </div>

  <!-- CONTENT -->

  <div id="feed-container">

    <div class="wire-item">

      <div class="wire-headline">Loading news...</div>

      <div class="wire-meta">please wait</div>

    </div>

  </div>

</div>

<!-- JS -->

<script src="./app.js"></script>

</body>

</html>
