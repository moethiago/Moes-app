name: backend tests
on:
  push:
    paths: ["api/**", "tests/**", "maqadi/**", "maham/**", "wain/**", "thoughts/**"]
  schedule:
    - cron: "0 4 * * *"   # daily 07:00 Riyadh
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: contract grid (offline, in-memory KV, zero cost)
        run: node tests/backend_contract.mjs ./api/health-check.js
      - name: wait for Vercel
        if: github.event_name == 'push'
        run: sleep 90
      - name: live smoke (read-only)
        run: bash tests/live_smoke.sh
  notify:
    needs: contract
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: open/refresh a failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 backend tests failing";
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "test-failure" });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nTrigger: ${context.eventName} · ${context.sha.slice(0,7)}`;
            if (open.length) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["test-failure"] });
