name: tabkh photo pools
# Collects real photos per dish from curated Wikimedia Commons categories for وش نطبخ؟. Free: no keys, no accounts.
on:
  workflow_dispatch:
    inputs:
      only: { description: "comma-separated dish keys to (re)collect; empty = all", required: false, default: "" }
  push:
    branches: [main]
    paths: ["tabkh/photo-dishes.json", "tabkh/tools/pool.mjs"]
permissions:
  contents: write
concurrency: { group: tabkh-pool, cancel-in-progress: false }
jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: collect
        env: { ONLY: "${{ github.event.inputs.only || '' }}" }
        run: node tabkh/tools/pool.mjs tabkh
      - name: commit (always)
        if: always()
        run: |
          cp tabkh/dish-candidates.json /tmp/dc.json 2>/dev/null || exit 0
          git config user.name "tabkh-photos"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/dc.json tabkh/dish-candidates.json; git add tabkh/dish-candidates.json
            git diff --cached --quiet && exit 0
            git commit -q -m "tabkh: dish photo pools" && git push -q origin HEAD:main && exit 0
            sleep 7
          done; exit 1
