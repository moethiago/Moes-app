<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#F3F4F6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6;--sf:#FFFFFF;--ink:#15171B;--dim:#6B7280;--dimmer:#A1A7B3;--line:#E6E8EC;
  --go:#1B7F4E;--go-soft:#E3F3EA;--late:#D64545;--late-soft:#FBE7E7;--soon:#C98A12;--soon-soft:#FCF1D8;
  --work:#DCE8FA;--home:#E9E6F6;--farm:#E2F3DC;--car:#FBE3E0;--money:#E0F2EC;--gov:#EAECF1;--fam:#FBE8DA;--errand:#FCF1D8;--health:#DDF2F4;--proj:#F8E4EE;--self:#F1EBE0;--other:#EBEDF1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);overscroll-behavior-y:none}
body{font-family:"Readex Pro",system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body.dragging{overflow:hidden;touch-action:none}
input,button,select,textarea{font-family:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 84px);min-height:100vh}

.hd{position:sticky;top:0;z-index:20;background:rgba(243,244,246,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
.hd .t{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hd h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.4px;line-height:1.2}
.hd .sub{font-size:13px;color:var(--dim);margin-top:2px}
.hd .act{flex:0 0 auto;display:flex;gap:8px}
.ver{position:absolute;top:calc(env(safe-area-inset-top) + 6px);inset-inline-end:16px;font-size:10.5px;color:var(--dimmer);font-weight:500}
.ic{width:40px;height:40px;border-radius:12px;background:var(--sf);box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-size:20px}
.ic.go{background:var(--go);color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:14px;padding:0 14px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.search input{flex:1;border:0;outline:none;background:none;padding:12px 0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--dimmer)}
.search .x{color:var(--dimmer);font-size:22px;padding:6px 0 6px 4px}

.pad{padding:0 16px}
.sec{margin-top:20px}
.sec h2{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.sec h2 button{font-size:12.5px;color:var(--go);font-weight:500}
.card{background:var(--sf);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.muted{color:var(--dim);font-size:13.5px;line-height:1.7}

.cap{background:var(--sf);border-radius:16px;padding:6px 8px 6px 14px;margin-top:12px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cap input{flex:1;border:0;outline:none;background:none;padding:12px 0;font-size:16px;min-width:0}
.cap input::placeholder{color:var(--dimmer)}
.cap button{flex:0 0 auto;background:var(--go);color:#fff;border-radius:12px;width:44px;height:40px;font-size:20px;font-weight:600}
.cap button:disabled{opacity:.35}
.quick{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;background:var(--sf);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;margin-top:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:var(--sf);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chips button.on{background:var(--ink);color:#fff}
.nag{background:var(--soon-soft);border-radius:18px;padding:14px 16px;margin-top:16px}
.nag b{display:block;font-size:15px;margin-bottom:2px}
.nag .why{font-size:12.5px;color:var(--soon);font-weight:600}
.nag .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.nag .acts button{flex:1 1 30%;background:var(--sf);border-radius:12px;padding:11px;font-size:13.5px;font-weight:600}
.rt{background:var(--sf);border-radius:16px;padding:6px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.rt .r{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.rt .r:last-child{border-bottom:0}
.rt .r .cb{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.rt .r .cb::before{content:"";position:absolute;inset:-11px}
.rt .r.on .cb{background:var(--go);border-color:var(--go)}
.rt .r.on .cb::after{content:"";width:8px;height:4px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.rt .r.on .nm{text-decoration:line-through;opacity:.45}
.rt .r .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.rt .r .tm{flex:0 0 auto;font-size:12px;color:var(--dim);font-weight:600}
.blk{font-size:11.5px;font-weight:700;color:var(--dimmer);letter-spacing:.4px;text-transform:uppercase;padding:12px 0 2px;display:flex;gap:6px;align-items:center}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--go)}
.wk{display:flex;flex-direction:column;gap:7px}
.wd{display:flex;gap:10px;align-items:flex-start;background:var(--sf);border-radius:14px;padding:11px 13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.wd.today{box-shadow:inset 0 0 0 2px var(--go)}
.wd .d{flex:0 0 54px;line-height:1.25;font-size:12.5px;font-weight:700;color:var(--dim);padding-top:2px}
.wd.today .d{color:var(--go)}
.wd .items{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.wd .items span{background:var(--bg);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:500}
.wd .items .none{background:none;color:var(--dimmer);padding-inline:0}
.find{background:var(--go-soft);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.find b{display:block;font-size:15px}
.find .why{font-size:12.5px;color:var(--go);font-weight:600;margin-top:2px}
.find .acts{display:flex;gap:8px;margin-top:12px}
.find .acts button{flex:1;background:var(--sf);border-radius:12px;padding:11px;font-size:13.5px;font-weight:600}
.days{display:flex;gap:6px}
.days button{flex:1;background:var(--bg);border-radius:10px;padding:11px 0;font-size:13px;font-weight:700;color:var(--dim)}
.days button.on{background:var(--go);color:#fff}
.cnt{font-size:12px;font-weight:700;color:var(--dim)}
.cnt.full{color:var(--late)}
.row .badge{flex:0 0 auto;background:var(--soon-soft);color:var(--soon);font-size:11px;font-weight:700;border-radius:999px;padding:3px 7px}
.row .nm em{font-style:normal;color:var(--dim);font-weight:400}
.sum{background:var(--sf);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sum .big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.sum .big small{font-size:14px;color:var(--dim);font-weight:500;margin-inline-start:6px}
.fld textarea{width:100%;background:var(--bg);border:0;border-radius:12px;padding:13px 14px;font-size:15px;outline:none;min-height:84px;resize:vertical;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 0}
.tile{position:relative;aspect-ratio:1/1.06;border-radius:20px;background:var(--tint,var(--other));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 8px;text-align:center;transition:transform .12s ease;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:active{transform:scale(.95)}
.tile .pic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;background:rgba(255,255,255,.55)}
.tile .nm{font-size:12.5px;font-weight:500;line-height:1.3;max-height:2.6em;overflow:hidden}
.tile .nm small{display:block;font-size:10.5px;color:var(--dim);font-weight:400}
.tile .on{position:absolute;inset:0;background:rgba(27,127,78,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:13px;border-radius:20px;animation:pop .18s ease}
.tile .on i{font-style:normal;font-size:28px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.tile.add{background:var(--sf);border:2px dashed var(--line);box-shadow:none;color:var(--dim)}
.tile.add .pic{background:none;font-size:34px;color:var(--go)}
.tile .cnt{position:absolute;top:8px;inset-inline-end:10px;min-width:22px;height:22px;border-radius:999px;background:var(--go);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tile .del{position:absolute;top:6px;inset-inline-end:6px;width:26px;height:26px;border-radius:999px;background:var(--late);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tile .dot{position:absolute;top:10px;inset-inline-start:12px;width:8px;height:8px;border-radius:50%;background:var(--soon)}

.lane{margin-top:18px}
.lane h3{font-size:13px;font-weight:700;color:var(--dim);margin:0 0 8px;display:flex;align-items:center;gap:7px}
.lane h3 i{width:9px;height:9px;border-radius:3px;background:var(--c);font-style:normal}
.lane h3 span{color:var(--dimmer);font-weight:500}
.lane.over .drop{background:var(--go-soft);border-color:var(--go)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--dimmer);font-size:12.5px}
.row{display:flex;align-items:center;gap:11px;background:var(--sf);border-radius:14px;padding:13px 14px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.04);min-height:56px;touch-action:pan-y}
.row .cb{flex:0 0 auto;width:26px;height:26px;position:relative;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.row .cb::before{content:"";position:absolute;inset:-11px}
.row .em{flex:0 0 auto;font-size:21px;width:26px;text-align:center}
.row .nm{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.35}
.row .nm small{display:block;font-size:11.5px;color:var(--dim);font-weight:400}
.row .gr{flex:0 0 auto;width:26px;color:var(--dimmer);font-size:17px;line-height:1;text-align:center;letter-spacing:-1px}
.row.lift{position:fixed;z-index:70;margin:0;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:scale(1.03);pointer-events:none;opacity:.97}
.row.ghost{opacity:.28}
.ph{border:1.5px dashed var(--go);background:var(--go-soft);border-radius:14px;margin-bottom:7px}
.row.done{opacity:.5}
.row.done .nm{text-decoration:line-through}
.row.done .cb{background:var(--go);border-color:var(--go)}
.row.done .cb::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}

.sug{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sug:last-of-type{border-bottom:0}
.sug .em{font-size:21px;width:26px;text-align:center}
.sug .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.sug .nm small{display:block;font-size:11.5px;color:var(--dim);font-weight:400}
.sug .add{width:36px;height:36px;border-radius:11px;background:var(--go);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.sug .no{width:36px;height:36px;border-radius:11px;background:var(--bg);color:var(--dimmer);font-size:20px;display:flex;align-items:center;justify-content:center}

.hist{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hist:last-child{border-bottom:0}
.hist .d{flex:1;min-width:0}
.hist .d b{font-weight:600;font-size:14.5px}
.hist .d small{display:block;color:var(--dim);font-size:12px}
.link{color:var(--go);font-size:12.5px;font-weight:500}

.veil{position:fixed;inset:0;background:rgba(21,23,27,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:600px;background:var(--sf);border-radius:24px 24px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:88vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:700}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin-bottom:6px}
.fld input{width:100%;background:var(--bg);border:0;border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--bg);border-radius:14px;padding:13px 16px;font-size:15px;font-weight:600;flex:1 1 30%;text-align:center}
.opts button.on{background:var(--go-soft);color:var(--go);box-shadow:inset 0 0 0 1.5px var(--go)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;background:var(--bg);color:var(--dim)}
.cats button.on{color:var(--ink);background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cta{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;background:var(--go);color:#fff;border-radius:14px;padding:15px;font-size:15px;font-weight:600;text-align:center}
.btn.soft{background:var(--bg);color:var(--ink)}
.btn.red{background:var(--late-soft);color:var(--late)}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 92px);right:50%;transform:translateX(50%) translateY(24px);opacity:0;visibility:hidden;pointer-events:none;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:90;transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .22s,visibility 0s .22s;max-width:88vw;text-align:center}
.toast.show{transform:translateX(50%) translateY(0);opacity:1;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .22s,visibility 0s}
.toast button{margin-inline-start:14px;color:#8FE0B4;font-weight:700;font-size:13.5px;pointer-events:auto}
.net{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:50%;transform:translateX(50%);background:var(--soon-soft);color:var(--soon);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;z-index:60}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
.tabs .in{max-width:600px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--dimmer);font-size:11px;font-weight:600;position:relative}
.tabs button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.55}
.tabs button.on{color:var(--go)}
.tabs button.on i{filter:none;opacity:1}
.tabs .b{position:absolute;top:2px;inset-inline-start:50%;margin-inline-start:6px;background:var(--go);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px}

.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 30px;max-width:420px;margin:0 auto}
.gate h1{font-size:36px;font-weight:700;margin:0 0 6px}
.gate p{color:var(--dim);margin:0 0 26px;line-height:1.7}
.gate input{width:100%;background:var(--sf);border:0;border-radius:14px;padding:16px;font-size:22px;letter-spacing:6px;text-align:center;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gate .btn{margin-top:12px}
.gate .err{color:var(--late);font-size:13px;margin-top:10px;min-height:1.5em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate" class="gate hidden">
  <h1>Tasks</h1>
  <p>Your code once, then never again.</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="••••">
  <button class="btn" id="pinGo">Enter</button>
  <div class="err" id="pinErr"></div>
</div>

<div id="app" class="app hidden">
  <div class="hd" id="hd"></div>
  <div id="view"></div>
</div>

<div class="tabs hidden" id="tabs"><div class="in">
  <button data-v="pick" class="on"><i>✍️</i>Capture</button>
  <button data-v="list"><i>✅</i>Tasks<span class="b hidden" id="bList"></span></button>
  <button data-v="rout"><i>🔁</i>Routine</button>
  <button data-v="done"><i>📈</i>Review</button>
</div></div>

<button id="upd" class="net hidden" style="background:var(--go-soft);color:var(--go);top:calc(env(safe-area-inset-top) + 34px)">New version — tap to update</button>
<div id="net" class="net hidden">Offline â changes saved, will sync when you’re back</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var BUILD_ID="2.1", BUILD=BUILD_ID+" · 11 Sep 2026";
var API="https://moes-app-two.vercel.app/api/health-check";
var DAY=86400000;
var LANES=[{id:"today",name:"Today",c:"#D64545"},{id:"week",name:"This week",c:"#C98A12"},{id:"later",name:"Later",c:"#9AA1AD"}];
var CATS=[
 {id:"work",name:"Work",em:"💼"},
 {id:"proj",name:"My projects",em:"🚀"},
 {id:"money",name:"Money",em:"💰"},
 {id:"gov",name:"Paperwork",em:"📄"},
 {id:"farm",name:"Farm",em:"🌾"},
 {id:"home",name:"Home",em:"🏠"},
 {id:"car",name:"Car",em:"🚗"},
 {id:"fam",name:"Family",em:"👨‍👩‍👦"},
 {id:"errand",name:"Errands",em:"🛵"},
 {id:"health",name:"Health",em:"🩺"},
 {id:"self",name:"Personal",em:"🧠"},
 {id:"other",name:"Other",em:"📌"}
];
var CATALOG_V=4;
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DAYS1=["S","M","T","W","T","F","S"];
var BLOCKS=[{id:"early",name:"Early",em:"🌅",from:4,to:8},{id:"morning",name:"Morning",em:"☀️",from:8,to:12},{id:"midday",name:"Midday",em:"🍽️",from:12,to:15},{id:"afternoon",name:"Afternoon",em:"🌤️",from:15,to:18},{id:"evening",name:"Evening",em:"🌆",from:18,to:21},{id:"night",name:"Night",em:"🌙",from:21,to:28}];
function blockOf(id){for(var i=0;i<BLOCKS.length;i++)if(BLOCKS[i].id===id)return BLOCKS[i];return {id:"any",name:"Any time",em:"•",from:0,to:24};}
function blockForHour(h){for(var i=0;i<BLOCKS.length;i++){var b=BLOCKS[i],hh=h<4?h+24:h;if(hh>=b.from&&hh<b.to)return b.id;}return "night";}
function hasSched(t){return !!(t&&t.sched&&t.sched.type&&t.sched.type!=="off");}
function dueOn(t,date){
  if(!hasSched(t))return false;

    var batch=pending.slice(),ok=await push();
    if(!ok){batch.forEach(function(o){apply(S,o);});ok=await push();if(!ok){batch.forEach(function(o){apply(S,o);});ok=await push();}}
    if(ok){pending=pending.slice(batch.length);cacheLocal();}
  }catch(e){if(String(e.message)==="pin"||String(e.message)==="role")gate(String(e.message)==="role"?"That code doesn’t open Tasks":"Wrong code");}
  finally{saving=false;if(pending.length&&online)setTimeout(flush,1500);}
}

/* ================= intelligence ================= */
function suppressed(t){var d=t.dismissed||[];if(!d.length)return false;var last=d[d.length-1],streak=d.filter(function(x){return Date.now()-x<60*DAY;}).length;return Date.now()-last<Math.max(1,(t.cycle||7)*.5*streak)*DAY;}
function ratio(t){return (t.last&&t.cycle)?((Date.now()-t.last)/DAY)/t.cycle:null;}
function suggestions(max){
  return Object.keys(S.tasks).map(function(id){return S.tasks[id];})
    .filter(function(t){var r=ratio(t);return r!==null&&r>=.8&&!where(S,t.id)&&!suppressed(t);})
    .sort(function(a,b){return ratio(b)-ratio(a);}).slice(0,max||6);
}
function stuck(){
  var out=[];
  LANES.forEach(function(L){S.lanes[L.id].forEach(function(id){
    var t=S.tasks[id];if(!t)return;
    var age=t.placedAt?(Date.now()-t.placedAt)/DAY:0;
    if((t.moves||0)>=3||age>=21)out.push({t:t,lane:L.id,moves:t.moves||0,age:Math.round(age)});
  });});
  return out.sort(function(a,b){return (b.moves*10+b.age)-(a.moves*10+a.age);});
}
function leftovers(){
  var d=dayStart();
  return S.lanes.today.map(function(id){return S.tasks[id];}).filter(function(t){return t&&t.placedAt&&t.placedAt<d;});
}
function discover(){
  var out=[];
  Object.keys(S.tasks).forEach(function(id){
    var t=S.tasks[id];
    if(hasSched(t)||(t.schedNo||0)>=2)return;
    var ds=(t.doneAt||[]).filter(function(ts){return Date.now()-ts<120*DAY;});
    if(ds.length<3)return;
    var wd={},hr=[];
    ds.forEach(function(ts){var d=new Date(ts);wd[d.getDay()]=(wd[d.getDay()]||0)+1;hr.push(d.getHours());});
    var blocks={};hr.forEach(function(h){var b=blockForHour(h);blocks[b]=(blocks[b]||0)+1;});
    var topB=null;Object.keys(blocks).forEach(function(b){if(!topB||blocks[b]>blocks[topB])topB=b;});
    var blockSure=topB&&blocks[topB]/ds.length>=.6;
    // daily?
    var gaps=[],srt=ds.slice().sort(function(a,b){return a-b;});
    for(var i=1;i<srt.length;i++)gaps.push((srt[i]-srt[i-1])/DAY);
    var avg=gaps.length?gaps.reduce(function(a,c){return a+c;},0)/gaps.length:99;
    var topD=null;Object.keys(wd).forEach(function(d){if(!topD||wd[d]>wd[topD])topD=d;});
    if(gaps.length>=2&&avg<=1.6){
      out.push({t:t,n:ds.length,sched:{type:"daily",block:blockSure?topB:"any"},why:"You did this "+ds.length+" times, almost every day"+(blockSure?", usually "+blockOf(topB).name.toLowerCase():"")});
    } else if(topD!==null&&wd[topD]>=3&&wd[topD]/ds.length>=.6){
      out.push({t:t,n:wd[topD],sched:{type:"weekly",days:[Number(topD)],block:blockSure?topB:"any"},why:"You did this on "+DAYS[topD]+" "+wd[topD]+" times"+(blockSure?" in the "+blockOf(topB).name.toLowerCase():"")});
    }
  });
  return out.sort(function(a,b){return b.n-a.n;}).slice(0,4);
}
function popular(n){
  return Object.keys(S.tasks).map(function(id){return S.tasks[id];})
    .filter(function(t){return !where(S,t.id)&&((t.uses||0)>0||(t.doneAt||[]).length>0);})
    .sort(function(a,b){return ((b.uses||0)+(b.doneAt||[]).length)-((a.uses||0)+(a.doneAt||[]).length)||(b.last||0)-(a.last||0);})
    .slice(0,n||8);
}

/* ---- drag & drop ---- */
var drag=null;
function attachDrag(row,t,laneId){
  var sx=0,sy=0,timer=null,moved=false,tapped=true,onBox=false;
  function down(e){
    if(drag)return;
    onBox=!!(e.target&&e.target.closest&&e.target.closest(".cb"));
    var p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;moved=false;tapped=true;
    if(onBox)return;                       // the checkbox is its own target
    timer=setTimeout(function(){if(!moved){tapped=false;lift(row,t,laneId,sx,sy);}},260);
  }
  function move(e){
    var p=e.touches?e.touches[0]:e;
    if(!drag){if(Math.abs(p.clientY-sy)>8||Math.abs(p.clientX-sx)>8){moved=true;clearTimeout(timer);}return;}
    e.preventDefault();dragMove(p.clientX,p.clientY);
  }
  function up(e){
    clearTimeout(timer);
    if(drag){e.preventDefault();dragEnd();return;}
    if(onBox){onBox=false;return;}
    if(tapped&&!moved)sheetRow(t);
  }
  row.addEventListener("touchstart",down,{passive:true});
  row.addEventListener("touchmove",move,{passive:false});
  row.addEventListener("touchend",up);
  row.addEventListener("touchcancel",function(){clearTimeout(timer);if(drag)dragEnd();});
  row.addEventListener("mousedown",function(e){down(e);
    var mm=function(ev){move(ev);},mu=function(ev){up(ev);document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);};
    document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);});
  row.addEventListener("contextmenu",function(e){e.preventDefault();});
}
function lift(row,t,laneId,x,y){
  var rect=row.getBoundingClientRect();
  var ph=document.createElement("div");ph.className="ph";ph.style.height=rect.height+"px";
  row.parentNode.insertBefore(ph,row);
  row.classList.add("lift");
  row.style.width=rect.width+"px";row.style.left=rect.left+"px";row.style.top=rect.top+"px";
  document.body.appendChild(row);document.body.classList.add("dragging");
  drag={row:row,t:t,ph:ph,dx:x-rect.left,dy:y-rect.top,from:laneId,h:rect.height};
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  dragMove(x,y);
}
function dragMove(x,y){
  if(!drag)return;
  drag.row.style.left=(x-drag.dx)+"px";
  drag.row.style.top=(y-drag.dy)+"px";
  // autoscroll
  var vh=window.innerHeight;
  if(y<110)window.scrollBy(0,-14); else if(y>vh-130)window.scrollBy(0,14);
  // find target lane by vertical position of lane blocks
  var lanes=Array.prototype.slice.call(document.querySelectorAll(".lane"));
  var target=null;
  lanes.forEach(function(L){var b=L.getBoundingClientRect();if(y>=b.top-6&&y<=b.bottom+6)target=L;});
  if(!target){ // above the first / below the last
    if(lanes.length){var f=lanes[0].getBoundingClientRect();target=(y<f.top)?lanes[0]:lanes[lanes.length-1];}
  }
  if(!target)return;
  document.querySelectorAll(".lane").forEach(function(L){L.classList.toggle("over",L===target);});
  var body=target.querySelector(".body");
  var d=body.querySelector(".drop");if(d)d.remove();
  var rows=Array.prototype.slice.call(body.children).filter(function(c){return c.classList.contains("row");});
  var before=null;
  for(var i=0;i<rows.length;i++){var b=rows[i].getBoundingClientRect();if(y<b.top+b.height/2){before=rows[i];break;}}
  if(before)body.insertBefore(drag.ph,before);else body.appendChild(drag.ph);
  drag.lane=target.dataset.lane;
}
function dragEnd(){
  if(!drag)return;
  var d=drag;drag=null;
  document.body.classList.remove("dragging");
  var body=d.ph.parentNode,laneId=d.lane||d.from;
  var idx=Array.prototype.slice.call(body.children).filter(function(c){return c.classList.contains("row")||c.classList.contains("ph");}).indexOf(d.ph);
  d.row.classList.remove("lift");d.row.removeAttribute("style");
  if(d.row.parentNode)d.row.parentNode.removeChild(d.row);
  d.ph.remove();
  var cur=where(S,d.t.id);
  if(!cur||cur.lane!==laneId||cur.index!==idx){
    op("move",{id:d.t.id,lane:laneId,index:idx});
    if(cur&&cur.lane!==laneId)toast("Moved to "+lane(laneId).name);
  } else render();
}

  $("pinErr").textContent=err||"";
  $("pinGo").onclick=async function(){
    var p=$("pin").value.trim();if(!p)return;PIN=p;$("pinErr").textContent="";$("pinGo").textContent="…";
    try{await pull();localStorage.setItem("maham_pin",p);start();}
    catch(e){$("pinGo").textContent="Enter";$("pinErr").textContent=String(e.message)==="pin"?"Wrong code":(String(e.message)==="role"?"That code doesn’t open Tasks":"Couldn’t reach the server: "+e.message);}
  };
  $("pin").addEventListener("keydown",function(e){if(e.key==="Enter")$("pinGo").click();});
  setTimeout(function(){$("pin").focus();},80);
}
function start(){
  $("gate").classList.add("hidden");$("app").classList.remove("hidden");$("tabs").classList.remove("hidden");
  document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){view=b.dataset.v;window.scrollTo(0,0);render();};});
  render();flush();
  setInterval(poll,6000);setInterval(function(){checkUpdate(false);},5*60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){flush();poll();}});
}
(async function boot(){
  if(await checkUpdate(true))return;
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});}catch(e){}}
  loadLocal();
  PIN=localStorage.getItem("maham_pin")||"";
  if(!PIN){gate();return;}
  if(S){start();try{await pull();render();}catch(e){if(String(e.message)==="pin"||String(e.message)==="role")gate("Wrong code");}}
  else{try{await pull();start();}catch(e){gate(String(e.message)==="pin"?"Wrong code":(String(e.message)==="role"?"That code doesn’t open Tasks":"Couldn’t reach the server: "+e.message));}}
})();
})();
</script>
</body>
</html>
