<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#1B1D21">
<title>Lift</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#1B1D21;--iron2:#23262B;--iron3:#2D3137;--iron4:#3A3F46;
  --chalk:#ECEAE4;--chalk2:#AEB0B4;--chalk3:#767A80;--line:rgba(236,234,228,.08);
  --red:#E2453C;--blue:#2E7CF6;--yellow:#F2C335;--green:#2FAE72;--wc:#E2453C;
  --disp:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Archivo",-apple-system,system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--iron);color:var(--chalk);font:17px/1.4 var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.hidden{display:none!important}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
.ic.sm{width:17px;height:17px}.ic.lg{width:28px;height:28px}
.num{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums}
.mute{color:var(--chalk2)}.faint{color:var(--chalk3)}.small{font-size:14px}.tiny{font-size:12px}
.up{color:var(--green)}.down{color:var(--yellow)}.pr{color:var(--yellow)}
p{margin:0 0 10px}

/* ---------- page frame ---------- */
.hdr{position:sticky;top:0;z-index:20;background:rgba(27,29,33,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(var(--st) + 8px) 12px 10px;display:flex;align-items:center;gap:8px;min-height:60px;border-bottom:1px solid var(--line)}
.hdr .back{display:flex;align-items:center;gap:2px;font-weight:600;color:var(--chalk);padding:10px 12px 10px 4px;border-radius:12px;font-size:17px}
.hdr .back:active{background:var(--iron3)}
.hdr .ttl{flex:1;min-width:0;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl .s{font-size:13px;font-weight:500;color:var(--chalk2)}
.hdr .act{min-width:74px;text-align:right}
.hdr .act button{background:var(--chalk);color:#17191C;font-weight:700;border-radius:12px;padding:10px 14px;font-size:16px}
.page{padding:16px 16px calc(120px + var(--sb))}
.page.tabbed{padding-bottom:calc(110px + var(--sb))}
.root-top{padding:calc(var(--st) + 18px) 18px 4px}
.root-top .sub{color:var(--chalk2);font-size:15px}
.root-top h1{margin:2px 0 0;font-family:var(--disp);font-weight:800;font-size:44px;line-height:1}
section{margin:0 0 26px}
h2{font-size:16px;font-weight:700;color:var(--chalk2);margin:0 0 10px}
.card{background:var(--iron2);border-radius:20px;padding:16px}
.list{background:var(--iron2);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:62px}
.row:first-child{border-top:0}
button.row:active{background:var(--iron3)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--chalk2);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.row .end .num{font-size:24px;line-height:1;display:block}
.row.danger .t{color:var(--red)}
.thumb{width:52px;height:52px;border-radius:12px;background:#fff center/cover no-repeat;flex:none}
.thumb.none{display:grid;place-items:center;background:var(--iron3);color:var(--chalk3)}
.stripe{width:6px;align-self:stretch;border-radius:4px;background:var(--wc);flex:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--wc);flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:18px;padding:18px;font-weight:700;font-size:18px;background:var(--iron3);min-height:58px}
.btn.main{background:var(--chalk);color:#17191C}
.btn.line{background:transparent;border:1.5px solid var(--iron4)}
.btn.red{background:transparent;color:var(--red);border:1.5px solid rgba(226,69,60,.4)}
.btn:active{transform:scale(.985);opacity:.9}
.btn+.btn{margin-top:10px}
.link{color:var(--chalk);font-weight:600;padding:12px 4px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--iron4);text-underline-offset:4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 15px;border-radius:999px;background:var(--iron2);color:var(--chalk2);font-size:15px;font-weight:600;white-space:nowrap;min-height:42px}
.chip.on{background:var(--chalk);color:#17191C}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chip{padding:13px 0;text-align:center;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px 6px calc(6px + var(--sb));background:rgba(27,29,33,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 5px;color:var(--chalk3);font-size:12px;font-weight:600}
nav.tabs button.on{color:var(--chalk)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 74px);transform:translateX(-50%);z-index:200;background:var(--chalk);color:#17191C;padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center;max-width:92vw;pointer-events:none;animation:drop .3s cubic-bezier(.2,.8,.2,1)}
.toast.gold{background:var(--yellow)}
.empty{text-align:center;padding:30px 18px;color:var(--chalk2)}
.empty .ic{width:36px;height:36px;color:var(--chalk3);margin-bottom:10px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:14px;color:var(--chalk2);font-weight:600;margin-bottom:6px}
.field input{width:100%;background:var(--iron2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:18px;color:var(--chalk)}
.field input.big{font-family:var(--disp);font-weight:800;font-size:40px;padding:10px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--iron2);border-radius:16px;padding:14px 16px;font-weight:600;margin-bottom:14px}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--iron4);display:grid;place-items:center;flex:none}
.check.on .box{background:var(--chalk);border-color:var(--chalk);color:#17191C}

/* ---------- today ---------- */
.hero{position:relative;margin:14px 16px 24px;padding:20px 18px 18px;border-radius:24px;background:var(--iron2);overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--wc)}
.hero .k{color:var(--chalk2);font-size:15px}
.hero .w{font-family:var(--disp);font-weight:800;font-size:62px;line-height:.92;margin:6px 0 8px}
.hero .m{color:var(--chalk2);font-size:15px;margin-bottom:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 20px;text-align:center}
.wk .pl{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--iron4);color:var(--chalk3)}
.wk .pl.done{background:var(--c);border-color:var(--c);color:#111}
.wk .pl.plan{border-color:var(--c);color:var(--chalk)}
.wk .pl.miss{border-style:dashed;opacity:.5}
.wk .pl.off{border:0;background:var(--iron3);width:8px;height:8px;margin:13px auto 19px}
.wk .dn{font-size:12px;color:var(--chalk3)}
.wk.today .dn{color:var(--chalk);font-weight:700}

/* ---------- workout ---------- */
.exbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.exbar .nav{width:48px;height:48px;border-radius:14px;background:var(--iron2);display:grid;place-items:center}
.exbar .nav:disabled{opacity:.3}
.exbar .mid{flex:1;height:48px;border-radius:14px;background:var(--iron2);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.segs{display:flex;gap:3px;margin-bottom:16px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--iron3);position:relative;overflow:hidden}
.segs i b{position:absolute;inset:0;width:var(--p);background:var(--wc)}
.segs i.cur{outline:1.5px solid var(--chalk3);outline-offset:1px}
.media{position:relative;height:min(19vh,165px);border-radius:20px;overflow:hidden;background:#fff;display:block;width:100%}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media img.b{animation:flip 2.6s steps(1) infinite}
.media .tag{position:absolute;right:10px;bottom:10px;background:rgba(27,29,33,.82);color:var(--chalk);font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;display:flex;align-items:center;gap:5px}
.media.big{height:auto;aspect-ratio:4/3}
.exname{font-family:var(--disp);font-weight:800;font-size:34px;line-height:.95;margin:12px 0 4px}
.exm{color:var(--chalk2);font-size:15px;margin-bottom:12px}
.how{background:var(--iron2);border-radius:18px;padding:14px 16px 4px;margin-bottom:12px}
.how ol{margin:0;padding-left:20px}.how li{margin-bottom:10px}
.note{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--iron2);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;min-height:48px}
.noteedit{display:flex;gap:8px;margin-bottom:12px}
.noteedit input{flex:1;min-width:0;background:var(--iron2);border:1px solid var(--chalk3);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--chalk)}
.noteedit button{background:var(--chalk);color:#17191C;border-radius:14px;padding:0 16px;font-weight:700}
.coach{display:flex;gap:10px;padding:14px 16px;border-radius:18px;background:var(--iron2);margin-bottom:12px;font-size:16px}
.coach .ic{color:var(--wc);margin-top:1px}
.coach .wu{color:var(--chalk2);font-size:14px;margin-top:6px}
.doneset{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--iron2);border-radius:14px;padding:10px 14px;margin-bottom:6px;min-height:52px}
.doneset .n{font-weight:700;color:var(--chalk3);width:44px;font-size:14px}
.doneset .v{flex:1;font-family:var(--disp);font-weight:700;font-size:24px}
.doneset .f{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--iron3)}
.f1{color:var(--green)}.f2{color:var(--blue)}.f3{color:var(--red)}
.doneset.editing{outline:2px solid var(--chalk)}
.ctl{background:var(--iron3);border-radius:22px;padding:16px;margin:12px 0}
.ctl .lh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ctl .lh b{font-size:19px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steppers.one{grid-template-columns:1fr}
.stp{background:var(--iron);border-radius:16px;padding:8px 4px 10px;text-align:center}
.stp .lb{font-size:13px;color:var(--chalk2);font-weight:600}
.stp .row2{display:flex;align-items:center}
.stp .row2 button{width:48px;height:56px;border-radius:12px;display:grid;place-items:center;color:var(--chalk2)}
.stp .row2 button:active{background:var(--iron3)}
.stp input{width:100%;min-width:0;background:none;border:0;text-align:center;font-family:var(--disp);font-weight:800;font-size:46px;line-height:1;padding:0;color:var(--chalk)}
.stp input::placeholder{color:var(--chalk3)}
.feelq{text-align:center;font-weight:600;margin:16px 0 10px;color:var(--chalk2);font-size:15px}
.feels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feels button{border-radius:16px;padding:16px 4px 14px;background:var(--iron);border:2px solid var(--iron4);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:84px}
.feels button b{font-size:19px}
.feels button span{font-size:12px;color:var(--chalk2);line-height:1.2}
.feels button:active{transform:scale(.96)}
.feels .f1{border-color:rgba(47,174,114,.55)}.feels .f2{border-color:rgba(46,124,246,.55)}.feels .f3{border-color:rgba(226,69,60,.55)}
.restchip{display:inline-flex;align-items:center;gap:6px;background:var(--wc);color:#111;border-radius:999px;padding:3px 10px;font-weight:800;font-size:14px;margin-top:2px}
.restchip.go{background:var(--green)}
.restband{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--iron2);border:2px solid var(--wc);border-radius:20px;padding:12px 16px;margin-bottom:12px}
.restband .tm{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1;min-width:92px;font-variant-numeric:tabular-nums}
.restband .grow{flex:1;font-size:15px}
.restband.go{border-color:var(--green)}.restband.go .tm{color:var(--green)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.seg button{background:var(--iron);border-radius:12px;padding:10px 0;font-size:14px;font-weight:700;color:var(--chalk2);min-height:42px}
.seg button.on{background:var(--chalk);color:#17191C}
.mini{display:flex;align-items:center;background:var(--iron);border-radius:12px;height:42px}
.mini button{width:44px;height:42px;display:grid;place-items:center;color:var(--chalk2)}
.mini b{flex:1;text-align:center;font-size:15px}
.edrow{background:var(--iron2);border-radius:18px;padding:12px;margin-bottom:10px}
.edrow .top{display:flex;align-items:center;gap:12px}
.edrow .top .grow{flex:1;min-width:0;font-weight:600}
.edrow .tools{display:flex;gap:6px}
.edrow .tools button{width:42px;height:42px;border-radius:12px;background:var(--iron3);display:grid;place-items:center;color:var(--chalk2)}
.edrow .opts{display:grid;grid-template-columns:132px 1fr;gap:8px;margin-top:10px;align-items:center}
.sw{display:flex;gap:12px}
.sw button{width:42px;height:42px;border-radius:50%;background:var(--c);border:3px solid transparent}
.sw button.on{border-color:var(--chalk);box-shadow:0 0 0 2px var(--iron)}
.pickbar{position:fixed;left:16px;right:16px;width:auto;bottom:calc(16px + var(--sb));z-index:25;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.pick .row .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--iron4);display:grid;place-items:center;flex:none}
.pick .row.on .tick{background:var(--chalk);border-color:var(--chalk);color:#17191C}
.search{display:flex;align-items:center;gap:10px;background:var(--iron2);border-radius:16px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;padding:15px 0;font-size:17px;color:var(--chalk);outline:none}

/* ---------- numbers / charts ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px}
.stat{background:var(--iron2);border-radius:18px;padding:14px 12px}
.stat .v{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1}
.stat .l{font-size:13px;color:var(--chalk2);margin-top:4px}
.big{font-family:var(--disp);font-weight:800;font-size:78px;line-height:.9}
.big small{font-family:var(--body);font-size:18px;font-weight:600;color:var(--chalk2);margin-left:6px}
.delta{font-weight:700;font-size:15px}
.chart{width:100%;height:170px;display:block;margin-top:12px;overflow:visible}
.meter{height:10px;border-radius:6px;background:var(--iron3);overflow:hidden;margin:12px 0 10px}
.meter b{display:block;height:100%;background:var(--green);border-radius:6px}
.bigtitle{font-family:var(--disp);font-weight:800;font-size:54px;line-height:.92;margin:4px 0 6px}
.band{height:10px;border-radius:6px;background:var(--wc);width:72px;margin:8px 0 16px}
#gate{max-width:360px;margin:18vh auto 0;text-align:center;padding:24px}
#gate .logo{font-family:var(--disp);font-weight:800;font-size:76px;line-height:1}
#gate input{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:14px;text-align:center;width:220px;padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--iron2);color:var(--chalk);margin:26px 0 16px}
.err{color:var(--red);min-height:22px;margin-top:12px;font-size:15px}
#upd{position:fixed;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);z-index:210;background:var(--chalk);color:#17191C;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--iron3);color:var(--chalk2)}
.pill.off{background:var(--red);color:#fff}.pill.pend{background:var(--yellow);color:#111}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.media img.b{opacity:0}}

/* ===== v3.1: muscle maps, calmer workout screen ===== */
:root{--mc:var(--red)}
*{--ms:color-mix(in srgb,var(--mc) 42%,#3D424A)}
.bmap{display:block;width:100%;height:auto}
.duo{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;align-items:stretch}
.duo .media{height:auto;aspect-ratio:auto;min-height:150px}
.mapbox{background:var(--iron2);border-radius:20px;display:grid;place-items:center;padding:10px 6px}
.mapbox .bmap{max-height:150px}
.exm .mp{color:var(--chalk);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.pill2{display:inline-flex;align-items:center;gap:6px;background:var(--iron2);color:var(--chalk2);border-radius:999px;padding:6px 12px;font-size:14px}
.restband{padding:10px 16px}
.restband .tm{font-size:40px;min-width:84px}
.ctl .lh{align-items:center}
.tagup,.tagdn,.tagnew{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px}
.tagup{background:rgba(47,174,114,.16);color:var(--green)}.tagdn{background:rgba(242,195,53,.16);color:var(--yellow)}.tagnew{background:var(--iron);color:var(--chalk2)}
.wuline{font-size:14px;color:var(--chalk2);margin:-4px 0 10px}
.feels{margin-top:12px}
.feels button{min-height:64px;padding:12px 4px}
.feels button b{font-size:20px}
.feelhint{text-align:center;font-size:13px;color:var(--chalk3);margin-top:8px}
.donebox{text-align:center}.donebox .dt{font-weight:800;font-size:22px;margin:4px 0 14px}
.chipsets{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.cs{display:inline-flex;align-items:center;gap:7px;background:var(--iron2);border-radius:999px;padding:10px 14px;font-family:var(--disp);font-weight:700;font-size:20px;min-height:44px}
.cs.on{outline:2px solid var(--chalk)}
.fd{width:10px;height:10px;border-radius:50%;display:inline-block}
.fd.f1{background:var(--green)}.fd.f2{background:var(--blue)}.fd.f3{background:var(--red)}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tools2 button{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--iron2);border-radius:14px;padding:13px 8px;font-size:15px;font-weight:600;color:var(--chalk2);min-height:50px}
.herotop{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center}
.bmap.hero{width:112px}
.hero .w{font-size:54px}
.bigq{font-family:var(--disp);font-weight:800;font-size:36px;line-height:1;margin:6px 0 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{position:relative;background:var(--iron2);border-radius:20px;padding:12px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent;min-height:150px}

/* ---------- history ---------- */

/* ---------- the coach ----------

    if(lm>=it.hi&&lf<=2)return {k:0,r:it.hi,tag:"up",msg:lm+" minutes last time and it felt fine. Same time today, one notch steeper."};

    if(pk===km&&p.filter(function(x){return x.k===km;}).some(function(x){return x.r<it.lo;})){var dk=r2(Math.ceil(km*0.9/st_-1e-9)*st_);if(dk>=km)dk=Math.max(0,roundTo(km-st_,st_));

/* after each set: what the NEXT set should be, from that set's reps and feel */

  if(r>=it.hi+3)return {k:roundTo(k+st_*mult,st_),r:it.lo,msg:r+" reps means it's too light. Next set "+kgs(roundTo(k+st_*mult,st_))+" kg."};

/* PR check for a new working set against everything logged before it */

/* ---------- schedule ---------- */

function tick(){
  saveRest();
  var el=$("elapsed");if(el&&S&&S.active)el.textContent=clock(Date.now()-S.active.start);
  if(!REST)return;var left=REST.end-Date.now();
  if(left<=0&&!REST.beeped){REST.beeped=true;beep();}
  if(left<-4000){REST=null;if(STACK.length&&STACK[STACK.length-1].p==="workout"&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))render();return;}
  var t=$("restT"),c=$("restC2"),b=$("restB"),ch=$("restC");
  if(t)t.textContent=left>0?clock(left+999):"Go";if(c)c.textContent=left>0?clock(left+999):"Go";
  if(left<=0){if(b)b.classList.add("go");if(ch)ch.classList.add("go");var l=$("restL");if(l)l.textContent="Time for your next set";}
}

  if(k==="cname"){CUSTOM.n=t.value;return;}
  if(k==="libq"){LQ.q=t.value;LQ.n=40;clearTimeout(window._lq);window._lq=setTimeout(function(){var el=$("liblist");if(el)el.innerHTML=libList(topA());},120);return;}
  if(k==="wname"){var id=topA().id,v=t.value;clearTimeout(window._wn);window._wn=setTimeout(function(){var P=clone(S.program),w=P.find(function(x){return x.id===id;});if(w){w.n=v.trim()||"New routine";op("prog",{program:P},true);var tt=document.querySelector(".hdr .ttl");if(tt)tt.firstChild.textContent=w.n;}},500);return;}
  if((k==="k"||k==="r")&&!W.edit&&S.active){var it=curIt();if(it){var v2=parseFloat(t.value.replace(",","."));if(!isNaN(v2))W[k][it.e]=v2;}}
});

/* ===== shell: gate, boot, self-update ===== */
function gate(err){
  $("app").classList.add("hidden");$("gate").classList.remove("hidden");
  $("pinErr").textContent={pin:"That code is wrong",role:"That code doesn’t open Lift"}[err]||err||"";
  $("pinGo").onclick=async function(){
    var p=$("pin").value.trim();if(!p)return;PIN=p;$("pinErr").textContent="";$("pinGo").textContent="Opening…";
    try{await pull();localStorage.setItem(LS+"pin",p);start();}
    catch(e){$("pinGo").textContent="Open Lift";$("pinErr").textContent=e.message==="pin"?"That code is wrong":(e.message==="role"?"That code doesn’t open Lift":"Couldn’t reach the server: "+e.message);}
  };
  $("pin").onkeydown=function(e){if(e.key==="Enter")$("pinGo").click();};
  setTimeout(function(){$("pin").focus();},80);
}
function start(){$("gate").classList.add("hidden");$("app").classList.remove("hidden");render();flush();if(S.active&&STACK.length)wake(true);loadLib().catch(function(){});}
async function checkUpdate(silent){
  try{var r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});var j=await r.json();
    if(!j.build||j.build===BUILD_ID)return false;
    var b=$("upd");
    if((S&&S.active)||!silent||location.search.indexOf("v="+j.build)>=0){b.classList.remove("hidden");b.onclick=function(){forceReload(j.build);};return false;}
    forceReload(j.build);return true;
  }catch(e){return false;}
}
async function forceReload(build){
  try{if("caches" in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));}}catch(e){}
  try{if("serviceWorker" in navigator){var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister();}));}}catch(e){}
  location.replace(location.pathname+"?v="+build);
}
window.addEventListener("online",function(){online=true;renderNet();flush();});
window.addEventListener("offline",function(){online=false;renderNet();});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)return;tick();checkUpdate(true);
  var typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(PIN&&!typing)pull().then(render).catch(function(){});
});
(async function boot(){
  try{
    document.querySelectorAll("nav.tabs button").forEach(function(b){b.onclick=function(){TAB=b.getAttribute("data-tab");STACK=[];saveUI();render();window.scrollTo(0,0);};});
    if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});}catch(e){}}
    loadLocal();
    if(await checkUpdate(true))return;
    PIN=localStorage.getItem(LS+"pin")||"";
    if(!PIN){gate();return;}
    if(S){start();try{await pull();render();}catch(e){if(e.message==="pin"||e.message==="role")gate(e.message);}}
    else{try{await pull();start();}catch(e){gate(e.message==="pin"?"pin":(e.message==="role"?"role":"Couldn’t reach the server: "+e.message));}}
  }catch(e){document.body.innerHTML='<pre style="padding:20px;white-space:pre-wrap;color:#eee">Lift couldn’t start: '+String(e&&e.stack||e)+'</pre>';}
})();


</script>
