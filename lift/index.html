<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#1B1D21">
<title>Lift</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#1B1D21;--iron2:#23262B;--iron3:#2D3137;--iron4:#3A3F46;
  --chalk:#ECEAE4;--chalk2:#AEB0B4;--chalk3:#767A80;--line:rgba(236,234,228,.08);
  --red:#E2453C;--blue:#2E7CF6;--yellow:#F2C335;--green:#2FAE72;
  --wc:#E2453C;
  --disp:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Archivo",-apple-system,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--iron);color:var(--chalk);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding:var(--safe-t) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.hidden{display:none!important}
.ic{width:20px;height:20px;flex:none;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
.disp{font-family:var(--disp);font-weight:800;letter-spacing:.01em;line-height:.95}
.num{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.mute{color:var(--chalk2)}.faint{color:var(--chalk3)}
.small{font-size:13px}.tiny{font-size:12px}
p{margin:0 0 8px}

/* ---------- shell ---------- */
.screen{padding:18px 18px calc(150px + var(--safe-b));animation:fade .22s ease}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 18px}
.top h1{margin:0;font-family:var(--disp);font-weight:800;font-size:40px;line-height:1}
.top .sub{color:var(--chalk2);font-size:14px;margin-bottom:4px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--iron2);display:inline-grid;place-items:center;color:var(--chalk2)}
.iconbtn:active{transform:scale(.94)}
section{margin-bottom:26px}
section>h2{font-size:15px;font-weight:600;color:var(--chalk2);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
section>h2 button{color:var(--chalk);font-size:14px;font-weight:600}
.panel{background:var(--iron2);border-radius:20px;padding:16px}
.list{background:var(--iron2);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li:active{background:var(--iron3)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{color:var(--chalk2);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:54px;height:54px;border-radius:12px;background:#fff center/cover no-repeat;flex:none}
.stripe{width:5px;align-self:stretch;border-radius:4px;background:var(--wc);flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--wc);display:inline-block;flex:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:18px;padding:17px 18px;font-weight:700;font-size:17px;background:var(--iron3)}
.btn.chalk{background:var(--chalk);color:#17191C}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--red)}
.btn:active{transform:scale(.985);opacity:.9}
.btn.sm{padding:11px 14px;font-size:15px;border-radius:14px;width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta{position:fixed;left:16px;right:16px;bottom:calc(84px + var(--safe-b));z-index:20;box-shadow:0 14px 34px rgba(0,0,0,.55)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px 6px calc(6px + var(--safe-b));background:rgba(27,29,33,.86);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 4px;color:var(--chalk3);font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--chalk)}
nav.tabs button.on .ic{transform:translateY(-1px)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--iron2);color:var(--chalk2);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--chalk);color:#17191C}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chip{padding:12px 0;text-align:center}

/* ---------- today ---------- */
.hero{position:relative;padding:20px 18px 18px;border-radius:24px;background:var(--iron2);overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--wc)}
.hero .kick{color:var(--chalk2);font-size:14px}
.hero .wname{font-family:var(--disp);font-weight:800;font-size:64px;line-height:.92;margin:6px 0 8px}
.hero .meta{color:var(--chalk2);font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:20px;text-align:center}
.wk .pl{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--iron4);color:var(--chalk3)}
.wk .pl.done{background:var(--c);border-color:var(--c);color:#111}
.wk .pl.plan{border-color:var(--c);color:var(--chalk)}
.wk .pl.miss{border-style:dashed;opacity:.5}
.wk .pl.off{border-color:transparent;background:var(--iron3);width:8px;height:8px;margin:13px auto 19px}
.wk .dn{font-size:12px;color:var(--chalk3)}
.wk.today .dn{color:var(--chalk);font-weight:700}
.target{text-align:right;flex:none}
.target .num{font-size:24px;line-height:1}
.target .tg{font-size:12px;color:var(--chalk3)}
.up{color:var(--green)}.down{color:var(--yellow)}
.mini{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));z-index:25;display:flex;align-items:center;gap:12px;background:var(--iron3);border-radius:18px;padding:10px 12px 10px 16px;box-shadow:0 12px 30px rgba(0,0,0,.5);border-left:5px solid var(--wc);width:auto;text-align:left}
.mini .grow{flex:1;min-width:0}
.mini .t{font-weight:700}
.mini .s{font-size:13px;color:var(--chalk2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .go{background:var(--chalk);color:#17191C;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:50;background:var(--iron);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--safe-t) 0 calc(110px + var(--safe-b));animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.ph{position:sticky;top:0;z-index:3;background:rgba(27,29,33,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:10px 14px 10px}
.ph .bar{display:flex;align-items:center;gap:10px}
.ph .ttl{flex:1;min-width:0;font-weight:700}
.ph .ttl .s{font-size:13px;color:var(--chalk2);font-weight:500}
.ph .fin{background:var(--chalk);color:#17191C;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.segs{display:flex;gap:3px;margin-top:10px}
.segs i{flex:1;height:4px;border-radius:3px;background:var(--iron3);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0;width:var(--p);background:var(--wc);border-radius:3px;transition:width .3s}
.segs i.cur{background:var(--iron4)}
.exnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 2px}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:none;padding:8px 12px;border-radius:12px;background:var(--iron2);color:var(--chalk2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.exnav button.on{background:var(--chalk);color:#17191C}
.exnav button.full{color:var(--green)}
.exnav button.on.full{color:#17191C}
.pbody{padding:14px 16px}
.pbody>.media{aspect-ratio:auto;height:min(22vh,190px)}
.pbody .exname{font-size:34px;margin-top:12px}
.pbody .acts{margin:10px 0}
.media{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:#fff}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media img.b{animation:flip 2.6s steps(1) infinite}
.media .lbl{position:absolute;left:12px;bottom:12px;background:rgba(27,29,33,.78);color:var(--chalk);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.exname{font-family:var(--disp);font-weight:800;font-size:38px;line-height:.95;margin:16px 0 6px}
.exmeta{display:flex;flex-wrap:wrap;gap:6px;color:var(--chalk2);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.act{background:var(--iron2);border-radius:14px;padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--chalk2)}
.act.on{color:var(--chalk)}
.how{background:var(--iron2);border-radius:18px;padding:14px 16px 6px;margin-bottom:12px}
.how ol{margin:0;padding-left:20px}.how li{margin-bottom:8px}
.setting{display:flex;gap:10px;align-items:center;background:var(--iron2);border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:15px;width:100%;text-align:left}
.coachnote{display:flex;gap:10px;padding:14px 16px;border-radius:18px;background:linear-gradient(0deg,rgba(236,234,228,.04),rgba(236,234,228,.04)),var(--iron2);border:1px solid var(--line);margin-bottom:14px;font-size:15px}
.coachnote .ic{color:var(--wc);margin-top:1px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:38px 1fr 44px;align-items:center;gap:10px;background:var(--iron2);border-radius:16px;padding:10px 10px 10px 12px;width:100%;text-align:left}
.set .no{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--chalk3);text-align:center}
.set .val{font-family:var(--disp);font-weight:700;font-size:26px}
.set .val small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--chalk2);margin:0 6px 0 2px}
.set.wu .no{font-size:15px}
.set.todo .val{color:var(--chalk3)}
.set .ck{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--iron3);color:var(--chalk3)}
.set.done .ck{background:var(--fc,var(--green));color:#111}
.set.done .val{color:var(--chalk)}
.set.live{grid-template-columns:1fr;background:var(--iron3);padding:14px;gap:12px;border:1px solid var(--line)}
.live .lh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{background:var(--iron);border-radius:16px;padding:8px 6px 10px;text-align:center}
.stp .lb{font-size:12px;color:var(--chalk2);font-weight:600}
.stp .ctl{display:flex;align-items:center;justify-content:space-between}
.stp .ctl button{width:44px;height:52px;border-radius:12px;display:grid;place-items:center;color:var(--chalk2)}
.stp .ctl button:active{background:var(--iron3)}
.stp input{width:100%;min-width:0;background:none;border:0;text-align:center;font-family:var(--disp);font-weight:800;font-size:44px;line-height:1;padding:0;color:var(--chalk)}
.stp input::placeholder{color:var(--chalk3)}
.logbtn{background:var(--chalk);color:#17191C;border-radius:16px;padding:16px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.feel{background:var(--iron3);border-radius:18px;padding:14px;border:1px solid var(--line)}
.feel .q{font-weight:700;margin-bottom:10px}
.feel .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel .opts button{border-radius:14px;padding:14px 6px 12px;background:var(--iron);display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent}
.feel .opts button b{font-size:16px}
.feel .opts button span{font-size:12px;color:var(--chalk2);text-align:center;line-height:1.25}
.feel .opts button.f1 b{color:var(--green)}.feel .opts button.f2 b{color:var(--blue)}.feel .opts button.f3 b{color:var(--red)}
.feel .opts button:active{border-color:var(--chalk3)}
.addset{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--iron4);color:var(--chalk2);border-radius:14px;padding:12px;width:100%;margin-top:4px;font-weight:600;font-size:14px}
.pfoot{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;gap:10px;padding:10px 16px calc(10px + var(--safe-b));background:rgba(27,29,33,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.pfoot .btn{padding:14px}

/* the plate: rest timer */
.rest{position:fixed;inset:0;z-index:70;background:rgba(17,18,21,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + var(--safe-t)) 24px calc(24px + var(--safe-b));animation:fade .2s}
.plate{position:relative;width:min(78vw,320px);aspect-ratio:1}
.plate svg{width:100%;height:100%;transform:rotate(-90deg)}
.plate .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate .tm{font-family:var(--disp);font-weight:800;font-size:84px;line-height:1;font-variant-numeric:tabular-nums}
.plate .cap{color:var(--chalk2);font-size:14px;margin-top:4px}
.rest .nx{margin:26px 0 22px;text-align:center}
.rest .nx .k{font-size:14px;color:var(--chalk2)}
.rest .nx .v{font-family:var(--disp);font-weight:800;font-size:30px;margin-top:2px}
.rest .ctr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:360px}
.rest.go .tm{color:var(--green)}

/* ---------- summary ---------- */
.summary{position:fixed;inset:0;z-index:80;background:var(--iron);overflow-y:auto;padding:calc(26px + var(--safe-t)) 20px calc(30px + var(--safe-b));animation:rise .32s cubic-bezier(.2,.8,.2,1)}
.summary .band{height:10px;border-radius:6px;background:var(--wc);width:72px;margin-bottom:18px}
.summary h1{font-family:var(--disp);font-weight:800;font-size:58px;line-height:.92;margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat{background:var(--iron2);border-radius:18px;padding:14px 12px}
.stat .v{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1}
.stat .l{font-size:12px;color:var(--chalk2);margin-top:4px}
.pr{color:var(--yellow)}

/* ---------- body ---------- */
.big{font-family:var(--disp);font-weight:800;font-size:76px;line-height:.9}
.big small{font-family:var(--body);font-size:18px;font-weight:600;color:var(--chalk2);margin-left:6px}
.delta{font-weight:700;font-size:15px}
.chart{width:100%;height:170px;display:block;margin-top:10px;overflow:visible}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--iron2);border-radius:18px;padding:14px;text-align:left;width:100%}
.tile.on{outline:2px solid var(--chalk)}
.tile .l{font-size:13px;color:var(--chalk2)}
.tile .v{font-family:var(--disp);font-weight:800;font-size:32px;line-height:1.05;margin-top:4px}
.tile .v small{font-family:var(--body);font-size:13px;color:var(--chalk2);font-weight:500;margin-left:3px}
.tile .d{font-size:13px;font-weight:600;margin-top:2px}
.meter{height:10px;border-radius:6px;background:var(--iron3);overflow:hidden;margin:12px 0 8px}
.meter b{display:block;height:100%;background:var(--green);border-radius:6px}

/* ---------- forms / sheets ---------- */
.sheet{position:fixed;inset:0;z-index:90;background:rgba(10,11,13,.6);display:flex;align-items:flex-end;animation:fade .18s}
.sheet .in{background:var(--iron2);width:100%;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:8px 18px calc(22px + var(--safe-b));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet .in.tall{height:92vh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--iron4);margin:4px auto 14px}
.sheet h3{font-family:var(--disp);font-weight:800;font-size:32px;line-height:1;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--iron3);border-radius:16px;padding:15px 16px;margin-bottom:8px;font-size:16px;font-weight:600}
.opt .grow{flex:1}
.opt.danger{color:var(--red)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--chalk2);font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--iron);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:17px;color:var(--chalk)}
.field input.numin{font-family:var(--disp);font-weight:800;font-size:30px;padding:9px 14px}
.search{display:flex;align-items:center;gap:10px;background:var(--iron2);border-radius:16px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;padding:14px 0;font-size:16px;color:var(--chalk);outline:none}
.sw{display:flex;gap:10px}
.sw button{width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid transparent}
.sw button.on{border-color:var(--chalk)}
.edrow{background:var(--iron3);border-radius:16px;margin-bottom:8px;overflow:hidden}
.edrow .li{background:transparent}
.edctl{padding:4px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mstp{background:var(--iron);border-radius:12px;padding:6px;display:flex;align-items:center;justify-content:space-between}
.mstp button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--chalk2)}
.mstp .c{text-align:center}
.mstp .c b{display:block;font-family:var(--disp);font-size:22px;font-weight:800;line-height:1}
.mstp .c span{font-size:11px;color:var(--chalk2)}
.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);z-index:200;background:var(--chalk);color:#17191C;padding:11px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center;max-width:92vw;animation:drop .3s cubic-bezier(.2,.8,.2,1)}
.toast.gold{background:var(--yellow)}
#gate{max-width:360px;margin:18vh auto 0;text-align:center;padding:24px}
#gate .disp{font-size:72px}
#gate input{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:14px;text-align:center;width:220px;padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--iron2);color:var(--chalk);margin-top:26px}
#gate .btn{margin-top:16px}
.err{color:var(--red);min-height:22px;margin-top:12px;font-size:14px}
#upd{position:fixed;top:calc(8px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:210;background:var(--chalk);color:#17191C;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--iron3);color:var(--chalk2)}
.pill.off{background:var(--red);color:#fff}.pill.pend{background:var(--yellow);color:#111}
.empty{text-align:center;padding:26px 18px;color:var(--chalk2)}
.empty .ic{width:34px;height:34px;color:var(--chalk3);margin-bottom:8px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes flip{0%{opacity:0}50%{opacity:1}}

 "Leverage_Chest_Press":{n:"Chest press machine",m:"Chest, front shoulders, triceps",step:2.5,c:["Set the seat so the handles line up with the middle of your chest.","Push forward until your arms are almost straight. Don't lock your elbows.","Come back slowly, 2–3 seconds, until you feel a light stretch in your chest."]},

 "Triceps_Pushdown_-_Rope_Attachment":{n:"Triceps pushdown",m:"Back of the arms",step:2.5,c:["Rope on the high pulley. Stand close with your elbows pinned to your sides.","Push down until your arms are straight and spread the rope ends at the bottom.","Let it rise to chest height. Only your forearms move."]},

/* ===== Lift logic — pure functions (tested in tests/lift_logic.mjs) ===== */
var DAY_MS=864e5;
function clone(o){return JSON.parse(JSON.stringify(o));}
function r2(x){return Math.round(x*100)/100;}

/* ---------- state ---------- */
function seedState(){return {ver:2,days:[0,2,3,6],next:0,program:defaultProgram(),sessions:[],active:null,notes:{},body:[],goal:{},custom:{}};}
function migrate(st){

    if(typeof old.next==="number")st.next=old.next%st.program.length;
    var fix=function(s){return {i:s.i,e:V1KEY[s.e]||s.e,k:s.k,r:s.r,f:2,t:s.t};};
    (old.sessions||[]).forEach(function(s){var w=st.program.find(function(p){return p.id===s.w;});st.sessions.push({id:s.id,w:s.w,wn:w?w.n:"Workout",c:w?w.c:5,start:s.start,end:s.end||s.start,sets:(s.sets||[]).map(fix)});});

  if(st.active===undefined)st.active=null;

}
function applyOp(st,o){
  var p=o.p||{},a=st.active,mine=a&&a.id===p.sid;

  case "start":

    if(mine){var work=a.sets.filter(function(s){return !s.wu;});
      if(work.length&&!st.sessions.some(function(s){return s.id===a.id;})){a.end=o.ts;var sess={id:a.id,w:a.w,wn:a.wn,c:a.c,start:a.start,end:o.ts,sets:a.sets};st.sessions.push(sess);
        var ix=st.program.findIndex(function(x){return x.id===a.w;});if(ix>=0)st.next=(ix+1)%st.program.length;}

    break;

  case "custom": st.custom[p.id]=p.def; break;
  case "delsession": st.sessions=st.sessions.filter(function(s){return s.id!==p.id;}); break;
  }
}

/* ---------- history ---------- */
function sortedSessions(st){return st.sessions.slice().sort(function(a,b){return a.start-b.start;});}
function histFor(st,e){ /* newest first: [{s:session, sets:[working sets of e]}] */
  var out=[];sortedSessions(st).forEach(function(s){var ss=s.sets.filter(function(x){return x.e===e&&!x.wu;});if(ss.length)out.unshift({s:s,sets:ss});});return out;
}
function modeKg(sets){var c={},best=null;sets.forEach(function(x){c[x.k]=(c[x.k]||0)+1;if(best===null||c[x.k]>c[best]||(c[x.k]===c[best]&&x.k>best))best=x.k;});return best;}
function score(kind,s){return kind==="c"?s.r:(s.k>0?e1rm(s.k,s.r):s.r/1000);}

/* ---------- the coach ----------

function coach(st,it){
  var h=histFor(st,it.e),st_=it.step||2.5;
  if(it.kind==="c"){
    if(!h.length)return {k:0,r:it.lo,tag:"new",msg:"Walk "+it.lo+"–"+it.hi+" minutes. Set the incline so you're breathing hard but could still talk."};
    var lm=Math.max.apply(null,h[0].sets.map(function(x){return x.r;})),lf=h[0].sets[0].f;
    if(lm>=it.hi&&lf<=2)return {k:0,r:it.hi,tag:"up",msg:lm+" minutes last time and it felt fine. Same time today, one notch steeper."};
    return {k:0,r:Math.min(it.hi,Math.max(it.lo,lm+2)),tag:"same",msg:"Last time "+lm+" minutes. Go for "+Math.min(it.hi,Math.max(it.lo,lm+2))+" today."};
  }
  if(!h.length)return {k:null,r:it.hi,tag:"new",msg:it.kind==="b"?"Bodyweight to start. Do what you can with good form and tell me how it felt.":"First time on this one. Set 1 is a test: pick a weight you could lift about 15 times. Tell me how it felt and I'll set the next one."};

    return {k:nk,r:it.lo,tag:"up",from:km,msg:(km===0?"Every set hit "+it.hi+" last time. Hold a "+kgs(nk)+" kg plate today.":"Every set hit "+it.hi+(allEasy?" and felt easy":"")+" last time at "+kgs(km)+" kg. Up to "+kgs(nk)+" kg today"+(allEasy?" — a double step.":". Reaching "+it.lo+" reps is a win."))};}
  if(lowAny&&h[1]){var p=h[1].sets,pk=modeKg(p);
    if(pk===km&&p.filter(function(x){return x.k===km;}).some(function(x){return x.r<it.lo;})){var dk=r2(Math.ceil(km*0.9/st_-1e-9)*st_);if(dk>=km)dk=Math.max(0,roundTo(km-st_,st_));
      return {k:dk,r:it.hi,tag:"down",from:km,msg:"Two tough sessions at "+kgs(km)+" kg. Drop to "+kgs(dk)+" kg, own it, and build back up. This is normal."};}}
  if(lowAny)return {k:km,r:it.lo,tag:"same",msg:"Stay at "+kgs(km)+" kg. Last time: "+reps+". Aim for "+it.lo+" on every set."};
  return {k:km,r:Math.min(it.hi,Math.max.apply(null,at.map(function(x){return x.r;}))+(allEasy?1:0)),tag:"same",msg:"Same "+kgs(km)+" kg. Last time: "+reps+". Beat one of those by a rep — when every set hits "+it.hi+", the weight goes up."};
}
/* after each set: what the NEXT set should be, from that set's reps and feel */
function adjustNext(it,last,firstTime){
  var st_=it.step||2.5,k=last.k,r=last.r,f=last.f||2,mult=firstTime?2:1;
  if(it.kind==="c")return {k:0,r:r,msg:""};

var EQ_RANK={"machine":0,"cable":1,"dumbbell":2,"body only":3,"kettlebells":4,"e-z curl bar":5,"barbell":6};
function filterLib(q,mi,ei,muscles){
  if(!LIB)return [];
  var words=(q||"").toLowerCase().split(/\s+/).filter(Boolean),mg=mi==null?null:MUSCLE_GROUPS[mi][1],eg=ei==null?null:EQUIP[ei][1];
  var out=LIB.filter(function(l){
    if(mg){if(mg[0]==="_cardio"){if(l[6]!=="cardio")return false;}else if(!l[2].some(function(x){return mg.indexOf(x)>=0;}))return false;}
    if(eg&&eg.indexOf(l[4])<0)return false;
    if(muscles&&!l[2].some(function(x){return muscles.indexOf(x)>=0;}))return false;
    if(words.length){var hay=(l[1]+" "+(CUR[l[0]]?CUR[l[0]].n:"")+" "+l[2].join(" ")+" "+(l[4]||"")).toLowerCase();if(!words.every(function(w){return hay.indexOf(w)>=0;}))return false;}
    return true;
  });
  if(!words.length&&(muscles||mg))out.sort(function(a,b){var ra=(EQ_RANK[a[4]]!=null?EQ_RANK[a[4]]:9)+(a[5]==="beginner"?0:a[5]==="intermediate"?1:3)+(a[6]==="stretching"?20:0),rb=(EQ_RANK[b[4]]!=null?EQ_RANK[b[4]]:9)+(b[5]==="beginner"?0:b[5]==="intermediate"?1:3)+(b[6]==="stretching"?20:0);return ra-rb;});
  return out;
}

function wake(on){try{if(on&&navigator.wakeLock&&!WAKE)navigator.wakeLock.request("screen").then(function(l){WAKE=l;l.addEventListener("release",function(){WAKE=null;});}).catch(function(){});if(!on&&WAKE){WAKE.release();WAKE=null;}}catch(e){}}

function setsOf(e){return S.active.sets.filter(function(s){return s.e===e;});}
function workOf(e){return setsOf(e).filter(function(s){return !s.wu;});}
function wuOf(e){return setsOf(e).filter(function(s){return s.wu;});}
function isFirstTime(e){return !histFor(S,e).length;}
function planWarmups(it){
  var a=S.active,ix=a.x.indexOf(it),wIdx=a.x.filter(function(x,i){return i<=ix&&x.kind==="w";}).length;
  if(wIdx>2||workOf(it.e).length)return wuOf(it.e).map(function(s){return {k:s.k,r:s.r};});
  var c=coach(S,it);return warmups(it,c.k);
}
/* the next set's prefill: coach target for set 1, then adjusted from how the previous set went */
function prefill(it,slot){
  var lv=UI.live[it.e];if(lv&&lv.slot===slot.key)return lv;
  if(slot.wu)return {k:slot.k,r:slot.r};
  var w=workOf(it.e);
  if(w.length){var a=adjustNext(it,w[w.length-1],isFirstTime(it.e));return {k:a.k,r:a.r};}
  var c=coach(S,it);return {k:c.k,r:c.r};
}
function slotsFor(it){
  var out=[],wus=it.kind==="w"?planWarmups(it):[],lw=wuOf(it.e),w=workOf(it.e);
  wus.forEach(function(u,i){out.push({key:"w"+i,wu:true,no:"W"+(i+1),k:u.k,r:u.r,set:lw[i]||null});});
  var n=Math.max(it.s,w.length+(UI.extra[it.e]?1:0));
  for(var i=0;i<n;i++)out.push({key:"s"+i,wu:false,no:it.kind==="c"?"":String(i+1),set:w[i]||null});
  return out;
}
function liveSlot(it,slots){
  var sel=UI.sel[it.e];if(sel){var f=slots.find(function(s){return s.key===sel&&!s.set;});if(f)return f;}
  var anyWork=workOf(it.e).length;
  return slots.find(function(s){return !s.set&&!(s.wu&&anyWork);})||null;
}

/* ---------- charts ---------- */
function lineChart(pts,o){
  var W=340,H=150,pl=4,pr=40,pt=12,pb=22;if(!pts.length)return "";
  var t0=o.t0||pts[0].t,t1=Math.max(o.t1||pts[pts.length-1].t,t0+DAY_MS),vs=pts.map(function(p){return p.v;});if(o.goal!=null)vs.push(o.goal);
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);if(mx-mn<1){mx+=.5;mn-=.5;}var pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  var X=function(t){return pl+(t-t0)/(t1-t0)*(W-pl-pr);},Y=function(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);};
  var d=pts.map(function(p,i){return (i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.v).toFixed(1);}).join(" ");
  var area=d+" L"+X(pts[pts.length-1].t).toFixed(1)+" "+(H-pb)+" L"+X(pts[0].t).toFixed(1)+" "+(H-pb)+" Z";

      x[f]=Math.max(lim[0],Math.min(lim[1],x[f]+d*step));if(x.lo>x.hi){if(f==="lo")x.hi=x.lo;else x.lo=x.hi;}draw();};});
    s.querySelector("#edAdd").onclick=function(){pickExercise("Add exercise",function(id){if(D.x.some(function(x){return x.e===id;})){toast("Already in this workout");return;}D.x.push(itemFor(id));draw();});};
    s.querySelector("#edSave").onclick=function(){D.n=(D.n||"").trim();if(!D.n){toast("Give the workout a name");s.querySelector("#wn").focus();return;}if(!D.x.length){toast("Add at least one exercise");return;}
      var P=clone(S.program);if(isNew)P.push(D);else P[ix]=D;op("prog",{program:P});s.remove();toast(isNew?"Workout created":"Workout saved");};
    if(s.querySelector("#edDel"))s.querySelector("#edDel").onclick=async function(){if(await ask("Delete "+D.n+"?","It leaves the rotation. Past workouts stay in your history.","Delete workout",true)){var P=clone(S.program);P.splice(ix,1);op("prog",{program:P});s.remove();}};
  };
  var mst=function(i,f,l){return '<div class="mstp"><button data-ms="'+i+':'+f+':-1" aria-label="Less">'+ic("minus","sm")+'</button><div class="c"><b>'+D.x[i][f]+'</b><span>'+l+'</span></div><button data-ms="'+i+':'+f+':1" aria-label="More">'+ic("plus","sm")+'</button></div>';};
  draw();loadLib().then(function(){if(document.body.contains(s))draw();}).catch(function(){});
}

/* ===== shell: tabs, mini-player, gate, boot, self-update ===== */
function renderNet(){var n=$("net");if(!n)return;n.className="pill "+(!online?"off":(pending.length?"pend":"hidden"));n.textContent=!online?"Offline, saved on phone":(pending.length?"Saving…":"");}
function go(tab){TAB=tab;window.scrollTo(0,0);render();}
function render(){
  if(!S)return;
  document.querySelectorAll("nav.tabs button").forEach(function(b){b.className=b.getAttribute("data-tab")===TAB?"on":"";});
  ({today:renderToday,history:renderHistory,body:renderBody,library:renderLibrary,plan:renderPlan}[TAB]||renderToday)();
  var m=$("mini");
  if(S.active&&!UI.player){var a=S.active,it=a.x[Math.min(UI.cur,a.x.length-1)],w=a.sets.filter(function(s){return !s.wu;}).length;
    m.className="mini";m.style.setProperty("--wc",wc(a.c));
    m.innerHTML='<div class="grow"><div class="t">'+esc(a.wn)+' <span class="mute small" id="elapsed">'+clock(Date.now()-a.start)+'</span></div><div class="s">'+(it?esc(it.n)+", ":"")+w+' sets logged</div></div><span class="go">Resume</span>';
    m.onclick=function(){UI.player=true;saveUI();render();};}
  else{m.className="mini hidden";m.innerHTML="";}
  var p=$("player");
  if(S.active&&UI.player){renderPlayer();document.body.style.overflow="hidden";}
  else{p.className="player hidden";p.innerHTML="";document.body.style.overflow="";if(UI.rest&&!S.active)stopRest();}
  renderNet();
}
function gate(err){
  $("app").classList.add("hidden");$("gate").classList.remove("hidden");
  var msg={pin:"That code is wrong",role:"That code doesn’t open Lift"}[err]||err||"";$("pinErr").textContent=msg;
  $("pinGo").onclick=async function(){
    var p=$("pin").value.trim();if(!p)return;PIN=p;$("pinErr").textContent="";$("pinGo").textContent="Opening…";
    try{await pull();localStorage.setItem(LS+"pin",p);start();}
    catch(e){$("pinGo").textContent="Open Lift";$("pinErr").textContent=e.message==="pin"?"That code is wrong":(e.message==="role"?"That code doesn’t open Lift":"Couldn’t reach the server: "+e.message);}
  };
  $("pin").onkeydown=function(e){if(e.key==="Enter")$("pinGo").click();};
  setTimeout(function(){$("pin").focus();},80);
}
function start(){$("gate").classList.add("hidden");$("app").classList.remove("hidden");render();flush();if(S.active&&UI.player)wake(true);loadLib().catch(function(){});}
async function checkUpdate(silent){
  try{var r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});var j=await r.json();
    if(!j.build||j.build===BUILD_ID)return false;
    if(S&&S.active){var b=$("upd");b.classList.remove("hidden");b.onclick=function(){forceReload(j.build);};return false;} /* never reload mid-set */
    var already=location.search.indexOf("v="+j.build)>=0;
    if(!silent||already){var b2=$("upd");b2.classList.remove("hidden");b2.onclick=function(){forceReload(j.build);};return false;}
    forceReload(j.build);return true;
  }catch(e){return false;}
}
async function forceReload(build){
  try{if("caches" in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));}}catch(e){}
  try{if("serviceWorker" in navigator){var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister();}));}}catch(e){}
  location.replace(location.pathname+"?v="+build);
}
window.addEventListener("online",function(){online=true;renderNet();flush();});
window.addEventListener("offline",function(){online=false;renderNet();});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)return;tick();checkUpdate(true);
  var busy=document.querySelector(".sheet")||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))||UI.feelFor;
  if(PIN&&!busy)pull().then(render).catch(function(){});
});
(async function boot(){
  try{
    document.querySelectorAll("nav.tabs button").forEach(function(b){b.onclick=function(){go(b.getAttribute("data-tab"));};});
    if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});}catch(e){}}
    loadLocal();
    if(await checkUpdate(true))return;
    PIN=localStorage.getItem(LS+"pin")||"";
    if(!PIN){gate();return;}
    if(S){start();try{await pull();render();}catch(e){if(e.message==="pin"||e.message==="role")gate(e.message);}}
    else{try{await pull();start();}catch(e){gate(e.message==="pin"?"pin":(e.message==="role"?"role":"Couldn’t reach the server: "+e.message));}}
  }catch(e){document.body.innerHTML='<pre style="padding:20px;white-space:pre-wrap;color:#eee">Lift couldn’t start: '+String(e&&e.stack||e)+'</pre>';}
})();


</script>
