<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moe's App — Push</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background:#0f1115; color:#e6e6e6; max-width:720px; margin:0 auto; padding:20px; line-height:1.45; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:#9aa0a6; margin:0 0 16px; font-size:14px; }
  label { display:block; font-size:12px; color:#9aa0a6; margin:12px 0 4px; text-transform:uppercase; letter-spacing:0.5px; }
  input, textarea { width:100%; padding:12px; font-size:14px; background:#1a1d23; border:1px solid #2a2f38; border-radius:8px; color:#e6e6e6; font-family: ui-monospace, Menlo, monospace; }
  textarea { min-height:220px; resize:vertical; }
  button { width:100%; padding:16px; font-size:16px; font-weight:600; border:0; border-radius:12px; background:#3b82f6; color:white; cursor:pointer; margin-top:16px; }
  button:active { background:#2563eb; }
  button:disabled { background:#374151; color:#9aa0a6; }
  button.secondary { background:#2a2f38; margin-top:8px; }
  #out { margin-top:16px; padding:14px; background:#1a1d23; border-radius:10px; font-family: ui-monospace, Menlo, monospace; font-size:12px; white-space:pre-wrap; word-break:break-word; min-height:40px; }
  .ok { color:#34d399; }
  .err { color:#f87171; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  details { margin-top:12px; }
  summary { cursor:pointer; font-size:13px; color:#9aa0a6; padding:6px 0; }
  .meta { color:#9aa0a6; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
  <h1>Push to GitHub</h1>
  <p class="sub">One-tap deploy. Fields auto-fill from URL params if provided.</p>

  <label for="path">File path (e.g. <code>js/feed/feed-render.js</code>)</label>
  <input id="path" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="path/to/file.js">

  <label for="message">Commit message</label>
  <input id="message" type="text" placeholder="What this change does">

  <label for="content">File content</label>
  <textarea id="content" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste full file contents here…"></textarea>

  <button id="go">Push to GitHub</button>
  <button id="load" class="secondary">Load payload from URL hash</button>

  <div id="out">Ready.</div>

  <details>
    <summary>How URL params work</summary>
    <p class="meta">Open this page with a hash like <code>#payload=&lt;base64-json&gt;</code> and tap "Load payload from URL hash" to auto-fill. JSON shape: <code>{"path":"...","message":"...","content":"..."}</code></p>
  </details>

<script>
const $ = id => document.getElementById(id);
const out = $('out');

// Auto-fill from query string ?path=&message= (content via hash to avoid URL length limits)
const params = new URLSearchParams(location.search);
if (params.get('path')) $('path').value = params.get('path');
if (params.get('message')) $('message').value = params.get('message');

function loadFromHash() {
  try {
    const h = location.hash.replace(/^#/, '');
    const sp = new URLSearchParams(h);
    const payload = sp.get('payload');
    if (!payload) {
      out.textContent = 'No payload in URL hash.';
      return;
    }
    const json = JSON.parse(atob(payload));
    if (json.path) $('path').value = json.path;
    if (json.message) $('message').value = json.message;
    if (typeof json.content === 'string') $('content').value = json.content;
    out.textContent = 'Payload loaded. Review and tap Push.';
  } catch (e) {
    out.className = 'err';
    out.textContent = 'Failed to load payload: ' + e.message;
  }
}

$('load').addEventListener('click', loadFromHash);
// Auto-load if hash present
if (location.hash.includes('payload=')) loadFromHash();

$('go').addEventListener('click', async () => {
  const path = $('path').value.trim();
  const message = $('message').value.trim() || 'Update via push.html';
  const content = $('content').value;

  if (!path) { out.className='err'; out.textContent='Path is required.'; return; }
  if (!content) { out.className='err'; out.textContent='Content is empty.'; return; }

  $('go').disabled = true;
  out.className = '';
  out.textContent = 'Pushing…';

  try {
    const res = await fetch('https://moes-app-two.vercel.app/api/deploy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        secret: 'moes-deploy-2026',
        path: path,
        content: content,
        message: message
      })
    });
    const text = await res.text();
    let body;
    try { body = JSON.parse(text); } catch { body = text; }

    if (res.ok) {
      out.className = 'ok';
      out.textContent = '✅ PUSHED (' + res.status + ')\n\n' + JSON.stringify(body, null, 2);
    } else {
      out.className = 'err';
      out.textContent = '❌ FAILED (' + res.status + ')\n\n' + (typeof body === 'string' ? body : JSON.stringify(body, null, 2));
    }
  } catch (e) {
    out.className = 'err';
    out.textContent = '❌ NETWORK ERROR\n\n' + (e && e.message ? e.message : String(e));
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
