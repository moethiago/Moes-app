<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مقاضي">
<meta name="theme-color" content="#F3F4F6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مقاضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6;--sf:#FFFFFF;--ink:#15171B;--dim:#6B7280;--dimmer:#A1A7B3;--line:#E6E8EC;
  --go:#1B7F4E;--go-soft:#E3F3EA;--late:#D64545;--late-soft:#FBE7E7;--soon:#C98A12;--soon-soft:#FCF1D8;
  --veg:#E4F4DE;--fruit:#FBE8DA;--bread:#F9EDD9;--dairy:#E3EEFB;--meat:#FBE3E0;--fish:#DDF2F4;--frozen:#E1F0FB;--can:#F1E9D8;--dry:#F3EEDD;--sauce:#F6ECD4;--spice:#FBF0D3;--oat:#F0EBE0;--snack:#F8E4EE;--coffee:#EEE2D7;--drink:#DFEFFA;--paper:#EFF0F2;--clean:#E2F3EE;--care:#F2E7F6;--home:#E9E6F6;--other:#EBEDF1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);overscroll-behavior-y:none}
body{font-family:"Readex Pro",system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,button,select,textarea{font-family:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 84px);min-height:100vh}

/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(243,244,246,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
.hd .t{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hd h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.4px;line-height:1.2}
.hd .sub{font-size:13px;color:var(--dim);margin-top:2px;font-weight:400}
.hd .sub b{color:var(--ink);font-weight:600}
.hd .act{flex:0 0 auto;display:flex;gap:8px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--sf);box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink)}
.ic.go{background:var(--go);color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:14px;padding:0 14px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.search input{flex:1;border:0;outline:none;background:none;padding:12px 0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--dimmer)}
.search .x{color:var(--dimmer);font-size:22px;line-height:1;padding:6px 0 6px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:var(--sf);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chips button.on{background:var(--ink);color:#fff}

.pad{padding:0 16px}
.sec{margin-top:22px}
.sec h2{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.sec h2 button{font-size:12.5px;color:var(--go);font-weight:500}
.card{background:var(--sf);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.muted{color:var(--dim);font-size:13.5px;line-height:1.7}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--go-soft);color:var(--go)}
.pill.n{background:var(--bg);color:var(--dim)}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 0}
.tile{position:relative;aspect-ratio:1/1.06;border-radius:20px;background:var(--tint,var(--other));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 8px;text-align:center;transition:transform .12s ease;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:active{transform:scale(.95)}
.tile .pic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1;overflow:hidden;background:rgba(255,255,255,.55)}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nm{font-size:12.5px;font-weight:500;line-height:1.3;max-height:2.6em;overflow:hidden;color:var(--ink)}
.tile .nm small{display:block;font-size:10.5px;color:var(--dim);font-weight:400}
.tile .on{position:absolute;inset:0;background:rgba(27,127,78,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:13px;border-radius:20px;animation:pop .18s ease}
.tile .on i{font-style:normal;font-size:30px;line-height:1}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.tile.add{background:var(--sf);border:2px dashed var(--line);box-shadow:none;color:var(--dim)}
.tile.add .pic{background:none;font-size:34px;color:var(--go)}
.tile .dot{position:absolute;top:8px;inset-inline-start:10px;width:8px;height:8px;border-radius:50%}
.tile .dot.late{background:var(--late)}
.tile .dot.soon{background:var(--soon)}
.tile .cnt{position:absolute;top:8px;inset-inline-end:10px;min-width:22px;height:22px;border-radius:999px;background:var(--go);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.ver{position:absolute;top:calc(env(safe-area-inset-top) + 6px);inset-inline-end:16px;font-size:10.5px;color:var(--dimmer);font-weight:500;letter-spacing:.2px}

/* ---------- trip rows ---------- */
.aisle{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--dim);margin:18px 0 6px}
.aisle i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:14px;padding:12px 14px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);min-height:54px}
.row .cb{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.row .em{flex:0 0 auto;font-size:22px;line-height:1;width:28px;text-align:center}
.row .nm{flex:1;min-width:0;font-size:15px;font-weight:500}
.row .nm small{display:block;font-size:11.5px;color:var(--dim);font-weight:400}
.row .qty{flex:0 0 auto;min-width:40px;height:32px;border-radius:9px;background:var(--bg);font-size:13px;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:center}
.row .qty.on{background:var(--ink);color:#fff}
.row .rm{flex:0 0 auto;width:30px;height:30px;color:var(--dimmer);font-size:20px;line-height:1}
.row.done{opacity:.45}
.row.done .nm{text-decoration:line-through}
.row.done .cb{background:var(--go);border-color:var(--go)}
.row.done .cb::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.cta{display:flex;gap:8px;margin-top:22px}
.btn{flex:1;background:var(--go);color:#fff;border-radius:14px;padding:15px;font-size:15px;font-weight:600;text-align:center}
.btn.soft{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn.red{background:var(--late-soft);color:var(--late)}
.btn:disabled{opacity:.5}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.big small{font-size:14px;color:var(--dim);font-weight:500;margin-inline-start:4px}

/* ---------- receipt ---------- */
.dz{background:var(--sf);border-radius:22px;padding:26px 20px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dz .cam{width:76px;height:76px;border-radius:24px;background:var(--go);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.dz p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.7}
.dz .alt{margin-top:12px;color:var(--go);font-weight:500;font-size:14px}
.line{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.line .nm small{display:block;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:1px}
.line .pr{flex:0 0 auto;text-align:left;font-size:14px;font-weight:600;min-width:60px}
.line .pr small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.link{color:var(--go);font-size:12.5px;font-weight:500}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--go);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.stores{display:flex;flex-wrap:wrap;gap:6px}
.stores button{background:var(--bg);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--dim)}
.stores button.on{background:var(--ink);color:#fff}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .d{flex:1;min-width:0}
.hist .d b{font-weight:600;font-size:14.5px}
.hist .d small{display:block;color:var(--dim);font-size:12px}
.hist .v{text-align:left;font-weight:600;font-size:14px}
.delta{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.delta.up{background:var(--late-soft);color:var(--late)}
.delta.ok{background:var(--go-soft);color:var(--go)}
.delta.nd{background:var(--bg);color:var(--dimmer)}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(21,23,27,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:600px;background:var(--sf);border-radius:24px 24px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:88vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:700}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin-bottom:6px}
.fld input{width:100%;background:var(--bg);border:0;border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;background:var(--bg);color:var(--dim)}
.cats button.on{color:var(--ink);background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--ink)}
.photo{display:flex;align-items:center;gap:12px}
.photo .pv{width:64px;height:64px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.pick{max-height:44vh;overflow-y:auto;border-top:1px solid var(--line);margin-top:8px}
.pick button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14.5px;text-align:right}
.pick button .em{font-size:20px}
.pick button.new{color:var(--go);font-weight:600}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 92px);right:50%;transform:translateX(50%) translateY(24px);opacity:0;visibility:hidden;pointer-events:none;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:60;transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .22s,visibility 0s .22s;max-width:88vw;text-align:center}
.toast.show{transform:translateX(50%) translateY(0);opacity:1;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .22s,visibility 0s}
.toast button{margin-inline-start:14px;color:#8FE0B4;font-weight:700;font-size:13.5px;pointer-events:auto}
.sug{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sug:last-of-type{border-bottom:0}
.sug .em{font-size:22px;line-height:1;width:28px;text-align:center}
.sug .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.sug .nm small{display:block;font-size:11.5px;color:var(--dim);font-weight:400}
.sug .add{width:36px;height:36px;border-radius:11px;background:var(--go);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.sug .no{width:36px;height:36px;border-radius:11px;background:var(--bg);color:var(--dimmer);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.hint{margin-top:-6px;margin-bottom:14px;font-size:13px;color:var(--soon);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint button{background:var(--soon-soft);color:var(--soon);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.brands{display:flex;flex-wrap:wrap;gap:8px}
.brands button{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:15px;font-weight:600;min-width:30%;flex:1 1 auto;text-align:center;position:relative}
.brands button.usual{background:var(--go-soft);color:var(--go);box-shadow:inset 0 0 0 1.5px var(--go)}
.brands button.usual::after{content:"المعتاد";position:absolute;top:-8px;inset-inline-end:8px;background:var(--go);color:#fff;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600}
.brands button.any{background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--dim)}
.brands button.more{background:none;color:var(--go);box-shadow:inset 0 0 0 1.5px var(--go-soft)}
.bchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:500;margin:0 0 6px 6px}
.bchip b{color:var(--dimmer);font-weight:400;font-size:15px;line-height:1;cursor:pointer}
.tile .br{font-size:10.5px;color:var(--go);font-weight:600;display:block;margin-top:1px}
.row .nm .br,.line .nm .br,.sug .nm .br{color:var(--go);font-weight:600}
.net{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:50%;transform:translateX(50%);background:var(--soon-soft);color:var(--soon);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;z-index:50}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
.tabs .in{max-width:600px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--dimmer);font-size:11px;font-weight:600;position:relative}
.tabs button i{font-style:normal;font-size:22px;line-height:1;filter:grayscale(1);opacity:.55}
.tabs button.on{color:var(--go)}
.tabs button.on i{filter:none;opacity:1}
.tabs .b{position:absolute;top:2px;inset-inline-start:50%;margin-inline-start:6px;background:var(--go);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 30px;max-width:420px;margin:0 auto}
.gate h1{font-size:36px;font-weight:700;margin:0 0 6px;letter-spacing:-.6px}
.gate p{color:var(--dim);margin:0 0 26px;line-height:1.7}
.gate input{width:100%;background:var(--sf);border:0;border-radius:14px;padding:16px;font-size:22px;letter-spacing:6px;text-align:center;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gate .btn{margin-top:12px}
.gate .err{color:var(--late);font-size:13px;margin-top:10px;min-height:1.5em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate" class="gate hidden">
  <h1>مقاضي</h1>
  <p>رمز البيت مرة وحدة، وبعدها ما يسألك.</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="••••">
  <button class="btn" id="pinGo">ادخل</button>
  <div class="err" id="pinErr"></div>
</div>

<div id="app" class="app hidden">
  <div class="hd" id="hd"></div>
  <div id="view"></div>
</div>

<div class="tabs hidden" id="tabs"><div class="in" id="tabsIn"></div></div>

<button id="upd" class="net hidden" style="background:var(--go-soft);color:var(--go);top:calc(env(safe-area-inset-top) + 34px)">فيه إصدار جديد — اضغط للتحديث</button>
<div id="net" class="net hidden">بدون اتصال — التعديلات محفوظة وبترفع لما يرجع النت</div>
<div class="toast" id="toast"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="libIn" accept="image/*" class="hidden">
<input type="file" id="tileIn" accept="image/*" class="hidden">

<script>
(function(){
"use strict";
/* =================================================================
   CONFIG
   ================================================================= */
var API="https://moes-app-two.vercel.app/api/health-check";
var DAY=86400000;
var STORES=["Danube","Panda","Tamimi","Carrefour","LuLu","Othaim","Nana","Al Raya","Manuel","Spar","Other"];
function allStores(){return STORES.slice(0,-1).concat(S&&S.stores||[]).concat(["Other"]);}
function storeName(s){return STORE_AR[s]||s;}
function addStore(done){var n=prompt("اسم المتجر");if(!n||!n.trim())return;n=n.trim();op("store.add",{name:n});done&&done(n);}
var STORE_AR={Danube:"الدانوب",Panda:"بنده",Tamimi:"التميمي",Carrefour:"كارفور",LuLu:"لولو",Othaim:"العثيم",Nana:"نعناع","Al Raya":"الراية",Manuel:"مانويل",Spar:"سبار",Other:"متجر آخر"};

/* aisle walking order */
var CATS=[
 {id:"veg",name:"خضار",em:"🥬",c:"#7CBF5E"},
 {id:"fruit",name:"فواكه",em:"🍎",c:"#E8875A"},
 {id:"bread",name:"مخبوزات",em:"🍞",c:"#E2A867"},
 {id:"dairy",name:"ألبان وأجبان",em:"🥛",c:"#78AEE6"},
 {id:"meat",name:"لحوم ودواجن",em:"🍗",c:"#D96A63"},
 {id:"fish",name:"أسماك",em:"🐟",c:"#5CBFC4"},
 {id:"frozen",name:"مجمدات",em:"🧊",c:"#7FB7E0"},
 {id:"can",name:"معلبات",em:"🥫",c:"#C49C66"},
 {id:"dry",name:"رز ومعكرونة وحبوب",em:"🍚",c:"#B8A46E"},
 {id:"sauce",name:"زيوت وصوصات",em:"🫙",c:"#C9A44A"},
 {id:"spice",name:"توابل",em:"🧂",c:"#D6A61E"},
 {id:"oat",name:"شوفان ومكسرات وبذور",em:"🌾",c:"#A8926C"},
 {id:"snack",name:"سناكات وحلا",em:"🍫",c:"#C77A9C"},
 {id:"coffee",name:"قهوة وشاي",em:"☕",c:"#B97A44"},
 {id:"drink",name:"مشروبات ومياه",em:"🧃",c:"#5AA8D6"},
 {id:"paper",name:"مناديل وورقيات",em:"🧻",c:"#9AA1AD"},
 {id:"clean",name:"منظفات",em:"🧴",c:"#4FB39A"},

function coreTokens(s){return tokens(s).filter(function(t){return NOISE_WORDS.indexOf(t)<0;}).map(function(t){return t.length>4?t.replace(/^ال/,""):t;});}
function qual(tk){return tk.indexOf("قليل")>=0?"low":(tk.indexOf("كامل")>=0?"full":(tk.indexOf("خالي")>=0?"skim":null));}

function seed(){
  var items={};
  CATS.forEach(function(c){(SEED[c.id]||[]).forEach(function(x){
    var id=c.id+":"+x[0];
    items[id]={id:id,name:x[0],cat:c.id,em:x[2],cycle:x[1],last:null,buys:[],prices:{},learned:0};
  });});
  return {items:items,list:{},cart:{},receipts:[],codes:{},photoV:0,created:Date.now()};
}
function norm(st){st=st||{};if(!st.items||!Object.keys(st.items).length)return migrate(seed());st.list=st.list||{};st.cart=st.cart||{};st.receipts=st.receipts||[];st.trips=st.trips||[];st.stores=st.stores||[];st.codes=st.codes||{};st.names=st.names||{};st.photoV=st.photoV||0;return migrate(st);}
function migrate(st){
  if((st.catalogV||1)>=CATALOG_V)return st;
  if((st.catalogV||1)>=2){ Object.keys(st.items).forEach(function(id){var it=st.items[id];if(!it.brands)it.brands=seedBrands(it.name);}); st.catalogV=CATALOG_V; return st; }
  var have={};Object.keys(st.items).forEach(function(id){have[normAr(st.items[id].name)]=1;});
  Object.keys(st.items).forEach(function(id){var it=st.items[id];if(it.cat==="veg"&&FRUITS.indexOf(it.name)>=0)it.cat="fruit";if(it.cycle0==null)it.cycle0=it.cycle;});
  CATS.forEach(function(c){(SEED[c.id]||[]).forEach(function(x){if(have[normAr(x[0])])return;var id=c.id+":"+x[0];st.items[id]={id:id,name:x[0],cat:c.id,em:x[2],cycle:x[1],cycle0:x[1],last:null,buys:[],prices:{},learned:0,brands:seedBrands(x[0])};have[normAr(x[0])]=1;});});
  if((st.catalogV||1)<3)Object.keys(st.items).forEach(function(id){var it=st.items[id];if(!it.brands)it.brands=seedBrands(it.name);});
  st.catalogV=CATALOG_V;return st;
}
function recompute(it){
  var b=(it.buys||[]).slice().sort(function(a,c){return a-c;});
  it.last=b.length?b[b.length-1]:null;
  var iv=[];for(var i=1;i<b.length;i++){var d=(b[i]-b[i-1])/DAY;if(d>=1)iv.push(d);}
  var base=it.cycle0||it.cycle;
  if(!iv.length){it.cycle=base;it.learned=0;return;}
  iv=iv.slice(-4);var avg=iv.reduce(function(a,c){return a+c;},0)/iv.length;
  var w=Math.min(.8,.35+.15*iv.length);
  it.cycle=Math.max(1,Math.min(180,Math.round(base*(1-w)+avg*w)));it.learned=iv.length;
}
function rollback(st,items,ts){
  (items||[]).forEach(function(x){var it=st.items[x.id];if(!it)return;
    it.buys=(it.buys||[]).filter(function(t){return Math.abs(t-ts)>60000;});
    Object.keys(it.prices||{}).forEach(function(k){var pr=it.prices[k];if(pr&&Math.abs((pr.ts||0)-ts)<60000&&pr.src!=="web")delete it.prices[k];});
    recompute(it);
  });
}

/* ---- pure ops (applied identically on both phones) ---- */
function apply(st,op){
  var p=op.p||{};
  switch(op.t){
    case "list.add": if(st.items[p.id]){st.list[p.id]={qty:p.qty||1,at:op.ts,brand:p.brand||null};if(p.brand)st.items[p.id].usual=p.brand;} break;
    case "list.brand": if(st.list[p.id]){st.list[p.id].brand=p.brand||null;if(p.brand&&st.items[p.id])st.items[p.id].usual=p.brand;} break;
    case "brand.add": if(st.items[p.id]&&p.name){var bl=st.items[p.id].brands||[];if(bl.indexOf(p.name)<0)st.items[p.id].brands=bl.concat([p.name]);} break;
    case "brand.remove": if(st.items[p.id]){st.items[p.id].brands=(st.items[p.id].brands||[]).filter(function(b){return b!==p.name;});if(st.items[p.id].usual===p.name)st.items[p.id].usual=null;} break;
    case "list.remove": delete st.list[p.id]; delete st.cart[p.id]; break;
    case "list.qty": if(st.list[p.id])st.list[p.id].qty=p.qty; break;
    case "cart.toggle": if(st.cart[p.id])delete st.cart[p.id]; else st.cart[p.id]=op.ts; break;
    case "cart.clear": st.cart={}; break;
    case "list.clear": st.list={}; st.cart={}; break;
    case "item.add": st.items[p.item.id]=p.item; break;
    case "item.update": if(st.items[p.id])Object.keys(p.patch).forEach(function(k){st.items[p.id][k]=p.patch[k];}); break;
    case "item.remove": delete st.items[p.id]; delete st.list[p.id]; delete st.cart[p.id]; break;
    case "photo.bump": st.photoV=(st.photoV||0)+1; break;
    case "bought":
      (p.ids||[]).forEach(function(id){
        var it=st.items[id]; if(!it)return;
        var ts=p.ts||op.ts;
        if(it.cycle0==null)it.cycle0=it.cycle;
        it.buys=(it.buys||[]).concat([ts]).slice(-10); recompute(it);
        if(p.prices&&p.prices[id]!=null&&p.store){it.prices=it.prices||{};it.prices[p.store]={price:p.prices[id],ts:ts};}
        delete st.list[id]; delete st.cart[id];
      });
      break;
    case "prices.paid": Object.keys(p.prices||{}).forEach(function(id){var it=st.items[id];if(it&&p.store&&p.prices[id]!=null){it.prices=it.prices||{};it.prices[p.store]={price:p.prices[id],ts:p.ts||op.ts};}}); break;
    case "trip.attach": (st.trips||[]).forEach(function(t){if(t.id===p.tripId){t.receiptId=p.receiptId;if(p.total)t.total=p.total;if(p.store)t.store=p.store;}}); break;
    case "store.add": if(p.name&&STORES.indexOf(p.name)<0&&(st.stores||[]).indexOf(p.name)<0)st.stores=(st.stores||[]).concat([p.name]); break;
    case "trip.remove": {
      var t=(st.trips||[]).find(function(x){return x.id===p.id;}); if(!t)break;
      rollback(st,t.items,t.ts);
      st.trips=st.trips.filter(function(x){return x.id!==p.id;});
      if(t.receiptId)st.receipts=st.receipts.filter(function(r){return r.id!==t.receiptId;});
      break; }
    case "receipt.remove": {
      var r=(st.receipts||[]).find(function(x){return x.id===p.id;}); if(!r)break;
      rollback(st,r.lines.map(function(l){return {id:l.itemId};}),r.ts);
      st.receipts=st.receipts.filter(function(x){return x.id!==p.id;});
      st.trips=(st.trips||[]).filter(function(t){return t.receiptId!==p.id;});
      break; }
    case "prices.found":
      (p.list||[]).forEach(function(f){var it=st.items[f.id];if(!it)return;it.prices=it.prices||{};(f.prices||[]).forEach(function(x){var cur=it.prices[x.store];if(!cur||cur.src==="web"||x.price<cur.price)it.prices[x.store]={price:x.price,ts:op.ts,src:"web"};});});
      break;
    case "suggest.dismiss": if(st.items[p.id]){var d=st.items[p.id];d.dismissed=(d.dismissed||[]).concat([op.ts]).slice(-6);} break;
    case "trip.add": st.trips=[p.trip].concat(st.trips||[]).slice(0,30); break;
    case "codes.learn": st.codes=st.codes||{};st.names=st.names||{};Object.keys(p.codes||{}).forEach(function(c){if(p.codes[c])st.codes[c]=p.codes[c];});Object.keys(p.names||{}).forEach(function(c){if(p.names[c])st.names[c]=p.names[c];}); break;
    case "receipt.add": st.receipts=[p.receipt].concat(st.receipts).slice(0,40); break;
    case "receipt.compare": st.receipts.forEach(function(r){if(r.id===p.rid){r.compare=p.results;r.comparedAt=op.ts;}}); break;
  }
  return st;
}

async function call(body,ms){
  var ctl=new AbortController(); var t=setTimeout(function(){ctl.abort();},ms||15000);
  try{
    body.pin=PIN;var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});
    var j=await r.json().catch(function(){return {};});
    if(r.status===401)throw new Error("pin");
    if(r.status===409)return {conflict:true,v:j.v,state:j.state};
    if(!r.ok){var msg=String(j.error||("http "+r.status));if(/credit balance/i.test(msg))msg="رصيد مفتاح Anthropic خلص — عبّيه من console.anthropic.com ثم حاول مرة ثانية";if(msg==="budget")msg="وصلت حد ميزانية البحث الشهرية ("+ar(j.budget||15)+" ر.س) — يفتح أول الشهر أو ارفعه من Vercel (MAQADI_BUDGET_SAR)";throw new Error(msg);}
    return j;
  } finally{clearTimeout(t);}
}
function cacheLocal(){try{localStorage.setItem("maqadi_state",JSON.stringify({v:V,state:S}));localStorage.setItem("maqadi_pending",JSON.stringify(pending));}catch(e){}}
function loadLocal(){ROLE=localStorage.getItem("maqadi_role")||"full";try{var c=JSON.parse(localStorage.getItem("maqadi_state")||"null");if(c&&c.state){S=norm(c.state);V=c.v||0;}pending=JSON.parse(localStorage.getItem("maqadi_pending")||"[]");PHOTOS=JSON.parse(localStorage.getItem("maqadi_photos")||"{}");}catch(e){}}

async function pull(){
  var r=await call({action:"state"});
  if(r.role){ROLE=r.role;localStorage.setItem("maqadi_role",ROLE);}
  if(r.usage)USAGE=r.usage;
  if(!r.state){ S=norm(seed()); V=r.v||0; await push(); }
  else { var before=r.state.catalogV||1; S=norm(r.state); V=r.v; if((S.catalogV||1)!==before)await push(); }
  cacheLocal();
}
async function push(){
  var r=await call({action:"save",v:V,state:S});
  if(r.conflict){ S=norm(r.state); V=r.v; return false; }
  V=r.v; cacheLocal(); return true;
}
function op(t,p){
  var o={t:t,p:p||{},ts:Date.now()};
  apply(S,o); pending.push(o); cacheLocal(); try{render();}catch(e){console.error(e);} flush();
}
async function flush(){
  if(saving||!pending.length||!online)return;
  saving=true;
  try{
    var batch=pending.slice();
    var ok=await push();
    if(!ok){ batch.forEach(function(o){apply(S,o);}); ok=await push(); if(!ok){batch.forEach(function(o){apply(S,o);}); ok=await push();} }
    if(ok){ pending=pending.slice(batch.length); cacheLocal(); }
  }catch(e){ if(String(e.message)==="pin"){gate("الرمز غلط");} }
  finally{ saving=false; if(pending.length&&online)setTimeout(flush,1500); }
}
async function poll(){
  if(document.hidden||!online||saving||pending.length)return;
  try{
    var r=await call({action:"state"},8000);
    if(r.role&&r.role!==ROLE){ROLE=r.role;localStorage.setItem("maqadi_role",ROLE);buildTabs();render();}
    if(r.usage)USAGE=r.usage;
    if(r.state&&r.v>V){ S=norm(r.state); V=r.v; cacheLocal(); if(!sheetEl)render(); if(S.photoV!==(PHOTOS.__v||0))loadPhotos(); }
  }catch(e){}
}
async function loadPhotos(){
  try{ var r=await call({action:"photos"}); PHOTOS=r.photos||{}; PHOTOS.__v=S.photoV; localStorage.setItem("maqadi_photos",JSON.stringify(PHOTOS)); render(); }catch(e){}
}
window.addEventListener("online",function(){online=true;$("net").classList.add("hidden");flush();poll();});
window.addEventListener("offline",function(){online=false;$("net").classList.remove("hidden");});

/* =================================================================
   INTELLIGENCE
   ================================================================= */
function ratio(it){return it.last?((Date.now()-it.last)/DAY)/it.cycle:null;}
function score(it){var r=ratio(it);if(r!==null)return Math.min(3,r);return .55+.45*Math.min(1,10/it.cycle);}
function status(it){var r=ratio(it);if(r===null)return null;if(r>=1)return "late";if(r>=.75)return "soon";return "ok";}
function lastPrice(it){var best=null;Object.keys(it.prices||{}).forEach(function(s){var p=it.prices[s];if(!best||p.ts>best.ts)best={store:s,price:p.price,ts:p.ts};});return best;}
function tripEstimate(){var sum=0,known=0,n=0;Object.keys(S.list).forEach(function(id){var it=S.items[id];if(!it)return;n++;var lp=lastPrice(it);if(lp){sum+=lp.price*(S.list[id].qty||1);known++;}});return {sum:sum,known:known,n:n};}
function storeWins(){
  var wins={};
  S.receipts.forEach(function(r){(r.compare||[]).forEach(function(c){if(c.lowest&&c.lowest.store){wins[c.lowest.store]=(wins[c.lowest.store]||0)+1;}});});
  return Object.keys(wins).map(function(s){return {store:s,n:wins[s]};}).sort(function(a,b){return b.n-a.n;});
}
function suppressed(it){var d=(it.dismissed||[]);if(!d.length)return false;var last=d[d.length-1],streak=d.filter(function(t){return Date.now()-t<60*DAY;}).length;return Date.now()-last<Math.max(2,it.cycle*.5*streak)*DAY;}
function suggestions(max){
  return Object.keys(S.items).map(function(id){return S.items[id];}).filter(function(it){return !S.list[it.id]&&it.last&&status(it)!=="ok"&&!suppressed(it);}).sort(function(a,b){return score(b)-score(a);}).slice(0,max||6);
}
function parseQty(raw){
  var t=String(raw||"").trim().replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);});
  var m=t.match(/^(.*?)\s*(?:[×x*]\s*)?(\d{1,3})\s*(حبة|حبات|حبه|كيلو|كجم|لتر|علبة|علب|كرتون|كيس)?\s*$/i);
  if(m&&m[1].trim()&&Number(m[2])>0){ if(/^(كيلو|كجم|لتر)$/.test(m[3]||""))return {name:t,qty:1,unit:""}; return {name:m[1].trim(),qty:Math.min(99,Number(m[2])),unit:m[3]||""}; }
  var m2=t.match(/^(\d{1,3})\s*(?:[×x*]\s*)?(.+)$/);
  if(m2&&Number(m2[1])>0)return {name:m2[2].trim(),qty:Math.min(99,Number(m2[1])),unit:""};
  return {name:t,qty:1,unit:""};
}
function baseName(n){return normAr(String(n).replace(/\s*\(.*?\)\s*/g," "));}
function findDup(name){
  var q=normAr(name);if(!q)return [];
  var exact=Object.keys(S.items).map(function(id){return S.items[id];}).filter(function(it){return normAr(it.name)===q;});
  if(exact.length)return exact;
  return Object.keys(S.items).map(function(id){return S.items[id];}).filter(function(it){return baseName(it.name)===q;});
}
function lowestKnown(it){var best=null;Object.keys(it.prices||{}).forEach(function(s){var p=it.prices[s];if(!best||p.price<best.price)best={store:s,price:p.price,ts:p.ts,src:p.src||"paid"};});return best;}
function bestStoreForList(){
  var tally={};
  Object.keys(S.list).forEach(function(id){var it=S.items[id];if(!it||Object.keys(it.prices||{}).length<2)return;var lo=lowestKnown(it);if(lo)tally[lo.store]=(tally[lo.store]||0)+1;});
  var best=null;Object.keys(tally).forEach(function(s){if(!best||tally[s]>tally[best])best=s;});
  return best?{store:best,n:tally[best]}:null;
}
function monthSpend(offset){
  var d=new Date();d.setMonth(d.getMonth()-(offset||0));var y=d.getFullYear(),m=d.getMonth();
  var sum=0,n=0,byStore={};
  S.receipts.forEach(function(r){var t=new Date(r.ts);if(t.getFullYear()===y&&t.getMonth()===m&&r.total){sum+=r.total;n++;byStore[r.store]=(byStore[r.store]||0)+r.total;}});
  return {sum:sum,n:n,byStore:byStore,label:d.toLocaleDateString("ar-SA-u-ca-gregory",{month:"long"})};
}
function matchCatalog(name){
  // Match on the words that name the product, never on brand/size/colour words alone.
  var tk=coreTokens(name);if(!tk.length)return null;
  var rq=qual(tokens(name)),best=null,bs=0,bt=0;
  Object.keys(S.items).forEach(function(id){
    var it=S.items[id],ct=coreTokens(it.name);if(!ct.length)return;
    var hit=0;ct.forEach(function(c){if(tk.some(function(t){return c===t||(c.length>3&&t.length>3&&(c.indexOf(t)===0||t.indexOf(c)===0));}))hit++;});
    if(!hit)return;
    var s=hit/ct.length, cq=qual(tokens(it.name));
    if(rq&&cq&&rq!==cq)s*=.4;
    var tie=hit/tk.length;
    if(s>bs||(s===bs&&tie>bt)){bs=s;bt=tie;best=it;}
  });
  // every product word of the catalog item must be present - a half match is a guess
  return bs>=.99?best:null;
}

async function refreshAllPrices(ids){
  var todo=ids.map(function(id){return S.items[id];}).filter(Boolean);
  if(!todo.length)return;
  refreshing={done:0,total:todo.length};render();
  for(var i=0;i<todo.length;i+=3){
    var ch=todo.slice(i,i+3);
    try{
      var r=await call({action:"compare",store:"",items:ch.map(function(it){return {name:it.name,paid:null};})},58000);
      var found=[];ch.forEach(function(it){var c=(r.results||[]).find(function(x){return normAr(x.name)===normAr(it.name);});if(c&&c.prices&&c.prices.length)found.push({id:it.id,prices:c.prices});op("item.update",{id:it.id,patch:{priceChecked:Date.now()}});});
      if(found.length)op("prices.found",{list:found});
    }catch(e){refreshing=null;render();toast(String(e.message||e),true);return;}
    refreshing.done=Math.min(todo.length,i+3);if(view==="home")render();
  }
  refreshing=null;render();toast("حدّثنا الأسعار",true);
}
async function checkPrice(it){
  if(priceBusy[it.id])return;priceBusy[it.id]=true;render();
  try{
    var lp=lastPrice(it);
    var r=await call({action:"compare",store:lp?lp.store:"",items:[{name:it.name,paid:lp?lp.price:null}]},58000);
    var c=(r.results||[])[0];
    if(c&&c.prices&&c.prices.length){op("prices.found",{list:[{id:it.id,prices:c.prices}]});op("item.update",{id:it.id,patch:{priceChecked:Date.now()}});toast("الأقل: "+money(c.lowest.price)+" عند "+storeName(c.lowest.store),true);}
    else toast("ما لقينا سعر واضح لهذا الصنف اليوم",true);
  }catch(e){toast(String(e.message||"ما قدرنا نجيب السعر الحين"),true);}
  delete priceBusy[it.id];render();
}

  // TLV: tag(1) len(1) value(len). Tags 1..5 are phase-1 fields; 6..9 (hash/signature) ignored.
  var t=String(text||"").trim();if(!/^[A-Za-z0-9+/=\s]+$/.test(t)||t.length<40)return null;

  var dec=new TextDecoder("utf-8"),out={},i=0,n=0;
  while(i+2<=u.length){var tag=u[i],len=u[i+1];i+=2;if(i+len>u.length)break;var v=dec.decode(u.slice(i,i+len));i+=len;n++;

    if(n>12)break;}

}

/* A receipt is a long narrow strip, and the vision model resizes any image it is given
   down to a fixed budget on the long edge. Sending the whole strip as one picture spent
   that entire budget on length: the Arabic item names came through a few pixels tall,
   too small to read, while the Latin price digits survived. That is why v2.2 returned
   correct prices attached to invented names. Fix: cut the strip into overlapping
   slices and send them as separate images, so each slice gets the full budget for a
   few centimetres of print. Overlap means no line is lost at a cut; the backend
   de-duplicates by item code. */

   neighbourhood, so paper goes white and ink goes black regardless of shadow, glare or
   the greyness of the thermal print. This is the single cheapest thing that helps OCR. */

    if(!j.build||j.build===BUILD_ID)return false;
    var already=location.search.indexOf("v="+j.build)>=0;
    if(!silent||already){var b=$("upd");b.classList.remove("hidden");b.onclick=function(){forceReload(j.build);};return false;}
    forceReload(j.build);return true;
  }catch(e){return false;}
}
async function forceReload(build){
  try{if("caches" in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));}}catch(e){}
  try{if("serviceWorker" in navigator){var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister();}));}}catch(e){}
  location.replace(location.pathname+"?v="+build);
}
(async function boot(){
  if(await checkUpdate(true))return;
  setInterval(function(){checkUpdate(false);},5*60000);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});}catch(e){}}
  loadLocal();
  PIN=localStorage.getItem("maqadi_pin")||"";
  if(!PIN){gate();return;}
  if(S){start();try{await pull();render();}catch(e){if(String(e.message)==="pin")gate("الرمز غلط");}}
  else{try{await pull();start();}catch(e){gate(String(e.message)==="pin"?"الرمز غلط":"ما قدرنا نوصل للخادم: "+e.message);}}
})();
})();
</script>
