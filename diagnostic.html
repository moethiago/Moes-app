<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0a0a0f; color: #e8e8f0;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 14px; font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  h1 { color: #ff3366; font-size: 18px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 11px; margin-bottom: 14px; }
  #verdict {
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    background: #15151c;
    border: 2px solid #333;
    text-align: center;
  }
  #verdict.green { border-color: #00ff88; background: rgba(0,255,136,0.06); }
  #verdict.red   { border-color: #ff3366; background: rgba(255,51,102,0.06); }
  #verdict.amber { border-color: #ffaa00; background: rgba(255,170,0,0.06); }
  #verdict h2 { font-size: 16px; margin-bottom: 6px; }
  #verdict .big { font-size: 28px; margin-bottom: 6px; }
  #verdict .what { font-size: 13px; color: #ddd; margin-top: 8px; }
  #verdict .fix { font-size: 12px; color: #aaf; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; text-align: left; }
  .stats { display: flex; gap: 6px; margin-bottom: 14px; }
  .stat { flex: 1; padding: 10px; border-radius: 8px; background: #15151c; text-align: center; }
  .stat .n { font-size: 22px; font-weight: bold; }
  .stat .l { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .stat.pass .n { color: #00ff88; }
  .stat.fail .n { color: #ff3366; }
  .stat.warn .n { color: #ffaa00; }
  .test {
    border-radius: 10px; padding: 11px 13px; margin-bottom: 7px;
    border-left: 4px solid #333; background: #13131a;
  }
  .test.pass { border-left-color: #00ff88; }
  .test.fail { border-left-color: #ff3366; }
  .test.warn { border-left-color: #ffaa00; }
  .test .name { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .test .result { font-size: 13px; font-weight: 500; }
  .test.pass .result { color: #00ff88; }
  .test.fail .result { color: #ff3366; }
  .test.warn .result { color: #ffaa00; }
  .test .detail { font-size: 10px; color: #888; margin-top: 6px; font-family: ui-monospace, monospace; word-break: break-all; }
  .test .fix { font-size: 11px; color: #88aaff; margin-top: 6px; }
  .btn {
    background: #ff3366; color: #fff; border: none;
    padding: 13px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    width: 100%; margin-top: 10px;
  }
  .btn.alt { background: #2a2a3a; }
  .btn.go { background: #00aa55; }
  details { background: #13131a; border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 12px; }
  details summary { cursor: pointer; color: #aaf; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; color: #aaa; font-size: 10px; margin-top: 8px; font-family: ui-monospace, monospace; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>

<h1>Moe's App — Full Diagnostic</h1>
<div class="sub" id="ts">Initializing...</div>

<div id="verdict">
  <div class="big">.</div>
  <div>Running tests...</div>
</div>

<div class="stats">
  <div class="stat pass"><div class="n" id="np">0</div><div class="l">Pass</div></div>
  <div class="stat fail"><div class="n" id="nf">0</div><div class="l">Fail</div></div>
  <div class="stat warn"><div class="n" id="nw">0</div><div class="l">Warn</div></div>
</div>

<div id="out"></div>

<button class="btn" onclick="location.reload()">Run Again</button>
<button class="btn alt" onclick="copyReport()">Copy Full Report</button>
<button class="btn go" id="trigger-btn">Trigger /api/news Now</button>

<details>
  <summary>Raw log</summary>
  <pre id="raw"></pre>
</details>

<script>
// ==================================================================
// DIAGNOSTIC v3 - built to actually work on iOS Safari
// No smart quotes, no AbortSignal.timeout, no script-tag loading hacks
// ==================================================================

var REPO_BASE = 'https://moethiago.github.io/Moes-app';
var VERCEL    = 'https://moes-app-two.vercel.app';

var results = [];
var rawLog  = [];
var p = 0, f = 0, w = 0;

function logRaw(msg) {
  rawLog.push('[' + new Date().toISOString() + '] ' + msg);
  document.getElementById('raw').textContent = rawLog.join('\n');
}

function record(name, status, result, detail, fix) {
  results.push({ name: name, status: status, result: result, detail: detail || '', fix: fix || '' });
  if (status === 'pass') p++;
  if (status === 'fail') f++;
  if (status === 'warn') w++;
  document.getElementById('np').textContent = p;
  document.getElementById('nf').textContent = f;
  document.getElementById('nw').textContent = w;
  render();
  logRaw(name + ' :: ' + status.toUpperCase() + ' :: ' + result + (detail ? ' :: ' + detail : ''));
}

function render() {
  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<div class="test ' + r.status + '">';
    html += '<div class="name">' + esc(r.name) + '</div>';
    html += '<div class="result">' + esc(r.result) + '</div>';
    if (r.detail) html += '<div class="detail">' + esc(r.detail) + '</div>';
    if (r.fix)    html += '<div class="fix">FIX: ' + esc(r.fix) + '</div>';
    html += '</div>';
  }
  document.getElementById('out').innerHTML = html;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

// Cross-browser timeout wrapper (avoids AbortSignal.timeout which Safari handles poorly)
function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve) {
    var done = false;
    var timer = setTimeout(function() {
      if (done) return;
      done = true;
      resolve({ ok: false, error: 'TIMEOUT after ' + ms + 'ms' });
    }, ms || 10000);

    fetch(url, { cache: 'no-store' }).then(function(r) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      r.text().then(function(text) {
        resolve({ ok: r.ok, status: r.status, text: text });
      }).catch(function(e) {
        resolve({ ok: false, error: 'Read failed: ' + e.message });
      });
    }).catch(function(e) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      resolve({ ok: false, error: e.message || 'Network error' });
    });
  });
}

function bust(url) {
  return url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();
}

function fetchJSON(url, ms) {
  return fetchWithTimeout(url, ms).then(function(res) {
    if (!res.ok) return res;
    try {
      return { ok: true, status: res.status, data: JSON.parse(res.text) };
    } catch (e) {
      return { ok: false, error: 'BAD JSON: ' + res.text.slice(0, 80) };
    }
  });
}

// ==================================================================
// FILE INTEGRITY (text-based, does NOT execute the file)
// ==================================================================
function checkFile(name, path, requiredKeywords) {
  return fetchWithTimeout(bust(REPO_BASE + path), 8000).then(function(res) {
    if (!res.ok) {
      record(name, 'fail', 'Cannot fetch file: ' + (res.error || 'HTTP ' + res.status),
        path, 'Check GitHub Pages deployment.');
      return;
    }
    var text = res.text;
    var size = Math.round(text.length / 1024);

    var smartSingle = (text.match(/[\u2018\u2019]/g) || []).length;
    var smartDouble = (text.match(/[\u201C\u201D]/g) || []).length;

    if (smartSingle + smartDouble > 0) {
      record(name, 'fail',
        'CORRUPT: ' + (smartSingle + smartDouble) + ' smart quote characters',
        smartSingle + ' curly singles + ' + smartDouble + ' curly doubles. Browser cannot parse this as JavaScript.',
        'Replace with the clean ASCII version. Do NOT edit JS files in Notes, Pages, or TextEdit (rich text).');
      return;
    }

    var fences = (text.match(/^```/gm) || []).length;
    if (fences > 0) {
      record(name, 'fail',
        'CORRUPT: ' + fences + ' markdown fence lines embedded in file',
        null,
        'Remove every line containing only triple backticks.');
      return;
    }

    if (requiredKeywords && requiredKeywords.length) {
      var missing = [];
      for (var i = 0; i < requiredKeywords.length; i++) {
        if (text.indexOf(requiredKeywords[i]) === -1) missing.push(requiredKeywords[i]);
      }
      if (missing.length) {
        record(name, 'warn',
          'File loaded but missing expected symbols: ' + missing.join(', '),
          'File is ' + size + ' KB',
          'File may be incomplete or truncated.');
        return;
      }
    }

    record(name, 'pass', 'Clean - ' + size + ' KB, no corruption detected', null, null);
  });
}

// ==================================================================
// MAIN TESTS
// ==================================================================
function runAll() {
  document.getElementById('ts').textContent = 'Started ' + new Date().toLocaleString();
  logRaw('Diagnostic v4 started. UA: ' + navigator.userAgent.slice(0, 80));

  var chain = Promise.resolve()

  // FILE INTEGRITY — F1
  .then(function() { return checkFile('f1-config.js',       '/js/f1/f1-config.js',
    ['SESSION_DURATION', 'TEAM_COLORS']); })
  .then(function() { return checkFile('f1-calendar.js',     '/js/f1/f1-calendar.js',
    ['F1_CALENDAR']); })
  .then(function() { return checkFile('f1-fallback.js',     '/js/f1/f1-fallback.js',
    ['F1_STANDINGS_FALLBACK', 'F1_CONSTRUCTORS_FALLBACK']); })
  .then(function() { return checkFile('f1-standings.js',    '/js/f1/f1-standings.js',
    ['renderDriverStandings', 'loadF1Data']); })
  .then(function() { return checkFile('f1-subtabs.js',      '/js/f1/f1-subtabs.js',
    ['switchF1Sub', 'initF1Subtabs']); })

  // FILE INTEGRITY — Home / AI personalization
  .then(function() { return checkFile('home.js',            '/js/home/home.js',
    ['loadHome', 'homeLoadNews', 'homeClusterStories']); })
  .then(function() { return checkFile('taste.js',           '/js/home/taste.js',
    ['classifyStory', 'recordOpen', 'typeScore', 'STORY_TYPES']); })
  .then(function() { return checkFile('notify.js',          '/js/home/notify.js',
    ['notifyInit', 'notifyEnable']); })

  // FILE INTEGRITY — Football (subtabs)
  .then(function() { return checkFile('football-config.js', '/js/football/football-config.js',
    ['FOOTBALL_LEAGUES', 'BACKEND_URL']); })
  .then(function() { return checkFile('football-subtabs.js','/js/football/football-subtabs.js',
    ['switchFootballSub', 'initFootballSubtabs']); })
  .then(function() { return checkFile('football-tables.js', '/js/football/football-tables.js',
    ['loadFootballTables', 'FT_LEAGUE_META']); })
  .then(function() { return checkFile('football-views.js',  '/js/football/football-views.js',
    ['loadFootballToday', 'loadFootballUpcoming']); })
  .then(function() { return checkFile('football-news.js',   '/js/football/football-news.js',
    ['loadFootballNews']); })

  // FILE INTEGRITY — World Cup (subtabs + auto-bracket)
  .then(function() { return checkFile('wc-engine.js',       '/js/football/wc-engine.js',
    ['wcLoad', 'wcGroupTable', 'wcKnockout']); })
  .then(function() { return checkFile('wc-subtabs.js',      '/js/football/wc-subtabs.js',
    ['switchWCSub', 'initWCSubtabs']); })
  .then(function() { return checkFile('wc-bracket-engine.js','/js/football/wc-bracket-engine.js',
    ['wcQualifiers', 'wcR32Template', 'wcResolveSlot']); })
  .then(function() { return checkFile('wc-groups.js',       '/js/football/wc-groups.js',
    ['loadWCGroups', 'loadWCBracket']); })

  // FILE INTEGRITY — Feed + core
  .then(function() { return checkFile('feed-render.js',     '/js/feed/feed-render.js',
    ['renderNewsFeed', 'setFeedFilter']); })
  .then(function() { return checkFile('feed-fetch.js',      '/js/feed/feed-fetch.js',
    ['loadNewsFeed']); })
  .then(function() { return checkFile('core.js',            '/js/core.js',
    ['switchTab', 'startClock', 'loadHome']); })
  .then(function() { return checkFile('index.html',         '/index.html',
    ['js/home/home.js', 'js/home/taste.js', 'js/football/wc-bracket-engine.js', 'panel-home', 'panel-f1', 'panel-football', 'panel-worldcup']); })

  // FEED CONTENT + PIPELINE STATS
  .then(function() {
    return fetchJSON(VERCEL + '/api/feed', 12000).then(function(res) {
      if (!res.ok) {
        record('Feed API (/api/feed)', 'fail', res.error || 'HTTP ' + res.status, null,
          'Check Vercel deployment. Open ' + VERCEL + '/api/feed in Safari.');
        return;
      }
      var stories = (res.data && res.data.stories) || [];
      var perCat  = (res.data && res.data.perCat)  || {};
      if (!stories.length) {
        record('Feed API (/api/feed)', 'warn', '0 stories returned', JSON.stringify(perCat),
          'Run /api/ingest then /api/score to populate. Use Trigger button below.');
        return;
      }
      var now  = Math.floor(Date.now() / 1000);
      var ages = stories.map(function(s) { return (now - (s.pubTs || now)) / 3600; });
      var youngest = Math.min.apply(null, ages);
      var oldest   = Math.max.apply(null, ages);
      var status   = youngest > 6 ? 'warn' : 'pass';
      var msg      = stories.length + ' stories, freshest ' + youngest.toFixed(1) + 'h ago';
      var detail   = 'Oldest: ' + oldest.toFixed(1) + 'h | Per cat: ' + JSON.stringify(perCat);
      var fix      = status === 'warn' ? 'Cron may not be running. Use Trigger button below.' : null;
      record('Feed API (/api/feed)', status, msg, detail, fix);
    });
  })

  // NEW: dedup + embeddings health (v30+)
  .then(function() {
    return fetchJSON(VERCEL + '/api/feed', 12000).then(function(res) {
      var stories = (res.data && res.data.stories) || [];
      if (!stories.length) { record('Dedup + embeddings', 'warn', 'no stories to check', null, null); return; }
      var withEmb = stories.filter(function(s){ return s.emb && s.emb.length; }).length;
      var withSrc = stories.filter(function(s){ return typeof s.sources !== 'undefined'; }).length;
      var multiSrc = stories.filter(function(s){ return (s.sources||1) > 1; }).length;
      if (!withSrc) {
        record('Dedup + embeddings', 'fail', 'old backend — no "sources" field', null,
          'Deploy the new api/feed.js to Vercel.');
      } else if (!withEmb) {
        record('Dedup + embeddings', 'warn', withSrc + ' stories have sources, but 0 have embeddings',
          'GEMINI_API_KEY missing or stories pre-date it.',
          'Set GEMINI_API_KEY in Vercel; new stories get embeddings on next ingest.');
      } else {
        record('Dedup + embeddings', 'pass',
          withEmb + '/' + stories.length + ' embedded, ' + multiSrc + ' merged clusters', null, null);
      }
    });
  })

  // NEW: Twitter/X intake (v35+)
  .then(function() {
    return fetchJSON(VERCEL + '/api/feed', 12000).then(function(res) {
      var stories = (res.data && res.data.stories) || [];
      var fromX = stories.filter(function(s){ return (s.url||'').indexOf('x.com/') !== -1; }).length;
      if (fromX > 0) {
        record('Twitter/X intake', 'pass', fromX + ' stories from curated X accounts', null, null);
      } else {
        record('Twitter/X intake', 'warn', 'no X-sourced stories in feed',
          'Either TWITTERAPI_IO_KEY not set, or accounts had nothing new this window.',
          'Set TWITTERAPI_IO_KEY in Vercel and run /api/ingest.');
      }
    });
  })
  .then(function() {
    return fetchJSON(VERCEL + '/api/stats', 8000).then(function(res) {
      if (!res.ok) {
        record('Pipeline stats', 'warn', res.error || 'unreachable', null, null);
        return;
      }
      var s = (res.data && res.data.summary) || {};
      record('Pipeline stats', 'pass',
        '$' + ((s.cost24h || 0).toFixed(4)) + ' last 24h | ' +
        (s.ingest24h || 0) + ' ingested | ' + (s.approved24h || 0) + ' approved',
        'Per cat: ' + JSON.stringify(s.catCounts || {}), null);
    });
  })

  // VERCEL BACKEND
  .then(function() {
    return fetchJSON(VERCEL + '/api/football?league=epl', 12000).then(function(res) {
      if (!res.ok) {
        record('Vercel /api/football', 'fail', res.error || 'HTTP ' + res.status,
          VERCEL + '/api/football?league=epl',
          'Vercel function may have crashed. Check Vercel logs.');
        return;
      }
      var fx = (res.data.fixtures || []).length;
      var up = (res.data.upcoming || []).length;
      record('Vercel /api/football', 'pass', fx + ' live fixtures, ' + up + ' upcoming', null, null);
    });
  })

  // NEW: football tables/standings endpoint (v25+)
  .then(function() {
    return fetchJSON(VERCEL + '/api/football?league=epl&type=standings', 12000).then(function(res) {
      if (!res.ok) {
        record('Football tables (?type=standings)', 'fail', res.error || 'HTTP ' + res.status,
          null, 'Deploy the new api/football.js to Vercel.');
        return;
      }
      var t = (res.data && res.data.standings) || [];
      if (!t.length) {
        record('Football tables (?type=standings)', 'warn', 'endpoint OK but 0 rows',
          'Season may be between cycles; backend falls forward automatically.', null);
      } else {
        record('Football tables (?type=standings)', 'pass',
          t.length + ' rows, leader: ' + (t[0].team || '?'), null, null);
      }
    });
  })

  // EXTERNAL APIs
  .then(function() {
    return fetchJSON('https://api.jolpi.ca/ergast/f1/current/driverstandings.json?limit=3', 10000).then(function(res) {
      if (!res.ok) { record('Jolpica F1 standings', 'fail', res.error, null, 'API may be down; app falls back to hardcoded standings.'); return; }
      var d = res.data;
      var sl = d && d.MRData && d.MRData.StandingsTable && d.MRData.StandingsTable.StandingsLists[0];
      if (sl && sl.DriverStandings && sl.DriverStandings.length) {
        var p1 = sl.DriverStandings[0];
        record('Jolpica F1 standings', 'pass', 'R' + sl.round + ' Leader: ' + p1.Driver.familyName + ' (' + p1.points + 'pts)', null, null);
      } else {
        record('Jolpica F1 standings', 'warn', 'No standings returned', null, null);
      }
    });
  })

  .then(function() {
    return fetchJSON('https://api.jolpi.ca/ergast/f1/current/last/results.json?limit=3', 10000).then(function(res) {
      if (!res.ok) { record('Jolpica last race', 'fail', res.error, null, null); return; }
      var race = res.data && res.data.MRData && res.data.MRData.RaceTable && res.data.MRData.RaceTable.Races[0];
      if (race && race.Results) {
        record('Jolpica last race', 'pass', race.raceName + ' - Winner: ' + race.Results[0].Driver.familyName, null, null);
      } else {
        record('Jolpica last race', 'warn', 'No race data', null, null);
      }
    });
  })

  .then(function() {
    return fetchJSON('https://api.openf1.org/v1/sessions?year=2026', 12000).then(function(res) {
      if (!res.ok) { record('OpenF1 live timing', 'warn', res.error, null, 'Used only during live sessions.'); return; }
      if (Array.isArray(res.data) && res.data.length) {
        var l = res.data[res.data.length - 1];
        record('OpenF1 live timing', 'pass', res.data.length + ' sessions; latest: ' + l.session_name, null, null);
      } else {
        record('OpenF1 live timing', 'warn', 'No 2026 sessions', null, null);
      }
    });
  })

  .then(function() {
    return fetchJSON('https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json', 10000).then(function(res) {
      if (!res.ok) { record('World Cup 2026 data', 'warn', res.error, null, null); return; }
      var m = (res.data && res.data.matches) || [];
      if (m.length) {
        record('World Cup 2026 data', 'pass', m.length + ' matches loaded', null, null);
      } else {
        record('World Cup 2026 data', 'warn', 'No matches yet (tournament starts Jun 11)', null, null);
      }
    });
  })

  // F1 CALENDAR LOGIC (computed locally)
  .then(function() {
    var sessions = [
      {race:'Canadian GP', name:'Practice 1',         ms:Date.parse('2026-05-22T16:30:00Z')},
      {race:'Canadian GP', name:'Sprint Qualifying',  ms:Date.parse('2026-05-22T20:30:00Z')},
      {race:'Canadian GP', name:'Sprint Race',        ms:Date.parse('2026-05-23T16:00:00Z')},
      {race:'Canadian GP', name:'Qualifying',         ms:Date.parse('2026-05-23T20:00:00Z')},
      {race:'Canadian GP', name:'Race',               ms:Date.parse('2026-05-24T20:00:00Z')},
      {race:'Spanish GP',  name:'Practice 1',         ms:Date.parse('2026-05-29T11:30:00Z')},
      {race:'Spanish GP',  name:'Race',               ms:Date.parse('2026-05-31T13:00:00Z')},
    ];
    var now = Date.now();
    var live = null;
    var next = null;
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      var dur = (s.name === 'Race' ? 2 : 1.5) * 3600 * 1000;
      if (now >= s.ms && now <= s.ms + dur) live = s;
      if (s.ms > now && !next) next = s;
    }
    if (live) {
      record('F1 timing calc', 'pass', 'LIVE NOW: ' + live.race + ' - ' + live.name, null, null);
    } else if (next) {
      var diff = next.ms - now;
      var h = Math.floor(diff / 3600000);
      var m = Math.floor(diff % 3600000 / 60000);
      var riyadhTime = new Date(next.ms).toLocaleString('en-US', {
        weekday: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Riyadh'
      });
      record('F1 timing calc', 'pass',
        next.race + ' ' + next.name + ' in ' + h + 'h ' + m + 'm',
        'Local Riyadh time: ' + riyadhTime, null);
    } else {
      record('F1 timing calc', 'warn', 'No upcoming sessions in checked range', null, null);
    }
  })

  // VERDICT
  .then(function() {
    showVerdict();
    logRaw('Complete: pass=' + p + ' fail=' + f + ' warn=' + w);
  });

  return chain;
}

// ==================================================================
// VERDICT
// ==================================================================
function showVerdict() {
  var v = document.getElementById('verdict');
  var color, head, summary, fix, emoji;

  var fileFails = results.filter(function(r) {
    return r.status === 'fail' && r.name.indexOf('integrity') > -1;
  });
  var contentIssues = results.filter(function(r) {
    return (r.status === 'fail' || r.status === 'warn') && (r.name === 'Feed content' || r.name === 'Feed deduplication');
  });
  var apiFails = results.filter(function(r) {
    return r.status === 'fail' && r.name.indexOf('integrity') === -1 && r.name.indexOf('Feed') === -1;
  });

  if (fileFails.length > 0) {
    color = 'red'; emoji = 'X';
    head  = 'JavaScript file corruption';
    var names = fileFails.map(function(r) { return r.name.replace(' integrity', ''); });
    summary = 'These files cannot run in the browser: ' + names.join(', ') + '. Affected tabs will not work until you replace the corrupted file(s).';
    fix = '1. Replace the broken file with the clean version. 2. Commit and push to GitHub. 3. Hard refresh to reload.';
  } else if (apiFails.length > 0) {
    color = 'amber'; emoji = '!';
    head  = 'Files OK but APIs failing';
    summary = apiFails.length + ' API(s) failed: ' + apiFails.map(function(r) { return r.name; }).join(', ') + '.';
    fix = 'Check Vercel logs and confirm env vars (ANTHROPIC_API_KEY, GITHUB_TOKEN, API_FOOTBALL_KEY) are set.';
  } else if (contentIssues.length > 0) {
    color = 'amber'; emoji = '!';
    head  = 'App works but news feed is stale or duplicated';
    summary = contentIssues.map(function(r) { return r.name + ': ' + r.result; }).join(' / ');
    fix = 'Tap "Trigger /api/news Now" below to force a refresh. Also confirm cron-job.org is still scheduled to call it every 10 minutes.';
  } else if (w > 0) {
    color = 'amber'; emoji = 'OK';
    head  = 'Mostly OK';
    summary = 'All critical systems working. ' + w + ' minor warning(s).';
    fix = 'Warnings are usually safe (pre-season data sources, etc).';
  } else {
    color = 'green'; emoji = 'OK';
    head  = 'All systems operational';
    summary = 'Every file is clean, every API responded, content is fresh.';
    fix = 'If the app still misbehaves, the issue is in render logic. Open Safari Web Inspector (Mac required) for runtime errors.';
  }

  v.className = color;
  v.innerHTML =
    '<div class="big">' + emoji + '</div>' +
    '<h2>' + head + '</h2>' +
    '<div class="what">' + summary + '</div>' +
    '<div class="fix"><strong>WHAT TO DO:</strong><br>' + fix + '</div>';
}

// ==================================================================
// TRIGGER /api/news MANUALLY
// ==================================================================
document.getElementById('trigger-btn').addEventListener('click', function() {
  var btn = this;
  btn.textContent = 'Running ingest...';
  btn.disabled = true;
  fetchWithTimeout(VERCEL + '/api/ingest', 60000).then(function(res) {
    btn.disabled = false;
    btn.textContent = 'Trigger Ingest + Score';
    if (!res.ok) {
      alert('FAIL: ' + (res.error || 'HTTP ' + res.status));
      return;
    }
    try {
      var d = JSON.parse(res.text);
      if (d.ok) {
        btn.textContent = 'Scoring...';
        fetchWithTimeout(VERCEL + '/api/score', 90000).then(function(r2) {
          btn.disabled = false;
          btn.textContent = 'Trigger Ingest + Score';
          try {
            var d2 = JSON.parse(r2.text);
            alert('Ingest: ' + (d.ingested||0) + ' new\nScore: ' + (d2.approved||0) + ' approved\nCost: $' + ((d2.cost||0).toFixed(4)) + '\n\nReload diagnostic to see updated feed.');
          } catch(e) { alert('Done. Reload diagnostic.'); }
        });
      } else alert('Ingest error: ' + (d.error || 'unknown'));
    } catch (e) {
      alert('Got response but it was not JSON: ' + res.text.slice(0, 200));
    }
  });
});

// ==================================================================
// COPY REPORT
// ==================================================================
function copyReport() {
  var lines = ["MOE'S APP DIAGNOSTIC REPORT"];
  lines.push('Time: ' + new Date().toISOString());
  lines.push('UA:   ' + navigator.userAgent);
  lines.push('Tally: pass=' + p + ' fail=' + f + ' warn=' + w);
  lines.push('');
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    lines.push('[' + r.status.toUpperCase() + '] ' + r.name);
    lines.push('  ' + r.result);
    if (r.detail) lines.push('  detail: ' + r.detail);
    if (r.fix)    lines.push('  fix:    ' + r.fix);
    lines.push('');
  }
  var text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      alert('Report copied. Paste it to Claude.');
    }, function() { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('Report copied.'); }
  catch (e) { alert('Copy failed. Use the raw log below.'); }
  document.body.removeChild(ta);
}

runAll();
