<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moe's App Diagnostics</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 16px; font-size: 13px; }
h1 { color: #ff3366; font-size: 16px; margin-bottom: 12px; }
.test { border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border-left: 4px solid #333; background: #111; }
.pass { border-left-color: #00ff88; }
.fail { border-left-color: #ff3366; }
.warn { border-left-color: #ffaa00; }
.name { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.result { margin-top: 4px; }
.pass .result { color: #00ff88; }
.fail .result { color: #ff3366; }
.warn .result { color: #ffaa00; }
.detail { font-size: 10px; color: #555; margin-top: 3px; }
#summary { text-align: center; padding: 14px; background: #111; border-radius: 8px; margin-bottom: 12px; font-size: 20px; font-weight: bold; }
.btn { background: #ff3366; color: #fff; border: none; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 14px; cursor: pointer; width: 100%; margin-top: 12px; }
</style>
</head>
<body>
<h1>Moe's App Diagnostics</h1>
<div id="summary">Starting...</div>
<div id="out"></div>
<button class="btn" onclick="runAll()">Run Again</button>
<script>
var p=0,f=0,w=0;
function log(name,status,result,detail){
  var d=document.createElement('div');
  d.className='test '+status;
  d.innerHTML='<div class="name">'+name+'</div><div class="result">'+result+'</div>'+(detail?'<div class="detail">'+detail+'</div>':'');
  document.getElementById('out').appendChild(d);
  if(status==='pass')p++;
  if(status==='fail')f++;
  if(status==='warn')w++;
  var s=document.getElementById('summary');
  s.textContent='Pass: '+p+' Fail: '+f+' Warn: '+w;
  s.style.color=f>0?'#ff3366':w>0?'#ffaa00':'#00ff88';
}
async function api(name,url,fn){
  try{
    var r=await fetch(url,{signal:AbortSignal.timeout(10000)});
    if(!r.ok){log(name,'fail','HTTP '+r.status);return;}
    fn(await r.json());
  }catch(e){log(name,'fail',e.name==='TimeoutError'?'TIMEOUT':e.message);}
}
async function runAll(){
  p=0;f=0;w=0;
  document.getElementById('out').innerHTML='';
  document.getElementById('summary').textContent='Running...';
  document.getElementById('summary').style.color='#4488ff';

await api(‘Vercel /api/news’,‘https://moes-app-two.vercel.app/api/news’,function(d){
if(d.ok)log(‘Vercel /api/news’,‘pass’,d.stories+’ stories written to feed’);
else log(‘Vercel /api/news’,‘fail’,d.error||‘unknown’);
});

await api(‘Vercel /api/football’,‘https://moes-app-two.vercel.app/api/football?league=epl’,function(d){
log(‘Vercel /api/football’,‘pass’,(d.fixtures||[]).length+’ today, ‘+(d.upcoming||[]).length+’ upcoming’);
});

await api(‘Jolpica F1 standings’,‘https://api.jolpi.ca/ergast/f1/current/driverstandings.json?limit=3’,function(d){
var sl=d.MRData&&d.MRData.StandingsTable&&d.MRData.StandingsTable.StandingsLists[0];
if(sl&&sl.DriverStandings&&sl.DriverStandings.length)
log(‘Jolpica F1 standings’,‘pass’,‘R’+sl.round+’ Leader: ‘+sl.DriverStandings[0].Driver.familyName+’ ’+sl.DriverStandings[0].points+‘pts’);
else log(‘Jolpica F1 standings’,‘warn’,‘No data’);
});

await api(‘Jolpica last race’,‘https://api.jolpi.ca/ergast/f1/current/last/results.json?limit=3’,function(d){
var race=d.MRData&&d.MRData.RaceTable&&d.MRData.RaceTable.Races[0];
if(race)log(‘Jolpica last race’,‘pass’,race.raceName+’ Winner: ’+(race.Results[0].Driver.familyName));
else log(‘Jolpica last race’,‘warn’,‘No data’);
});

await api(‘OpenF1 API’,‘https://api.openf1.org/v1/sessions?year=2026’,function(d){
if(d&&d.length){var l=d[d.length-1];log(‘OpenF1 API’,‘pass’,d.length+’ sessions. Latest: ‘+l.session_name+’ at ’+l.circuit_short_name);}
else log(‘OpenF1 API’,‘warn’,‘No 2026 sessions found’);
});

await api(‘World Cup data’,‘https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json’,function(d){
var m=d.matches||[];
if(m.length)log(‘World Cup data’,‘pass’,m.length+’ matches. First: ‘+m[0].team1+’ vs ‘+m[0].team2+’ on ’+m[0].date);
else log(‘World Cup data’,‘warn’,‘No matches’);
});

// Canadian GP pure JS timing check
var sessions=[
{name:‘Practice 1’,ms:Date.parse(‘2026-05-22T16:30:00Z’),dur:60},
{name:‘Sprint Qualifying’,ms:Date.parse(‘2026-05-22T20:30:00Z’),dur:60},
{name:‘Sprint Race’,ms:Date.parse(‘2026-05-23T16:00:00Z’),dur:45},
{name:‘Qualifying’,ms:Date.parse(‘2026-05-23T20:00:00Z’),dur:60},
{name:‘Race’,ms:Date.parse(‘2026-05-24T20:00:00Z’),dur:120},
];
var now=Date.now();
var live=sessions.find(function(s){return now>=s.ms&&now<=s.ms+s.dur*60000;});
var next=sessions.find(function(s){return s.ms>now;});
if(live){
log(‘Canadian GP session’,‘pass’,’LIVE NOW: ’+live.name);
}else if(next){
var diff=next.ms-now;
var h=Math.floor(diff/3600000);
var m=Math.floor(diff%3600000/60000);
var t=new Date(next.ms).toLocaleString([],{weekday:‘short’,hour:‘2-digit’,minute:‘2-digit’,timeZone:‘Asia/Riyadh’});
log(‘Canadian GP session’,‘pass’,’Next: ‘+next.name+’ in ’+h+‘h ‘+m+‘m’,t+’ Riyadh’);
}else{
log(‘Canadian GP session’,‘warn’,‘All sessions complete’);
}
}
runAll();
</script>

</body>
</html>
