<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moe's App Diagnostic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0a0a0f; color: #e8e8f0; font-family: -apple-system, system-ui, sans-serif; padding: 14px; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  h1 { color: #ff3366; font-size: 18px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 11px; margin-bottom: 14px; }
  #verdict { padding: 16px; border-radius: 12px; margin-bottom: 14px; background: #15151c; border: 2px solid #333; text-align: center; }
  #verdict.green { border-color: #00ff88; background: rgba(0,255,136,0.06); }
  #verdict.red   { border-color: #ff3366; background: rgba(255,51,102,0.06); }
  #verdict.amber { border-color: #ffaa00; background: rgba(255,170,0,0.06); }
  #verdict h2 { font-size: 16px; margin-bottom: 6px; }
  #verdict .big { font-size: 28px; margin-bottom: 6px; }
  #verdict .what { font-size: 13px; color: #ddd; margin-top: 8px; }
  #verdict .fix { font-size: 12px; color: #aaf; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; text-align: left; }
  .stats { display: flex; gap: 6px; margin-bottom: 14px; }
  .stat { flex: 1; padding: 10px; border-radius: 8px; background: #15151c; text-align: center; }
  .stat .n { font-size: 22px; font-weight: bold; }
  .stat .l { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .stat.pass .n { color: #00ff88; }
  .stat.fail .n { color: #ff3366; }
  .stat.warn .n { color: #ffaa00; }
  .test { border-radius: 10px; padding: 11px 13px; margin-bottom: 7px; border-left: 4px solid #333; background: #13131a; }
  .test.pass { border-left-color: #00ff88; }
  .test.fail { border-left-color: #ff3366; }
  .test.warn { border-left-color: #ffaa00; }
  .test .name { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .test .result { font-size: 13px; font-weight: 500; }
  .test.pass .result { color: #00ff88; }
  .test.fail .result { color: #ff3366; }
  .test.warn .result { color: #ffaa00; }
  .test .detail { font-size: 10px; color: #888; margin-top: 6px; font-family: ui-monospace, monospace; word-break: break-all; }
  .test .fix { font-size: 11px; color: #88aaff; margin-top: 6px; }
  .section-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; padding: 10px 0 6px; font-weight: 600; }
  .btn { background: #ff3366; color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600; width: 100%; margin-top: 10px; }
  .btn.alt { background: #2a2a3a; }
  .btn.go  { background: #00aa55; }
  details { background: #13131a; border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 12px; }
  details summary { cursor: pointer; color: #aaf; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; color: #aaa; font-size: 10px; margin-top: 8px; font-family: ui-monospace, monospace; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>

<h1>Moe's App Diagnostic</h1>
<div class="sub" id="ts">Initializing...</div>

<div id="verdict">
  <div class="big">.</div>
  <div>Running tests...</div>
</div>

<div class="stats">
  <div class="stat pass"><div class="n" id="np">0</div><div class="l">Pass</div></div>
  <div class="stat fail"><div class="n" id="nf">0</div><div class="l">Fail</div></div>
  <div class="stat warn"><div class="n" id="nw">0</div><div class="l">Warn</div></div>
</div>

<div id="out"></div>

<button class="btn" onclick="location.reload()">Run Again</button>
<button class="btn alt" onclick="copyReport()">Copy Full Report</button>
<button class="btn go" id="trigger-btn">Trigger Ingest + Score</button>

<details>
  <summary>Raw log</summary>
  <pre id="raw"></pre>
</details>

<script>
var REPO_BASE = 'https://moethiago.github.io/Moes-app';
var VERCEL    = 'https://moes-app-two.vercel.app';

var results = [];
var rawLog  = [];
var p = 0, f = 0, w = 0;

function logRaw(msg) {
  rawLog.push('[' + new Date().toISOString() + '] ' + msg);
  document.getElementById('raw').textContent = rawLog.join('\n');
}

function record(name, status, result, detail, fix) {
  results.push({ name: name, status: status, result: result, detail: detail || '', fix: fix || '' });
  if (status === 'pass') p++;
  if (status === 'fail') f++;
  if (status === 'warn') w++;
  document.getElementById('np').textContent = p;
  document.getElementById('nf').textContent = f;
  document.getElementById('nw').textContent = w;
  render();
  logRaw(name + ' :: ' + status.toUpperCase() + ' :: ' + result + (detail ? ' :: ' + detail : ''));
}

function render() {
  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<div class="test ' + r.status + '">';
    html += '<div class="name">' + esc(r.name) + '</div>';
    html += '<div class="result">' + esc(r.result) + '</div>';
    if (r.detail) html += '<div class="detail">' + esc(r.detail) + '</div>';
    if (r.fix)    html += '<div class="fix">FIX: ' + esc(r.fix) + '</div>';
    html += '</div>';
  }
  document.getElementById('out').innerHTML = html;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve) {
    var done  = false;
    var timer = setTimeout(function() {
      if (done) return;
      done = true;
      resolve({ ok: false, error: 'TIMEOUT after ' + ms + 'ms' });
    }, ms || 10000);
    fetch(url, { cache: 'no-store' }).then(function(r) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      r.text().then(function(text) {
        resolve({ ok: r.ok, status: r.status, text: text });
      }).catch(function(e) {
        resolve({ ok: false, error: 'Read failed: ' + e.message });
      });
    }).catch(function(e) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      resolve({ ok: false, error: e.message || 'Network error' });
    });
  });
}

function bust(url) {
  return url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();
}

function fetchJSON(url, ms) {
  return fetchWithTimeout(url, ms).then(function(res) {
    if (!res.ok) return res;
    try {
      return { ok: true, status: res.status, data: JSON.parse(res.text) };
    } catch (e) {
      return { ok: false, error: 'BAD JSON: ' + res.text.slice(0, 80) };
    }
  });
}

function checkFile(name, path, requiredKeywords) {
  return fetchWithTimeout(bust(REPO_BASE + path), 8000).then(function(res) {
    if (!res.ok) {
      record(name, 'fail', 'Cannot fetch: ' + (res.error || 'HTTP ' + res.status), path, 'Check GitHub Pages deployment.');
      return;
    }
    var text = res.text;
    var size = Math.round(text.length / 1024);
    var smartSingle = (text.match(/[\u2018\u2019]/g) || []).length;
    var smartDouble = (text.match(/[\u201C\u201D]/g) || []).length;
    if (smartSingle + smartDouble > 0) {
      record(name, 'fail', 'CORRUPT: ' + (smartSingle + smartDouble) + ' smart quote characters', path, 'Replace with clean ASCII version. Never edit JS in Notes or TextEdit.');
      return;
    }
    var fences = (text.match(/^```/gm) || []).length;
    if (fences > 0) {
      record(name, 'fail', 'CORRUPT: ' + fences + ' markdown fence lines embedded', null, 'Remove every line containing only triple backticks.');
      return;
    }
    if (requiredKeywords && requiredKeywords.length) {
      var missing = [];
      for (var i = 0; i < requiredKeywords.length; i++) {
        if (text.indexOf(requiredKeywords[i]) === -1) missing.push(requiredKeywords[i]);
      }
      if (missing.length) {
        record(name, 'warn', 'Missing symbols: ' + missing.join(', '), size + ' KB', 'File may be incomplete or an old version.');
        return;
      }
    }
    record(name, 'pass', 'Clean - ' + size + ' KB', null, null);
  });
}

function runAll() {
  document.getElementById('ts').textContent = 'Started ' + new Date().toLocaleString();
  logRaw('Diagnostic started. UA: ' + navigator.userAgent.slice(0, 80));

  Promise.resolve()

  // ── F1 FILES ───────────────────────────────────────────────
  .then(function() { return checkFile('f1-data.js',       '/js/f1/f1-data.js',       ['F1_CALENDAR','SESSION_DURATION','TEAM_COLORS','F1_STANDINGS_FALLBACK']); })
  .then(function() { return checkFile('f1-timing.js',     '/js/f1/f1-timing.js',     ['startCountdown','getCurrentSession','getNextRaceAndSession','getCurrentRaceWeekend']); })
  .then(function() { return checkFile('f1-livetiming.js', '/js/f1/f1-livetiming.js', ['fetchOpenF1Live','renderLiveTiming','startLiveTiming','fetchWithTimeout']); })
  .then(function() { return checkFile('f1-standings.js',  '/js/f1/f1-standings.js',  ['renderDriverStandings','renderConstructorStandings','loadF1Data']); })
  .then(function() { return checkFile('f1-weekend.js',    '/js/f1/f1-weekend.js',    ['renderWeekendCard','renderChampionshipContext','loadLastRaceResult']); })
  .then(function() { return checkFile('f1-session.js',    '/js/f1/f1-session.js',    ['initSessionSection','loadSessionData','fetchSessionResults','renderGridGraphic']); })

  // ── FOOTBALL FILES ─────────────────────────────────────────
  .then(function() { return checkFile('football-config.js', '/js/football/football-config.js', ['FOOTBALL_LEAGUES','BACKEND_URL']); })
  .then(function() { return checkFile('football-render.js', '/js/football/football-render.js', ['renderLeagueBlock','statusLabel','formatKickoff']); })
  .then(function() { return checkFile('football-fetch.js',  '/js/football/football-fetch.js',  ['buildFootballSection','loadAllFootball','fetchLeague']); })
  .then(function() { return checkFile('worldcup.js',        '/js/football/worldcup.js',        ['loadWorldCup','renderWCSection','formatWCDate']); })

  // ── FEED FILES ─────────────────────────────────────────────
  .then(function() { return checkFile('feed-render.js', '/js/feed/feed-render.js', ['renderNewsFeed','loadNewsFeed','FEED_URL','loadFromCache','saveToCache']); })

  // ── HEALTH FILES ───────────────────────────────────────────
  .then(function() { return checkFile('health-data.js',   '/js/health/health-data.js',   ['TARGETS','loadFoodLog','saveWorkoutLog']); })
  .then(function() { return checkFile('health-render.js', '/js/health/health-render.js', ['renderFood','renderSets']); })

  // ── CORE + INDEX ───────────────────────────────────────────
  .then(function() { return checkFile('core.js',    '/js/core.js',    ['switchTab','startClock','initSessionSection']); })
  .then(function() { return checkFile('index.html', '/index.html',    ['f1/f1-data.js','f1/f1-session.js','feed/feed-render.js','football/worldcup.js','f1-session-results','f1-next-grid']); })

  // ── PIPELINE: FEED API ─────────────────────────────────────
  .then(function() {
    return fetchJSON(VERCEL + '/api/feed', 12000).then(function(res) {
      if (!res.ok) {
        record('Feed API', 'fail', res.error || 'HTTP ' + res.status, VERCEL + '/api/feed', 'Check Vercel deployment.');
        return;
      }
      var stories = (res.data && res.data.stories) || [];
      var perCat  = (res.data && res.data.perCat)  || {};
      if (!stories.length) {
        record('Feed API', 'warn', '0 stories in KV', JSON.stringify(perCat), 'Use Trigger button to run ingest + score.');
        return;
      }
      var now  = Math.floor(Date.now() / 1000);
      var ages = stories.map(function(s) { return (now - (s.pubTs || now)) / 3600; });
      var youngest = Math.min.apply(null, ages);
      var oldest   = Math.max.apply(null, ages);
      var status   = youngest > 6 ? 'warn' : 'pass';
      record('Feed API', status,
        stories.length + ' stories, freshest ' + youngest.toFixed(1) + 'h ago',
        'Oldest: ' + oldest.toFixed(1) + 'h | ' + JSON.stringify(perCat),
        status === 'warn' ? 'Cron may not be running or no new stories passed scoring.' : null);
    });
  })

  // ── PIPELINE: STATS ────────────────────────────────────────
  .then(function() {
    return fetchJSON(VERCEL + '/api/stats', 8000).then(function(res) {
      if (!res.ok) { record('Pipeline stats', 'warn', res.error || 'unreachable', null, null); return; }
      var s = (res.data && res.data.summary) || {};
      record('Pipeline stats', 'pass',
        '$' + (s.cost24h || 0).toFixed(4) + ' last 24h | ' + (s.ingest24h || 0) + ' ingested | ' + (s.approved24h || 0) + ' approved',
        'Per cat: ' + JSON.stringify(s.catCounts || {}), null);
    });
  })

  // ── PIPELINE: INGEST ───────────────────────────────────────
  .then(function() {
    return fetchJSON(VERCEL + '/api/ingest', 20000).then(function(res) {
      if (!res.ok) { record('Vercel /api/ingest', 'fail', res.error || 'HTTP ' + res.status, null, 'Check Vercel logs.'); return; }
      var d = res.data || {};
      record('Vercel /api/ingest', 'pass',
        (d.ingested || 0) + ' new stories | ' + (d.candidates || 0) + ' candidates | ' + (d.durationMs || 0) + 'ms',
        d.perCat ? JSON.stringify(d.perCat) : null, null);
    });
  })

  // ── SPORTS: FOOTBALL API ───────────────────────────────────
  .then(function() {
    return fetchJSON(VERCEL + '/api/football?league=epl', 12000).then(function(res) {
      if (!res.ok) { record('Vercel /api/football', 'fail', res.error || 'HTTP ' + res.status, null, 'Check Vercel logs.'); return; }
      var fx = (res.data.fixtures || []).length;
      var up = (res.data.upcoming || []).length;
      record('Vercel /api/football', 'pass', fx + ' live fixtures | ' + up + ' upcoming', null, null);
    });
  })

  // ── SPORTS: F1 DATA SOURCES ───────────────────────────────
  .then(function() {
    return fetchJSON('https://api.jolpi.ca/ergast/f1/current/driverstandings.json?limit=3', 10000).then(function(res) {
      if (!res.ok) { record('Jolpica standings', 'fail', res.error, null, 'API may be down.'); return; }
      var sl = res.data && res.data.MRData && res.data.MRData.StandingsTable && res.data.MRData.StandingsTable.StandingsLists[0];
      if (sl && sl.DriverStandings && sl.DriverStandings.length) {
        var leader = sl.DriverStandings[0];
        record('Jolpica standings', 'pass', 'R' + sl.round + ' Leader: ' + leader.Driver.familyName + ' (' + leader.points + 'pts)', null, null);
      } else {
        record('Jolpica standings', 'warn', 'No standings data', null, null);
      }
    });
  })

  .then(function() {
    return fetchJSON('https://api.jolpi.ca/ergast/f1/current/last/results.json?limit=3', 10000).then(function(res) {
      if (!res.ok) { record('Jolpica last race', 'fail', res.error, null, null); return; }
      var race = res.data && res.data.MRData && res.data.MRData.RaceTable && res.data.MRData.RaceTable.Races[0];
      if (race && race.Results) {
        record('Jolpica last race', 'pass', race.raceName + ' - Winner: ' + race.Results[0].Driver.familyName, null, null);
      } else {
        record('Jolpica last race', 'warn', 'No race data', null, null);
      }
    });
  })

  .then(function() {
    return fetchJSON('https://api.openf1.org/v1/sessions?year=2026', 12000).then(function(res) {
      if (!res.ok) { record('OpenF1 API', 'warn', res.error, null, 'Used for session results + live timing.'); return; }
      if (Array.isArray(res.data) && res.data.length) {
        var latest = res.data[res.data.length - 1];
        record('OpenF1 API', 'pass', res.data.length + ' sessions | Latest: ' + latest.session_name + ' (' + latest.circuit_short_name + ')', null, null);
      } else {
        record('OpenF1 API', 'warn', 'No 2026 sessions found', null, null);
      }
    });
  })

  .then(function() {
    return fetchJSON('https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json', 10000).then(function(res) {
      if (!res.ok) { record('World Cup data', 'warn', res.error, null, null); return; }
      var m = (res.data && res.data.matches) || [];
      record('World Cup data', m.length ? 'pass' : 'warn',
        m.length ? m.length + ' matches loaded' : 'No matches yet (tournament starts Jun 11)', null, null);
    });
  })

  // ── F1 TIMING CALC ────────────────────────────────────────
  .then(function() {
    var upcoming = [
      { race:'Canadian GP',  name:'Race',        ms:Date.parse('2026-05-24T20:00:00Z') },
      { race:'Spanish GP',   name:'Practice 1',  ms:Date.parse('2026-05-29T11:30:00Z') },
      { race:'Spanish GP',   name:'Qualifying',  ms:Date.parse('2026-05-30T14:00:00Z') },
      { race:'Spanish GP',   name:'Race',        ms:Date.parse('2026-05-31T13:00:00Z') },
      { race:'Austrian GP',  name:'Practice 1',  ms:Date.parse('2026-06-26T10:30:00Z') },
      { race:'Austrian GP',  name:'Race',        ms:Date.parse('2026-06-28T13:00:00Z') },
    ];
    var now  = Date.now();
    var next = null;
    for (var i = 0; i < upcoming.length; i++) {
      if (upcoming[i].ms > now) { next = upcoming[i]; break; }
    }
    if (next) {
      var diff = next.ms - now;
      var h = Math.floor(diff / 3600000);
      var m = Math.floor(diff % 3600000 / 60000);
      var riyadh = new Date(next.ms).toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Riyadh' });
      record('F1 timing calc', 'pass', next.race + ' ' + next.name + ' in ' + h + 'h ' + m + 'm', riyadh + ' Riyadh', null);
    } else {
      record('F1 timing calc', 'warn', 'No upcoming sessions in hardcoded list', null, 'Update the sessions list in diagnostic.html.');
    }
  })

  .then(function() {
    showVerdict();
    logRaw('Complete: pass=' + p + ' fail=' + f + ' warn=' + w);
  });
}

function showVerdict() {
  var v = document.getElementById('verdict');
  var color, head, summary, fix, emoji;

  var fileFails = results.filter(function(r) { return r.status === 'fail' && r.name.indexOf('.js') > -1; });
  var apiFails  = results.filter(function(r) { return r.status === 'fail' && r.name.indexOf('.js') === -1 && r.name !== 'Feed API'; });
  var feedWarn  = results.filter(function(r) { return r.name === 'Feed API' && r.status === 'warn'; });

  if (fileFails.length > 0) {
    color = 'red'; emoji = 'X';
    head  = 'File corruption detected';
    summary = fileFails.map(function(r) { return r.name; }).join(', ') + ' cannot be parsed by the browser.';
    fix = 'Replace the broken file(s) on GitHub with the clean version from Claude.';
  } else if (apiFails.length > 0) {
    color = 'amber'; emoji = '!';
    head  = 'API failures';
    summary = apiFails.map(function(r) { return r.name; }).join(', ') + ' failed.';
    fix = 'Check Vercel env vars: ANTHROPIC_API_KEY, API_FOOTBALL_KEY, KV_REST_API_URL, KV_REST_API_TOKEN.';
  } else if (feedWarn.length > 0) {
    color = 'amber'; emoji = '!';
    head  = 'Feed is stale';
    summary = 'All files clean but news feed has not updated recently.';
    fix = 'Tap Trigger button to force a run. Check cron-job.org is calling /api/ingest every 30min and /api/score every 2h.';
  } else if (w > 0) {
    color = 'amber'; emoji = 'OK';
    head  = 'Mostly OK';
    summary = w + ' minor warning(s). App is functional.';
    fix = 'Warnings are usually pre-season data sources or minor gaps. Check the details above.';
  } else {
    color = 'green'; emoji = 'OK';
    head  = 'All systems operational';
    summary = 'Every file is clean. All APIs responding. Pipeline healthy.';
    fix = 'If the app still misbehaves, open Safari Web Inspector on a Mac for runtime errors.';
  }

  v.className = color;
  v.innerHTML =
    '<div class="big">' + emoji + '</div>' +
    '<h2>' + head + '</h2>' +
    '<div class="what">' + summary + '</div>' +
    '<div class="fix"><strong>WHAT TO DO:</strong><br>' + fix + '</div>';
}

document.getElementById('trigger-btn').addEventListener('click', function() {
  var btn = this;
  btn.textContent = 'Running ingest...';
  btn.disabled = true;
  fetchWithTimeout(VERCEL + '/api/ingest', 60000).then(function(res) {
    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = 'Trigger Ingest + Score';
      alert('Ingest FAILED: ' + (res.error || 'HTTP ' + res.status));
      return;
    }
    try {
      var d = JSON.parse(res.text);
      if (!d.ok) { btn.disabled = false; btn.textContent = 'Trigger Ingest + Score'; alert('Ingest error: ' + (d.error || 'unknown')); return; }
      btn.textContent = 'Scoring...';
      fetchWithTimeout(VERCEL + '/api/score', 90000).then(function(r2) {
        btn.disabled = false;
        btn.textContent = 'Trigger Ingest + Score';
        try {
          var d2 = JSON.parse(r2.text);
          alert('Ingest: ' + (d.ingested || 0) + ' new\nScore: ' + (d2.approved || 0) + ' approved\nCost: $' + ((d2.cost || 0).toFixed(4)) + '\n\nReload to see updated results.');
        } catch (e) { alert('Done. Reload diagnostic.'); }
      });
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Trigger Ingest + Score';
      alert('Bad response: ' + res.text.slice(0, 200));
    }
  });
});

function copyReport() {
  var lines = ["MOE'S APP DIAGNOSTIC REPORT"];
  lines.push('Time: ' + new Date().toISOString());
  lines.push('UA:   ' + navigator.userAgent);
  lines.push('Tally: pass=' + p + ' fail=' + f + ' warn=' + w);
  lines.push('');
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    lines.push('[' + r.status.toUpperCase() + '] ' + r.name);
    lines.push('  ' + r.result);
    if (r.detail) lines.push('  detail: ' + r.detail);
    if (r.fix)    lines.push('  fix:    ' + r.fix);
    lines.push('');
  }
  var text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { alert('Copied. Paste to Claude.'); }, function() { fallbackCopy(text); });
  } else { fallbackCopy(text); }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); alert('Copied.'); } catch (e) { alert('Copy failed. Use raw log.'); }
  document.body.removeChild(ta);
}

runAll();
