<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#16130F;--mute:#8A8178;--line:#EEEAE5;--soft:#F3F1EE;--acc:#F2552C;--green:#1FAF55;--green-soft:#E6F7EC;--amber:#FFF1C9;--amber-ink:#7A5200;--red:#E5484D;--blue:#2563EB;--r:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding-bottom:calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:var(--ink)}
a{color:inherit}
.wrap{padding:0 16px}
.hd{padding:calc(18px + env(safe-area-inset-top)) 16px 0}
.greet{color:var(--mute);font-size:16px}
h1{font-size:31px;line-height:1.25;margin:2px 0 14px;font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:0 16px;height:52px}
.search svg{flex:none;opacity:.55}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.search .x{display:none;color:var(--mute);font-size:22px;line-height:1;padding:6px}
.fridge{margin:14px 16px 0;width:calc(100% - 32px);display:flex;align-items:center;gap:14px;background:#141414;color:#fff;border-radius:var(--r);padding:16px;text-align:start}
.fridge .ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--acc);display:grid;place-items:center;font-size:28px}
.fridge .tx{flex:1;min-width:0}
.fridge b{display:block;font-size:18px;font-weight:700}
.fridge small{display:block;color:#C9C4BE;font-size:14px;margin-top:2px}
.fridge .go{flex:none;background:var(--green);color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:8px 16px}
.bar{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 0 10px;margin-top:6px}
.tabs,.fit{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.tabs::-webkit-scrollbar,.fit::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 17px;border-radius:999px;background:var(--soft);font-weight:600;font-size:16px}
.tab.on{background:var(--acc);color:#fff}
.fit{margin-top:10px}
.fb{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--ink)}
.fb.on{border-color:var(--ink);background:var(--ink);color:#fff}
.fb i{font-style:normal;opacity:.7}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 16px 10px}
.sec h2{font-size:21px;margin:0;font-weight:700}
.sec span{color:var(--mute);font-size:14px}
.card{position:relative;display:block;width:100%;border-radius:var(--r);overflow:hidden;background:var(--soft);text-align:start;isolation:isolate}
.card .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 32%,rgba(0,0,0,0) 55%)}
.card.noimg .ph{display:none}
.card.noimg{background:linear-gradient(135deg,#F7C59F,#F2552C)}
.card .cap{position:absolute;inset:auto 0 0 0;padding:12px 14px;color:#fff}
.card .nm{font-weight:700;font-size:17px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.card .mt{font-size:13px;opacity:.9;margin-top:2px}
.hero{display:block;margin:4px 16px 0;width:calc(100% - 32px);aspect-ratio:4/4.3}
.hero .nm{font-size:24px}
.hero .mt{font-size:15px}
.hero .cap{padding:16px 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.grid .card{aspect-ratio:4/5.4}
.pill{position:absolute;top:10px;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;line-height:1.35;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.src{inset-inline-start:10px;background:rgba(255,255,255,.94);color:var(--ink)}
.pill.st{inset-inline-end:10px}
.pills{position:absolute;top:10px;inset-inline:10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pills .pill{position:static}
.ok{background:var(--green);color:#fff}
.nr{background:var(--amber);color:var(--amber-ink)}
.fr{background:rgba(255,255,255,.94);color:var(--ink)}
.tt{width:13px;height:13px;flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 24px;font-size:16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.foot{text-align:center;color:#B9B2AA;font-size:12px;margin-top:26px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.close{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline-start:14px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.15);display:grid;place-items:center;font-size:22px;line-height:1}
.rph{position:relative;width:100%;aspect-ratio:4/4.4;max-height:64vh;background:var(--soft);overflow:hidden}
.rph img{width:100%;height:100%;object-fit:cover;display:block}
.rph.noimg{background:linear-gradient(135deg,#F7C59F,#F2552C)}
.rph.noimg img{display:none}
.rb{padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
.rb h2{font-size:26px;line-height:1.3;margin:0 0 8px}
.by{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:15px;flex-wrap:wrap}
.by b{color:var(--ink);font-weight:600}
.watch{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px;height:52px;border-radius:16px;background:#111;color:#fff;font-weight:700;font-size:17px;text-decoration:none}
.watch svg{width:20px;height:20px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.stats span{background:var(--soft);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:600}
h3{font-size:20px;margin:24px 0 4px}
.hint{color:var(--mute);font-size:14px;margin:0 0 6px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.ing .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #D8D2CB;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff}
.ing .t{flex:1;min-width:0}
.ing .t b{font-weight:600}
.ing .t small{display:block;color:var(--mute);font-size:14px;line-height:1.4}
.ing .tg{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--mute)}
.ing li.h .ck{background:var(--green);border-color:var(--green)}
.ing li.h .tg{background:var(--green-soft);color:#0E6B33}
.ing li.m .ck{border-color:var(--red)}
.ing li.m .tg{background:#FDECEC;color:var(--red)}
.ing li.l .tg{background:#E8EFFE;color:var(--blue)}
.ing li.s .ck{border-color:#E7E2DC;background:#F3F0EC;color:#A79E94}
.ing li.o .ck{border-style:dashed}
.ing li.tap{cursor:pointer}
.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:10px 44px 10px 0;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.note{margin-top:16px;background:var(--amber);color:var(--amber-ink);border-radius:16px;padding:12px 14px;font-size:15px}
.dock{position:fixed;inset:auto 0 0 0;z-index:4;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0))}
.big{display:block;width:100%;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-weight:700;font-size:17px}
.big:disabled{opacity:.55}
.big.done{background:var(--green)}
.big.done:disabled{opacity:1}
.big.dark{background:var(--ink)}
/* picker */
.ph2{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(14px + env(safe-area-inset-top)) 16px 10px 16px}
.ph2 .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline-start:52px;min-height:40px}
.ph2 h2{margin:0;font-size:22px}
.ph2 .clr{color:var(--red);font-weight:600;font-size:15px}
.ph2 .search{margin-top:10px;height:48px}
.pb{padding:4px 16px calc(110px + env(safe-area-inset-bottom))}
.grp h4{font-size:16px;margin:18px 0 8px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:16px;font-weight:500;background:#fff}
.chip.on{background:var(--green-soft);border-color:var(--green);color:#0E6B33;font-weight:600}
.chip.on::after{content:"✓";font-weight:700}
.chip.st{background:var(--soft);border-color:var(--soft)}
.chip.st.out{background:#fff;border:1.5px dashed var(--red);color:var(--red)}
.chip.st.out::after{content:"· خلص";font-size:13px;font-weight:700}
.stx{color:var(--mute);font-size:14px;margin:4px 0 10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:50;background:#141414;color:#fff;border-radius:16px;padding:13px 16px;font-size:15px;font-weight:500;text-align:center;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}.hero{aspect-ratio:16/9}}
</style>
</head>
<body>
<header class="hd">
  <div class="greet" id="greet">أهلين 👋</div>
  <h1>وش نطبخ اليوم؟</h1>
  <label class="search" for="q">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="دوّري وصفة أو مكوّن" autocomplete="off" enterkeyhint="search">
    <button class="x" id="qx" type="button" aria-label="مسح">×</button>
  </label>
</header>
<button class="fridge" id="fridge" type="button"></button>
<div class="bar">
  <nav class="tabs" id="tabs"></nav>
  <div class="fit" id="fit" hidden></div>
</div>
<main id="main"></main>
<div class="foot" id="build"></div>

<section class="sheet" id="recipe" aria-hidden="true">
  <button class="close" data-back type="button" aria-label="رجوع">✕</button>
  <div id="rbody"></div>
  <div class="dock" id="rdock"></div>
</section>

<section class="sheet" id="picker" aria-hidden="true">
  <button class="close" data-back type="button" aria-label="رجوع">✕</button>
  <div class="ph2">
    <div class="row"><h2>وش عندك بالثلاجة؟</h2><button class="clr" id="clr" type="button">مسح الكل</button></div>
    <label class="search" for="pq">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="pq" type="search" placeholder="دوّري مكوّن" autocomplete="off">
    </label>
  </div>
  <div class="pb"><p class="stx" style="margin-top:6px">اختاري كل اللي عندك بالثلاجة والمطبخ — كل ما زادت المكوّنات طلعت لك وصفات أكثر</p><div id="pbody"></div></div>
  <div class="dock"><button class="big dark" id="pdone" type="button" data-back></button></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="recipes.js"></script>
<script>
"use strict";
var BUILD="2.0", API="https://moes-app-two.vercel.app/api/health-check", PIN="1234";
var D=window.TABKH, ING=D.ing, R=D.r, BY={};
R.forEach(function(r){BY[r.id]=r;});
function $(i){return document.getElementById(i);}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ar(n){return String(n).replace(/[0-9]/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d];}).replace(/\./g,"٫");}
function normAr(s){return String(s||"").replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[()،,.\-_/]/g," ").replace(/\s+/g," ").trim().toLowerCase();}
function plural(n,one,two,few,many){if(n===1)return one;if(n===2)return two;return ar(n)+" "+(n>=3&&n<=10?few:many);}
function nRec(n){return plural(n,"وصفة وحدة","وصفتين","وصفات","وصفة");}
function nIng(n){return plural(n,"مكوّن واحد","مكوّنين","مكوّنات","مكوّن");}
function big(n){if(n>=1e6){var v=Math.round(n/1e5)/10;return ar(v)+" مليون";}if(n>=1e3)return ar(Math.round(n/1e3))+" ألف";return ar(n);}
function chip(k){var I=ING[k];return (I&&I.g)||k;}
/* photos: packed into a few files (D.np packs); each recipe has ph=[pack,offset,length] */
var PACKS={}, URLS={};
function pack(k){
  if(PACKS[k])return PACKS[k];
  var pr=fetch("p/"+D.pk+"-"+k+".bin").then(function(res){if(!res.ok)throw new Error("pack "+res.status);return res.arrayBuffer();}).then(function(buf){
    R.forEach(function(r){if(r.ph&&r.ph[0]===k&&!URLS[r.id])URLS[r.id]=URL.createObjectURL(new Blob([buf.slice(r.ph[1],r.ph[1]+r.ph[2])],{type:"image/jpeg"}));});
  });
  PACKS[k]=pr;pr.catch(function(){delete PACKS[k];});return pr;
}
function photoInto(img,id){
  var r=BY[id];if(!r||!r.ph){img.parentNode.classList.add("noimg");return;}
  if(URLS[id]){img.src=URLS[id];return;}
  pack(r.ph[0]).then(function(){if(img.dataset.ph===id)img.src=URLS[id];}).catch(function(){img.parentNode.classList.add("noimg");});
}
var phObs=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){phObs.unobserve(e.target);photoInto(e.target,e.target.dataset.ph);}});},{rootMargin:"900px 0px"}):null;
function hydrate(root){Array.prototype.forEach.call(root.querySelectorAll("img[data-ph]:not([src])"),function(img){if(URLS[img.dataset.ph]||!phObs)photoInto(img,img.dataset.ph);else phObs.observe(img);});}
function video(r){return "https://www.tiktok.com/@"+encodeURIComponent(r.a)+"/video/"+r.id;}
var TT='<svg class="tt" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-2.59-2.59c.27 0 .53.04.77.12V9.77a5.7 5.7 0 0 0-.77-.05A5.68 5.68 0 1 0 15.54 15.4V9.13a7.34 7.34 0 0 0 4.29 1.38V7.44a4.3 4.3 0 0 1-3.23-1.62z"/></svg>';

/* ---------- fridge state ---------- */
var have=new Set(), out=new Set();
(function(){
  var h=load("tabkh_fr",null);
  if(!h){h=[];load("tabkh_have",[]).forEach(function(k){if(ING[k]&&!ING[k].b)h.push(chip(k));});}
  var chips=allChips();
  h.forEach(function(c){if(chips[c]&&!chips[c].b)have.add(c);});
  load("tabkh_out",[]).forEach(function(c){if(chips[c]&&chips[c].b)out.add(c);});
  saveFridge();
})();
function saveFridge(){save("tabkh_fr",Array.from(have));save("tabkh_out",Array.from(out));}
var _chips=null;
function allChips(){
  if(_chips)return _chips;var C={};
  Object.keys(ING).forEach(function(k){var I=ING[k];if(I.x)return;var c=chip(k);
    if(!C[c])C[c]={id:c,keys:[],b:1,c:I.c,e:I.e,n:0};
    C[c].keys.push(k);if(!I.b)C[c].b=0;if(k===c){C[c].c=I.c;C[c].e=I.e;}});
  R.forEach(function(r){r.i.forEach(function(x){var I=ING[x[0]];if(I&&!I.x)C[chip(x[0])].n++;});});
  return (_chips=C);
}
function avail(k){var I=ING[k];if(!I||I.x)return true;if(I.b)return !out.has(chip(k));return have.has(chip(k));}
function missing(r){return r.i.filter(function(x){return !x[3]&&!avail(x[0]);});}
function fitOf(r){
  if(!have.size)return null;
  var m=missing(r);if(!m.length)return "now";
  if(m.length<=2&&!m.some(function(x){return x[2];}))return "near";
  return "far";
}

/* ---------- list view ---------- */
var state={tab:"all",q:"",fit:"all"};
var TABS=[["all","الكل"],["b","فطور"],["l","غداء"],["d","عشاء"],["s","سناك"]];
function drawTabs(){$("tabs").innerHTML=TABS.map(function(t){return '<button class="tab'+(state.tab===t[0]?" on":"")+'" data-tab="'+t[0]+'" type="button">'+t[1]+'</button>';}).join("");}
function matchesQ(r,q){
  if(!q)return true;
  var hay=r._h||(r._h=normAr(r.n+" "+r.an+" "+r.a+" "+r.i.map(function(x){var I=ING[x[0]];return x[0]+" "+((I&&I.g)||"");}).join(" ")));
  return q.split(" ").every(function(w){return hay.indexOf(w)>=0;});
}
function baseList(){var q=normAr(state.q);return R.filter(function(r){return (state.tab==="all"||r.m.indexOf(state.tab)>=0)&&matchesQ(r,q);});}
function counts(list){var c={now:0,near:0};list.forEach(function(r){var f=fitOf(r);if(f==="now")c.now++;else if(f==="near")c.near++;});return c;}
function drawFridge(){
  var b=$("fridge"),n=have.size,h;
  if(!n){h='<span class="ic">🧺</span><span class="tx"><b>وش عندك بالثلاجة؟</b><small>اختاري اللي عندك ونطلع لك وش تقدرين تسوين</small></span><span class="go">اختاري</span>';}
  else{var c=counts(R);
    var sub=c.now?"تقدرين تسوين "+nRec(c.now)+" الحين"+(c.near?" · و"+nRec(c.near)+" ناقصها شي بسيط":""):(c.near?nRec(c.near)+" ناقصها شي بسيط":"ضيفي مكوّنات أكثر عشان تطلع لك وصفات");
    h='<span class="ic">🧺</span><span class="tx"><b>عندك '+nIng(n)+' بالثلاجة</b><small>'+sub+'</small></span><span class="go">عدّلي</span>';}
  b.innerHTML=h;
}
function drawFit(list){
  var f=$("fit");if(!have.size){f.hidden=true;f.innerHTML="";return;}
  var c=counts(list);f.hidden=false;
  f.innerHTML=[["now","تقدرين تسوينها الحين",c.now],["near","ناقصها شي بسيط",c.near],["all","كل الوصفات",list.length]].map(function(x){
    return '<button class="fb'+(state.fit===x[0]?" on":"")+'" data-fit="'+x[0]+'" type="button">'+x[1]+' <i>'+ar(x[2])+'</i></button>';}).join("");
}
function statusPill(r){
  var f=fitOf(r);if(!f)return "";
  if(f==="now")return '<span class="pill ok">✓ عندك كل شي</span>';
  var m=missing(r);
  if(f==="near")return '<span class="pill nr">ناقص: '+esc(m.map(function(x){return x[0];}).join(" و "))+'</span>';
  if(m.length<=2)return '<span class="pill fr">ناقص: '+esc(m.map(function(x){return x[0];}).join(" و "))+'</span>';
  return '<span class="pill fr">ناقص '+ar(m.length)+' أشياء</span>';
}
function meta(r){return ar(r.t)+" دقيقة"+(r.k?" · "+ar(r.k)+" سعرة":"");}
function card(r,hero){
  return '<button class="card'+(hero?" hero":"")+'" data-id="'+r.id+'" type="button">'+
    '<img class="ph" data-ph="'+r.id+'" alt="" decoding="async" onerror="this.parentNode.classList.add(\'noimg\')">'+
    '<span class="pills"><span class="pill src">'+TT+'♥ '+big(r.lk)+'</span>'+statusPill(r)+'</span>'+
    '<span class="cap"><span class="nm">'+esc(r.n)+'</span><span class="mt">'+(hero?esc(r.an)+" · ":"")+meta(r)+'</span></span></button>';
}
function render(){
  var base=baseList();drawFit(base);drawFridge();
  var list=base, extra=[];
  if(have.size&&state.fit!=="all"){list=base.filter(function(r){return fitOf(r)===state.fit;});if(state.fit==="now")extra=base.filter(function(r){return fitOf(r)==="near";});}
  else if(have.size){var mc={};base.forEach(function(r,i){mc[r.id]=missing(r).length*1000+i;});list=base.slice().sort(function(a,b){return mc[a.id]-mc[b.id];});}
  var h="";
  if(!list.length){
    if(have.size&&state.fit==="now")h='<div class="empty"><b>ما فيه وصفة كاملة بالمكوّنات اللي اخترتيها</b>ضيفي مكوّنات أكثر من الثلاجة والمطبخ</div>';
    else if(have.size&&state.fit==="near")h='<div class="empty"><b>ما فيه وصفة ناقصها شي بسيط</b>ضيفي مكوّنات أكثر من الثلاجة</div>';
    else h='<div class="empty"><b>ما لقينا شي</b>جربي كلمة ثانية</div>';
  }else{
    var heroOn=!state.q&&!have.size&&list.length>4, hero=null, rest=list;
    if(heroOn){var day=Math.floor(Date.now()/864e5),top=list.slice(0,Math.min(12,list.length));hero=top[day%top.length];rest=list.filter(function(r){return r!==hero;});h+=card(hero,true);}
    var title=state.q?"نتائج البحث":(have.size&&state.fit==="now"?"تقدرين تسوينها الحين":(have.size&&state.fit==="near"?"ناقصها شي بسيط":(have.size?"كل الوصفات · الأقرب لك أول":"كل الوصفات")));
    h+='<div class="sec"><h2>'+title+'</h2><span>'+nRec(list.length)+'</span></div><div class="grid">'+rest.map(function(r){return card(r,false);}).join("")+'</div>';
  }
  if(extra.length)h+='<div class="sec"><h2>ناقصها شي بسيط</h2><span>'+nRec(extra.length)+'</span></div><div class="grid">'+extra.map(function(r){return card(r,false);}).join("")+'</div>';
  $("main").innerHTML=h;hydrate($("main"));
}

/* ---------- recipe sheet ---------- */
var cur=null, onList={}, lastPull=0, busy=false;
function openSheet(id){var s=$(id);s.classList.add("open");s.setAttribute("aria-hidden","false");s.scrollTop=0;document.body.classList.add("lock");history.pushState({sheet:id},"");}
function closeSheets(){["recipe","picker"].forEach(function(i){var s=$(i);if(s.classList.contains("open")){s.classList.remove("open");s.setAttribute("aria-hidden","true");}});document.body.classList.remove("lock");}
function toAdd(r){
  var seen={};
  return missing(r).filter(function(x){var I=ING[x[0]];if(!I||I.x||onList[x[0]])return false;var m=normAr(I.m);if(seen[m])return false;seen[m]=1;return true;}).map(function(x){return x[0];});
}
function drawRecipe(){
  var r=cur;if(!r)return;
  var hs=have.size>0, miss=missing(r), mk={};miss.forEach(function(x){mk[x[0]]=1;});
  var rows=r.i.map(function(x){
    var k=x[0],I=ING[k]||{},cls=[],tag="",ck="";
    if(x[2])cls.push("main");
    if(x[3]){cls.push("o");tag="اختياري";}
    else if(I.x){cls.push("s");tag="";}
    else if(I.b){ if(out.has(chip(k))){cls.push("m");tag=onList[k]?"":"خلصان";} else {cls.push("s");ck="✓";tag="من البيت";} }
    else if(mk[k]){cls.push("m");tag=hs?"ناقص":"";}
    else {cls.push("h");ck="✓";tag="عندك";}
    if(onList[k]&&(mk[k]||x[3])){cls=cls.filter(function(c){return c!=="m";});cls.push("l");tag="بالمقاضي ✓";}
    var tap=!I.x;if(tap)cls.push("tap");
    return '<li class="'+cls.join(" ")+'"'+(tap?' data-tog="'+esc(k)+'"':'')+'><span class="ck">'+ck+'</span><span class="t"><b>'+esc(k)+'</b><small>'+esc(x[1])+'</small></span>'+(tag?'<span class="tg">'+tag+'</span>':'')+'</li>';
  }).join("");
  var have_n=r.i.filter(function(x){return !x[3]&&!mk[x[0]];}).length, req=r.i.filter(function(x){return !x[3];}).length;
  var stats=['<span>⏱ '+ar(r.t)+' دقيقة</span>','<span>🍽 '+(r.s===1?"شخص واحد":r.s===2?"شخصين":ar(r.s)+" أشخاص")+'</span>'];
  if(r.k)stats.push('<span>🔥 '+ar(r.k)+' سعرة للحصة</span>');
  if(r.p)stats.push('<span>💪 '+ar(r.p)+' جم بروتين</span>');
  $("rbody").innerHTML=
    '<div class="rph"><img data-ph="'+r.id+'" alt="" onerror="this.parentNode.classList.add(\'noimg\')"></div>'+
    '<div class="rb"><h2>'+esc(r.n)+'</h2>'+
    '<div class="by">'+TT+'<b>'+esc(r.an)+'</b><span dir="ltr">@'+esc(r.a)+'</span><span>· ♥ '+big(r.lk)+'</span></div>'+
    '<a class="watch" href="'+video(r)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>شوفي الفيديو على تيك توك</a>'+
    '<div class="stats">'+stats.join("")+'</div>'+
    '<h3>المقادير</h3><p class="hint">'+(hs?("عندك "+ar(have_n)+" من "+ar(req)+" · "):"")+'اضغطي على المكوّن اللي عندك عشان نعلّمه</p>'+
    '<ul class="ing">'+rows+'</ul>'+
    '<h3>الطريقة</h3><ol class="steps">'+r.st.map(function(s){return "<li>"+esc(s)+"</li>";}).join("")+'</ol>'+
    (r.note?'<div class="note">'+esc(r.note)+'</div>':'')+
    '</div>';
  var ri=document.querySelector("#rbody .rph img");if(ri)photoInto(ri,r.id);
  drawDock();
}
function drawDock(){
  var r=cur;if(!r)return;var ks=toAdd(r),h;
  if(busy)h='<button class="big" disabled type="button">لحظة… نضيفها للمقاضي</button>';
  else if(!ks.length){var anyMiss=missing(r).some(function(x){var I=ING[x[0]];return I&&!I.x;});
    h='<button class="big done" disabled type="button">'+(anyMiss?"كل الناقص صار بقائمة المقاضي ✓":"كل شي عندك ✓ بالعافية")+'</button>';}
  else h='<button class="big" id="addMiss" type="button">ضيفي الناقص للمقاضي ('+ar(ks.length)+')</button>';
  $("rdock").innerHTML=h;
}
function openRecipe(id){cur=BY[id];if(!cur)return;drawRecipe();openSheet("recipe");pullList();}
function toggleIng(k){
  var I=ING[k];if(!I||I.x)return;var c=chip(k);
  if(I.b){if(out.has(c))out.delete(c);else out.add(c);}
  else{if(have.has(c))have.delete(c);else have.add(c);}
  saveFridge();drawRecipe();
}

/* ---------- مقاضي ---------- */
async function call(body){
  body.pin=PIN;var ctl=new AbortController(),t=setTimeout(function(){ctl.abort();},20000);
  try{var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});
    var j=await r.json().catch(function(){return {};});
    if(r.status===409)return {conflict:true};
    if(!r.ok)throw new Error(j.error||("http "+r.status));
    return j;}finally{clearTimeout(t);}
}
var NM={};Object.keys(ING).forEach(function(k){NM[k]=normAr(ING[k].m);});
function index(st){var ix={};Object.keys(st.items||{}).forEach(function(id){var it=st.items[id];if(it&&it.name!=null){var n=normAr(it.name);if(!(n in ix))ix[n]=id;}});return ix;}
function markList(st){onList={};if(!st||!st.list)return;var ix=index(st);Object.keys(ING).forEach(function(k){var id=ix[NM[k]];if(id&&st.list[id])onList[k]=1;});}
async function pullList(){
  if(Date.now()-lastPull<30000)return;
  try{var j=await call({action:"state"});if(j&&j.state){lastPull=Date.now();markList(j.state);if(cur&&!busy)drawRecipe();}}catch(e){}
}
async function addToMaqadi(){
  var r=cur;if(!r||busy)return;var keys=toAdd(r);if(!keys.length)return;
  busy=true;drawDock();
  try{
    for(var a=0;a<4;a++){
      var j=await call({action:"state"}),st=j&&j.state;
      if(!st||typeof st!=="object"||!st.items)throw new Error("nostate");
      st.list=st.list||{};var ix=index(st),added=[],now=Date.now();
      keys.forEach(function(k){var I=ING[k],n=NM[k],id=ix[n];
        if(!id){do{id=I.c+":"+I.m+":"+Math.random().toString(36).slice(2,5);}while(st.items[id]);
          st.items[id]={id:id,name:I.m,cat:I.c,em:I.e,cycle:14,cycle0:14,last:null,buys:[],prices:{},learned:0,custom:true,brands:[]};ix[n]=id;}
        if(!st.list[id]){st.list[id]={qty:1,at:now,brand:null};added.push(I.m);}
      });
      if(!added.length){markList(st);lastPull=Date.now();busy=false;drawRecipe();toast("كلها موجودة بقائمة المقاضي ✓");return;}
      var s=await call({action:"save",v:j.v,state:st});
      if(s&&s.conflict)continue;
      markList(st);lastPull=Date.now();busy=false;drawRecipe();
      toast("انضاف للمقاضي: "+added.join("، ")+" ✓");return;
    }
    throw new Error("busy");
  }catch(e){busy=false;drawRecipe();toast(navigator.onLine===false?"ما فيه نت — جربي مرة ثانية":"ما انضافت — جربي مرة ثانية بعد شوي");}
}
var tT;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(function(){t.classList.remove("show");},3200);}

/* ---------- fridge picker ---------- */
var SECS=[["دجاج ولحوم وأسماك",["meat","fish"]],["ألبان وأجبان وبيض",["dairy"]],["خضار",["veg"]],["فواكه",["fruit"]],["خبز",["bread"]],["رز ومعكرونة وحبوب",["dry","oat"]],["معلبات",["can"]],["صوصات",["sauce"]],["مجمدات",["frozen"]],["سناك وحلا",["snack","other","drink","coffee"]],["بهارات خاصة",["spice"]]];
var pickQ="";
function secOf(c){if(c.id==="بيض")return "ألبان وأجبان وبيض";for(var i=0;i<SECS.length;i++)if(SECS[i][1].indexOf(c.c)>=0)return SECS[i][0];return "سناك وحلا";}
function chipLabel(c){return c.e+" "+esc(c.id);}
function chipHay(c){return c._h||(c._h=normAr(c.id+" "+c.keys.join(" ")+" "+c.keys.map(function(k){return ING[k].m;}).join(" ")));}
function drawPicker(){
  var C=allChips(),q=normAr(pickQ),ids=Object.keys(C).filter(function(id){return !q||chipHay(C[id]).indexOf(q)>=0;});
  ids.sort(function(a,b){return C[b].n-C[a].n||a.localeCompare(b,"ar");});
  var by={},st=[];ids.forEach(function(id){var c=C[id];if(c.b){st.push(c);return;}var s=secOf(c);(by[s]=by[s]||[]).push(c);});
  var h="";
  SECS.forEach(function(s){var a=by[s[0]];if(!a||!a.length)return;
    h+='<div class="grp"><h4>'+s[0]+'</h4><div class="chips">'+a.map(function(c){return '<button class="chip'+(have.has(c.id)?" on":"")+'" data-pick="'+esc(c.id)+'" type="button">'+chipLabel(c)+'</button>';}).join("")+'</div></div>';});
  if(st.length)h+='<div class="grp"><h4>أساسيات نحسبها موجودة عندك</h4><p class="stx">لو خلص شي منها اضغطي عليه، ونضيفه للمقاضي إذا احتجتيه</p><div class="chips">'+st.map(function(c){return '<button class="chip st'+(out.has(c.id)?" out":"")+'" data-out="'+esc(c.id)+'" type="button">'+chipLabel(c)+'</button>';}).join("")+'</div></div>';
  if(!h)h='<div class="empty">ما فيه مكوّن بهالاسم</div>';
  $("pbody").innerHTML=h;drawPickDock();
}
function drawPickDock(){var c=counts(R),b=$("pdone");
  b.textContent=!have.size?"رجوع للوصفات":(c.now?"وريني الوصفات · "+nRec(c.now)+" تقدرين تسوينها":(c.near?"وريني الوصفات · "+nRec(c.near)+" ناقصها شي بسيط":"وريني الوصفات"));
  $("clr").style.visibility=have.size?"visible":"hidden";}
var pickerOpenedWith="";
function openPicker(){pickQ="";$("pq").value="";pickerOpenedWith=JSON.stringify(Array.from(have).sort())+JSON.stringify(Array.from(out).sort());drawPicker();openSheet("picker");}
function afterPicker(){
  var now=JSON.stringify(Array.from(have).sort())+JSON.stringify(Array.from(out).sort());
  if(now!==pickerOpenedWith){
    if(!have.size)state.fit="all";
    else{var c=counts(baseList());state.fit=c.now?"now":(c.near?"near":"all");}
  }
  render();
}

/* ---------- events ---------- */
window.addEventListener("popstate",function(){var wasPicker=$("picker").classList.contains("open"),wasRecipe=$("recipe").classList.contains("open");closeSheets();if(wasPicker)afterPicker();else if(wasRecipe)render();});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-back],[data-tab],[data-fit],[data-id],[data-tog],[data-pick],[data-out],#fridge,#addMiss,#clr,#qx");if(!t)return;
  if(t.hasAttribute("data-back")){history.back();return;}
  if(t.dataset.tab){state.tab=t.dataset.tab;drawTabs();render();window.scrollTo({top:Math.min(window.scrollY,$("fridge").offsetTop)});return;}
  if(t.dataset.fit){state.fit=t.dataset.fit;render();return;}
  if(t.dataset.id){openRecipe(t.dataset.id);return;}
  if(t.dataset.tog){toggleIng(t.dataset.tog);return;}
  if(t.dataset.pick){var c=t.dataset.pick;if(have.has(c))have.delete(c);else have.add(c);saveFridge();t.classList.toggle("on",have.has(c));drawPickDock();return;}
  if(t.dataset.out){var o=t.dataset.out;if(out.has(o))out.delete(o);else out.add(o);saveFridge();t.classList.toggle("out",out.has(o));return;}
  if(t.id==="fridge"){openPicker();return;}
  if(t.id==="addMiss"){addToMaqadi();return;}
  if(t.id==="clr"){have.clear();saveFridge();drawPicker();return;}
  if(t.id==="qx"){$("q").value="";state.q="";t.style.display="none";render();return;}
});
$("q").addEventListener("input",function(){var v=this.value;$("qx").style.display=v?"block":"none";clearTimeout(this._t);this._t=setTimeout(function(){state.q=v;render();},160);});
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")this.blur();});
$("pq").addEventListener("input",function(){pickQ=this.value;drawPicker();});

/* ---------- boot + self-update ---------- */
(function(){var h=new Date().getHours();$("greet").textContent=(h>=4&&h<12?"صباح الخير":"مساء الخير")+" 👋";})();
try{$("build").textContent="نسخة "+ar(BUILD);drawTabs();render();}catch(e){console.error(e);$("main").innerHTML='<div class="empty">صار خطأ بالتحميل، سكّري التطبيق وافتحيه مرة ثانية</div>';}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
  if(v&&v.build&&v.build!==BUILD&&!sessionStorage.getItem("tabkh_upd_"+v.build)){
    sessionStorage.setItem("tabkh_upd_"+v.build,"1");
    (window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}):Promise.resolve()).then(function(){location.replace(location.pathname+"?v="+v.build);});
  }}).catch(function(){});
</script>
