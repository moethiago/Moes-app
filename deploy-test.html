<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Test</title>
<style>
  body { background:#0a0a0f; color:#e8e8f0; font-family:-apple-system,sans-serif; padding:20px; }
  button { background:#ff3366; color:#fff; border:none; padding:14px 20px; border-radius:10px; font-size:16px; width:100%; margin-top:10px; }
  pre { background:#13131a; padding:14px; border-radius:8px; font-size:12px; margin-top:14px; white-space:pre-wrap; word-break:break-all; }
  h2 { color:#00ff88; margin-top:14px; }
</style>
</head>
<body>
<h1 style="color:#ff3366">Deploy Connection Test</h1>
<p style="color:#888;font-size:13px;">Tests if Claude can push files directly to your GitHub repo.</p>

<button onclick="testDeploy()">Test Connection</button>

<div id="result"></div>

<script>
function testDeploy() {
  var btn = document.querySelector('button');
  btn.textContent = 'Testing...';
  btn.disabled = true;
  document.getElementById('result').innerHTML = '';

  fetch('https://moes-app-two.vercel.app/api/deploy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      secret:  'moes-deploy-2026',
      path:    'CHANGELOG.md',
      message: 'Test deploy connection',
      content: '# Moes App Changelog\n\n## ' + new Date().toISOString().split('T')[0] + '\n- Deploy endpoint connected and working\n- Direct code updates now possible without manual GitHub edits\n'
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    btn.textContent = 'Test Connection';
    btn.disabled = false;
    if (d.ok) {
      document.getElementById('result').innerHTML =
        '<h2>Connected!</h2>' +
        '<p style="color:#aaa;font-size:13px;">Claude can now push files directly to your repo. No more copy-paste deploys.</p>' +
        '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
    } else {
      document.getElementById('result').innerHTML =
        '<h2 style="color:#ff3366">Failed</h2>' +
        '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
    }
  })
  .catch(function(e) {
    btn.textContent = 'Test Connection';
    btn.disabled = false;
    document.getElementById('result').innerHTML =
      '<h2 style="color:#ff3366">Error</h2><pre>' + e.message + '</pre>';
  });
}
</script>
</body>
</html>
